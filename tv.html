<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach DM TV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070A08">
<link rel="icon" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#070908;--card:#0F1411;--card2:#131A16;--line:rgba(255,255,255,.08);--fg:#F4F2EC;--mut:#9AA69F;--dim:#56625B;
  --g:#00E896;--gold:#D9B65C;--gold-hi:#F3E3AE;--gold-deep:#8B6914;--red:#FF5A5F;--amb:#FFB547;--ice:#7FD4FF;
  --gold-grad:linear-gradient(176deg,#F3E3AE 4%,#D9B65C 34%,#B8963F 58%,#F3E3AE 98%);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Outfit',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(70% 55% at 85% -10%,rgba(217,182,92,.10),transparent 60%),radial-gradient(60% 50% at 0% 110%,rgba(0,232,150,.06),transparent 60%),var(--bg)}
body.tv{overflow:hidden}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.goldtx{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{border-radius:22%;box-shadow:0 0 0 1px rgba(217,182,92,.35),0 .6vw 2.4vw rgba(0,0,0,.5)}

/* =================== ECRAN =================== */
#tv{position:fixed;inset:0;padding:2vw 2.4vw;display:grid;grid-template-rows:auto 1fr;gap:1.4vw}
.top{display:flex;align-items:center;gap:1.4vw;min-width:0}
.top .logo{width:3.6vw;height:3.6vw}
.top .br{font-weight:900;letter-spacing:.3em;font-size:1.25vw}
.top h2{flex:1;min-width:0;font-size:2vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1.4vw;border-left:1px solid var(--line)}
.top .now{font-size:2vw;font-weight:700;color:var(--mut)}
.tvcode{font-size:1.05vw;font-weight:800;letter-spacing:.14em;color:var(--mut);padding:.45vw .9vw;border-radius:.7vw;border:1px solid var(--line);background:rgba(255,255,255,.03);white-space:nowrap}
.tvcode b{color:var(--fg);letter-spacing:.24em;font-size:1.25vw;margin-left:.5vw}
.top .x{color:var(--gold);font-weight:300;font-size:2vw;line-height:1}
.top .club{width:auto;max-width:10vw;height:3.6vw;object-fit:contain;border-radius:.5vw;box-shadow:none}
.top .cn{font-weight:900;letter-spacing:.24em;font-size:1.25vw;text-transform:uppercase}
.pill{font-size:.95vw;font-weight:800;letter-spacing:.16em;padding:.45vw 1vw;border-radius:99px;color:#1d1503;background:var(--gold-grad)}

/* vitrine (aucun cours) */
#vit{display:grid;grid-template-columns:1.25fr 1fr;gap:4vw;align-items:center;padding:0 2vw}
.vt .logo{width:13vw;height:13vw}
.vt h1{font-size:6.4vw;line-height:.95;font-weight:900;letter-spacing:-.01em;margin:2.4vw 0 1vw}
.vt .tag{font-size:2vw;color:var(--mut);font-weight:600}
.feats{margin-top:2.6vw;display:flex;flex-direction:column;gap:1vw;min-height:9vw}
.feat{font-size:2.1vw;font-weight:700;display:flex;gap:1vw;align-items:center;opacity:0;transform:translateY(.6vw);transition:opacity .7s,transform .7s}
.feat.on{opacity:1;transform:none}
.feat i{font-style:normal;color:var(--gold);font-size:2.4vw}
.ad{background:linear-gradient(160deg,#17130A,#0E110F 60%);border:1px solid rgba(217,182,92,.35);border-radius:2vw;padding:2.4vw;text-align:center}
.ad h3{font-size:2.3vw;font-weight:800;line-height:1.15}
.ad p{font-size:1.35vw;color:var(--mut);margin:.8vw 0 1.6vw}
.qr{background:#fff;padding:1vw;border-radius:1.2vw;display:inline-flex}
.qr img,.qr canvas{display:block;width:100%!important;height:100%!important}
.ad .qr{width:17vw;height:17vw}
.stores{margin-top:1.4vw;font-size:1.2vw;color:var(--gold);font-weight:700;letter-spacing:.06em}
.paircode{position:fixed;left:2.4vw;bottom:1.4vw;font-size:1.05vw;color:var(--dim)}
.paircode b{color:var(--mut);letter-spacing:.2em;font-size:1.3vw}

/* cours */
#cls{display:grid;grid-template-columns:35% 1fr;gap:1.8vw;min-height:0}
.side{display:flex;flex-direction:column;gap:1vw;min-height:0}
.plan{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.9vw}
.part{border-radius:1.1vw;padding:1vw 1.3vw;background:var(--card);border:1px solid var(--line);transition:opacity .4s}
.part h3{font-size:1.05vw;letter-spacing:.22em;font-weight:800;color:var(--gold);display:flex;justify-content:space-between;gap:1vw;text-transform:uppercase}
.part h3 span+span{letter-spacing:.04em;color:var(--mut)}
.part ul{list-style:none;margin-top:.6vw;display:flex;flex-direction:column;gap:.45vw}
.part li{font-size:1.5vw;font-weight:600;display:grid;grid-template-columns:minmax(6vw,max-content) 1fr;column-gap:1vw;align-items:baseline;line-height:1.2}
.part li .q{color:var(--g);font-weight:800;font-size:1.35vw;max-width:15vw}
.part li .n{min-width:0}
.part li small{color:var(--mut);font-weight:500;font-size:1.05vw;margin-left:.5vw}
.part li.done{opacity:.38}
.part li.cur .n{color:var(--gold-hi)}
.part.cur{background:var(--card2);border-color:rgba(217,182,92,.6);box-shadow:inset .35vw 0 0 var(--gold),0 0 2.4vw rgba(217,182,92,.12)}
.part.done{opacity:.35}
.part h3 .no{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:2.2vw;height:2.2vw;margin-right:.9vw;border-radius:.6vw;font-size:1.1vw;letter-spacing:0;color:#08100C;background:var(--kc,var(--gold))}
.part h3 span:first-child{display:flex;align-items:center;color:var(--kc,var(--gold))}
.k-activation{--kc:#7FD4FF}.k-strength,.k-accessory,.k-sprint_plyo{--kc:#E9C46A}.k-conditioning{--kc:#00E896}
.part.cur{border-color:var(--kc,var(--gold));box-shadow:inset .35vw 0 0 var(--kc,var(--gold)),0 0 2.6vw color-mix(in srgb,var(--kc,#D9B65C) 22%,transparent)}
.live[data-k=activation]{--kc:#7FD4FF}.live[data-k=strength]{--kc:#E9C46A}.live[data-k=conditioning]{--kc:#00E896}
.live .lab{color:var(--kc,var(--gold));font-size:1.9vw}
.live:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--kc,#D9B65C) 14%,transparent),transparent 70%)}
.part .nt{font-size:1.1vw;color:var(--mut);margin-top:.5vw;line-height:1.35}
.compact .part{padding:.7vw 1.1vw}.compact .part li{font-size:1.25vw}.compact .part li .q{font-size:1.15vw}.compact .plan{gap:.6vw}.compact .part ul{gap:.25vw}
.tight .part li{font-size:1.05vw}.tight .part li .q{font-size:1vw}.tight .part h3{font-size:.9vw}
.mini{display:flex;align-items:center;gap:1.2vw;padding:1vw 1.2vw;border-radius:1.1vw;background:linear-gradient(160deg,#17130A,#0F120F);border:1px solid rgba(217,182,92,.3)}
.mini .qr{width:7vw;height:7vw;padding:.5vw;border-radius:.7vw;flex:none}
.mini b{display:block;font-size:1.45vw;line-height:1.15}
.mini span{display:block;font-size:1.05vw;color:var(--mut);margin-top:.3vw}

.live{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;
  border-radius:1.8vw;background:linear-gradient(180deg,#0D120F,#070908);border:1px solid var(--line);padding:1.6vw 2vw;overflow:hidden}
.lab{font-size:1.5vw;letter-spacing:.3em;font-weight:800;color:var(--gold);text-transform:uppercase}
.clk{font-size:15vw;font-weight:900;line-height:.95;letter-spacing:-.02em;margin:.6vw 0}
.clk.warn{color:var(--amb)}.clk.go{color:var(--g)}.clk.rest{color:var(--ice)}.clk.idle{color:var(--fg)}
.sub{font-size:2.6vw;font-weight:700}
.sub2{font-size:1.6vw;color:var(--mut);margin-top:.4vw;font-weight:600}
.mv{display:flex;align-items:center;gap:2vw;margin-top:1.4vw;max-width:100%}
.mv .fig{width:12vw;height:12vw;flex:none}
.mv .t{text-align:left;min-width:0}
.mv .t b{display:block;font-size:3.4vw;font-weight:800;line-height:1.05}
.mv .t span{display:block;font-size:1.9vw;color:var(--g);font-weight:700;margin-top:.3vw}
.mv .t em{display:block;font-size:1.4vw;color:var(--mut);font-style:normal;margin-top:.4vw}
.bar{position:absolute;left:0;bottom:0;height:.6vw;background:var(--gold-grad);transition:width .5s linear}
.nx{position:absolute;right:1.6vw;bottom:1.6vw;font-size:1.3vw;color:var(--mut);text-align:right}
.nx b{color:var(--fg);display:block;font-size:1.7vw}
.pause{position:absolute;inset:0;background:rgba(7,9,8,.72);display:flex;align-items:center;justify-content:center;font-size:5vw;font-weight:900;letter-spacing:.2em;color:var(--amb)}
.big3{font-size:30vw;font-weight:900;line-height:1}
.cue{font-size:2vw;color:var(--gold-hi);margin-top:1vw;max-width:90%;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.solo #cls{grid-template-columns:1fr}.solo .plan{display:none}.solo .side{display:none}

.rig .f1,.rig .f2,.rig .f3{animation-duration:3.6s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.rig .f1{animation-name:phA}.rig .f2{animation-name:phB}.rig .f3{animation-name:phC}
@keyframes phA{0%,18%{opacity:1}30%,100%{opacity:0}}
@keyframes phB{0%,18%{opacity:0}30%,52%{opacity:1}64%,100%{opacity:0}}
@keyframes phC{0%,52%{opacity:0}64%,100%{opacity:1}}
.anim-svg{width:100%;height:100%;display:block}

#snd{position:fixed;right:1.6vw;bottom:1.4vw;z-index:9;font:inherit;font-size:1.3vw;font-weight:800;padding:.9vw 1.6vw;border-radius:99px;border:0;
  background:var(--gold-grad);color:#1d1503;cursor:pointer;box-shadow:0 .6vw 2vw rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.conn{position:fixed;right:1.4vw;top:.4vw;font-size:.8vw;color:var(--dim)}

/* =================== TELEPHONE (telecommande) =================== */
body.ph{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.ph .hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ph .hd img{width:42px;height:42px;border-radius:11px}
.ph .hd div{font-weight:900;letter-spacing:.26em;font-size:13px}
.ph .hd small{display:block;letter-spacing:.08em;font-weight:600;color:var(--mut);font-size:12px;margin-top:2px}
.ph h1{font-size:26px;font-weight:800;line-height:1.12;margin-bottom:8px}
.ph p{color:var(--mut);font-size:15px;line-height:1.5}
.ph section{display:flex;flex-direction:column;gap:12px}
.ph input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:#0B100D;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none}
.ph input:focus{border-color:var(--gold)}
.ph .code{font-size:38px;font-weight:900;letter-spacing:.28em;text-align:center;font-variant-numeric:tabular-nums}
.ph button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}.ph a.b{text-decoration:none;color:inherit}
.ph .b{background:#151C18;border:1px solid var(--line)}.ph .b.gold{background:var(--gold-grad);color:#1d1503;border:0}.ph .b.p{background:var(--g);color:#04140C;border:0}.ph .b.am{background:var(--amb);color:#231500}.ph .it{background:#0B100D;border:1px solid var(--line)}.ph .tabs button{border:1px solid var(--line)}.ph .tabs button.on{background:var(--gold-grad);border-color:transparent}
.b{display:block;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:17px;background:#151C18;border:1px solid var(--line);text-align:center}
.b.gold{background:var(--gold-grad);color:#1d1503;border:0}
.b.p{background:var(--g);color:#04140C;border:0;font-size:22px;padding:22px}
.b.am{background:var(--amb);color:#231500}
.b:active{transform:scale(.98)}
.b:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.list{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow:auto}
.it{text-align:left;padding:13px 14px;border-radius:14px;background:#0B100D;border:1px solid var(--line);width:100%}
.it b{display:block;font-size:16px}
.it small{color:var(--mut);font-size:13px}
.st{text-align:center}
.st .lb{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--gold)}
.st .ck{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0}
.st .pz{font-size:14px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--g)}
.small{font-size:13px;color:var(--mut);text-align:center}
.lnk{color:var(--gold);text-decoration:underline;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{color:#1d1503;background:var(--gold-grad);border-color:transparent}
.ed{display:flex;flex-direction:column;gap:8px}.ed label{font-size:12px;letter-spacing:.2em;font-weight:800;color:var(--gold);text-transform:uppercase}
.ph textarea,.ph select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:#0B100D;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;resize:vertical;line-height:1.45}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.err{color:var(--red);font-size:14px;text-align:center;min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ph .chips button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.ph .chips button.on{color:#1d1503;background:var(--gold-grad);border-color:transparent}
.sprow{display:flex;gap:12px;align-items:center}
.sprow img,.sprow .ph0{width:64px;height:64px;flex:none;object-fit:contain;border-radius:12px;background:#0B100D;border:1px solid var(--line)}
.sprow .ph0{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}
.ph .file{font-size:14px;padding:10px}
.choice{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.choice .b{padding:20px;text-align:left}
.choice .b small{display:block;font-weight:500;color:var(--mut);font-size:14px;margin-top:4px}
.choice .b.gold small{color:#3a2b08}

@media (max-aspect-ratio:1/1){
  body.tv #vit{grid-template-columns:1fr;gap:6vw}
  .vt h1{font-size:12vw}.vt .tag,.feat{font-size:4vw}.vt .logo{width:24vw;height:24vw}
  .ad h3{font-size:5vw}.ad p{font-size:3vw}.ad .qr{width:40vw;height:40vw}.stores{font-size:3vw}
  #cls{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:34vh}.mini{display:none}
  .part li{font-size:3vw}.part li .q{font-size:2.8vw;max-width:none}.part h3{font-size:2.2vw}
  .top h2,.top .now{font-size:3.4vw}.top .logo{width:7vw;height:7vw}.top .br{display:none}
  .clk{font-size:26vw}.sub{font-size:5vw}.lab{font-size:3vw}.mv .t b{font-size:6vw}.mv .fig{width:24vw;height:24vw}
}
</style>
</head>
<body>

<!-- ================= ECRAN ================= -->
<div id="tv" hidden>
  <header class="top">
    <img class="logo" src="logo-dm.png" alt="">
    <span class="br goldtx">COACH DM</span>
    <span class="x" id="s-x" hidden>×</span>
    <img class="logo club" id="s-club" hidden alt="">
    <span class="cn goldtx" id="s-cn" hidden></span>
    <h2 id="s-title"></h2>
    <span class="pill" id="s-mode" hidden></span>
    <span class="tvcode num" id="s-code"></span>
    <span class="now num" id="s-now"></span>
  </header>

  <section id="vit">
    <div class="vt">
      <img class="logo" src="logo-dm.png" alt="Coach DM">
      <h1><span class="goldtx">COACH DM</span></h1>
      <div class="tag" id="v-tag"></div>
      <div class="feats" id="v-feats"></div>
    </div>
    <div class="ad">
      <h3 id="v-ad-h"></h3>
      <p id="v-ad-p"></p>
      <div class="qr" id="v-qr"></div>
      <div class="stores">App Store · Google Play</div>
    </div>
  </section>

  <section id="cls" hidden>
    <aside class="side">
      <div class="plan" id="s-plan"></div>
      <div class="mini"><div class="qr" id="m-qr"></div><div><b id="m-h"></b><span id="m-p"></span></div></div>
    </aside>
    <section class="live" id="s-live"></section>
  </section>
</div>
<div class="paircode" id="paircode" hidden></div>
<button type="button" id="snd" hidden></button>
<div class="conn" id="conn"></div>

<!-- ================= TELEPHONE ================= -->
<div id="rc" hidden>
  <div class="hd"><img src="logo-dm.png" alt=""><div class="goldtx">COACH DM TV<small id="r-sub"></small></div></div>

  <section id="r-choice" hidden>
    <h1 data-t="ch_h"></h1>
    <div class="choice">
      <button class="b gold" id="ch-rc"><span data-t="ch_rc"></span><small data-t="ch_rc_s"></small></button>
      <button class="b" id="ch-tv"><span data-t="ch_tv"></span><small data-t="ch_tv_s"></small></button>
    </div>
  </section>

  <section id="r-login" hidden>
    <h1 data-t="lg_h"></h1>
    <p data-t="lg_p"></p>
    <a class="b gold" href="app.html" data-t="lg_b"></a>
  </section>

  <section id="r-deny" hidden>
    <h1 data-t="dn_h"></h1>
    <p data-t="dn_p"></p>
  </section>

  <section id="r-code" hidden>
    <h1 data-t="cd_h"></h1>
    <p data-t="cd_p"></p>
    <input id="cd-i" class="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button class="b gold" id="cd-b" data-t="cd_b"></button>
    <p class="err" id="cd-e"></p>
  </section>

  <section id="r-pick" hidden>
    <h1 data-t="pk_h"></h1>
    <button class="b gold" id="pk-new" data-t="pk_new"></button>
    <div class="chips" id="pk-sp" hidden></div>
    <div class="tabs"><button id="tb-cls" class="on" data-t="tb_cls"></button><button id="tb-me" data-t="tb_me"></button></div>
    <input id="pk-q" type="search" autocomplete="off">
    <div class="list" id="pk-l"></div>
  </section>

  <section id="r-edit" hidden>
    <h1 data-t="ed_h"></h1>
    <p data-t="ed_p"></p>
    <input id="ed-title" autocomplete="off">
    <div class="card ed" id="ed-spc" hidden><label data-t="ed_sp"></label><select id="ed-sp"></select></div>
    <div class="card ed"><label data-t="warm"></label><textarea id="ed-warm" rows="4"></textarea></div>
    <div class="card ed"><label data-t="str"></label><textarea id="ed-str" rows="4"></textarea></div>
    <div class="card ed"><label>WOD</label>
      <div class="row3"><select id="ed-fmt"><option value="classic">—</option><option value="amrap">AMRAP</option><option value="emom">EMOM</option><option value="for_time">For Time</option><option value="rft">RFT</option></select>
        <input id="ed-min" inputmode="numeric" placeholder="min"><input id="ed-rnd" inputmode="numeric" placeholder="tours"></div>
      <textarea id="ed-wod" rows="5"></textarea></div>
    <div class="card ed" hidden><label data-t="cool"></label><textarea id="ed-cool" rows="3"></textarea></div>
    <button class="b gold" id="ed-go" data-t="ed_go"></button>
    <button class="b" id="ed-back" data-t="ed_back"></button>
    <p class="err" id="ed-e"></p>
  </section>

  <section id="r-space" hidden>
    <h1 data-t="sp_h"></h1>

function rnd(n){ var a=new Uint8Array(n); try{ crypto.getRandomValues(a); }catch(e){ for(var i=0;i<n;i++) a[i]=Math.random()*256; } return Array.from(a).map(function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }

if(!/^\d{6}$/.test(CODE||'')||!SECRET) newCode();
var OWNED=false, TOKEN=null, CLASS_AT=null, PULLING=0;

function startScreen(){

  qr(G('v-qr'),APP_URL); qr(G('m-qr'),APP_URL,256);
  feats(); paintPair();
  vIndex(); animLoad();

  register().then(function(){ connect(); pull(); });

async function register(){

async function pull(){

  var d=r.data; OWNED=!!d.owned; TOKEN=d.token||null; paintPair();
  if(d.class&&d.class.parts){
    if(d.class_at!==CLASS_AT){ CLASS_AT=d.class_at;
      var keep=null; try{ var s=JSON.parse(lsGet('cdm_tv_s')||'null'); if(s&&s.at===CLASS_AT) keep=s; }catch(e){}
      /* cours modifie en direct : on garde la partie en cours et le chrono si le plan a le meme nombre de parties */
      d.class=tvParts(d.class);
      if(!keep&&S&&W&&W.parts.length===d.class.parts.length) keep=S;
      if(MODE==='mirror') MODE=null;
      MODE='club'; club(d.class,keep); if(S) S.at=CLASS_AT; save(); show(); }

/* a l'ecran : Warm up, Skill / Strength, WOD — le retour au calme n'est pas affiche */

/* --- canal temps reel --- */
function send(m){ if(CH) CH.send({type:'broadcast',event:'m',payload:m}); }
function connect(){
  CH=sb.channel('cdm-tv-'+CODE,{config:{broadcast:{self:false}}});
  CH.on('broadcast',{event:'m'},function(p){ try{ onMsg(p.payload||{}); }catch(e){} });
  CH.subscribe(function(s){ G('conn').textContent=s==='SUBSCRIBED'?'●':'○'; if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){ setTimeout(function(){ try{ sb.removeChannel(CH); }catch(e){} connect(); },3000); } });
}
function mine(m){ return !!(TOKEN&&m.k===TOKEN); }
function onMsg(m){
  if(m.t==='sync'){ PULLING=0; pull().then(function(){ if(mine(m)&&m.lang&&['fr','en','nl'].indexOf(m.lang)>=0&&m.lang!==LANG){ LANG=m.lang; lsSet('cdm_lang',LANG); IDX=null; vIndex(); startTexts(); } push(); }); return; }
  if(m.t==='hello'){ if(m.who==='remote'&&!mine(m)){ PULLING=0; pull().then(function(){ send({t:'here',to:m.id,mode:MODE,locked:OWNED,mine:mine(m),st:mine(m)?status():null}); }); return; }
    send({t:'here',to:m.id,mode:MODE,locked:OWNED,mine:mine(m),st:mine(m)?status():null}); return; }
  if(m.t==='cmd'){ if(!mine(m)||MODE!=='club') return; LAST=Date.now(); cmd(m.c,m.v); return; }
  /* miroir du Mode Seance d'un athlete : seulement sur un ecran libre (jamais sur l'ecran d'un coach) */
  if(m.t==='mir'){ if(OWNED||MODE==='club') return; LAST=Date.now(); if(MODE!=='mirror'){ MODE='mirror'; show(); } MIR=m.d||{}; MIR._at=Date.now(); paint(); return; }

}
function startTexts(){ G('v-tag').textContent=t('tag'); G('v-ad-h').textContent=t('adh'); G('v-ad-p').textContent=t('adp'); G('m-h').textContent=t('mh'); G('m-p').textContent=t('mp'); G('snd').textContent=t('snd'); feats(); paintPair(); KEYS={}; paint(); }

/* --- moteur du cours (il tourne sur la TV, le telephone n'est qu'une telecommande) --- */
function club(w,s){
  W=w; stopClub(); S=s&&typeof s.p==='number'?s:{p:0,run:false,acc:0,t0:0,phase:'idle',set:0,item:0,restEnd:0,restTot:0,said:{},cd:0};
  if(S.phase==='count'&&Date.now()>S.cd+3000){ S.phase='idle'; }
  if(S.p>=W.parts.length) S=fresh(0);
  save();
  preloadAll(); TK=setInterval(tick,250); KEYS={}; paint(); push();
}
function preloadAll(){ if(!W) return; preload(['p_ready','p_go','p_10s','p_time','wod_half','wod_last','wod_end','p_rest','p_warm','p_skill','p_wod','p_cool','n1','n2','n3']);
  (W.parts||[]).forEach(function(p){ p.items.forEach(function(it){ preload([['x',it.slug]]); }); }); }
function save(){ if(W&&S) lsSet('cdm_tv_s',JSON.stringify(S)); }
function stopClub(){ if(TK) clearInterval(TK); TK=0; }
function part(){ return W&&W.parts[S.p]; }
function flow(p){ return !!p&&(p.block==='activation'||p.block==='recovery'); }
function isWod(p){ return !!p&&p.block==='conditioning'&&['amrap','emom','for_time','rft'].indexOf(W.fmt)>=0; }
function el(){ return S.acc+(S.run?Date.now()-S.t0:0); }
function emomI(){ return W.emi||60; }
function capW(){ if(W.fmt==='amrap') return W.cap||720; if(W.fmt==='emom') return emomI()*(W.emr||10); return W.cap||0; }
function capS(){ return isWod(part())?capW():0; }
function fresh(p){ return {p:p,run:false,acc:0,t0:0,phase:'idle',set:0,item:0,restEnd:0,restTot:0,said:{},cd:0}; }
function cmd(c,v){
  var p=part();
  if(c==='go'){
    if(S.phase==='idle') startCount();
    else if(S.phase==='work'&&!S.run){ S.run=true; S.t0=Date.now(); }
    else if(S.phase==='work'&&S.run){ S.acc=el(); S.run=false; }
  }
  else if(c==='next'||c==='prev'){ var np=S.p+(c==='next'?1:-1); if(np<0||np>=W.parts.length) return;
    S=fresh(np); var b=W.parts[np].block; if(BLV[b]) say([BLV[b]]); }
  else if(c==='reset'){ S=fresh(S.p); }
  else if(c==='set'&&flow(p)){ if(S.phase!=='work') return; S.item++; if(S.item>=p.items.length){ S.item=0; S.rounds=(S.rounds||0)+1; } beep(); }
  else if(c==='set'){ if(isWod(p)||S.phase!=='work') return; var it=p.items[S.item]||{};
    var r=it.rest||90; S.phase='rest'; S.restEnd=Date.now()+r*1000; S.restTot=r; S.said={}; say(['p_rest']); }
  else if(c==='round'){ S.rounds=Math.max(0,(S.rounds||0)+(v||1)); }
  else if(c==='voice'){ VOICE=!!v; }

}
function startCount(){ S.phase='count'; S.cd=Date.now()+10000; S.said={}; say(['p_ready']); }
function tick(){
  if(!W||!S) return; var p=part(), now=Date.now(); if(!p) return;
  if(S.phase==='count'){ var left=Math.ceil((S.cd-now)/1000);
    if(left<=3&&left>=1&&!S.said['c'+left]){ S.said['c'+left]=1; beep(); say(['n'+left]); }
    if(left<=0){ S.phase='work'; S.run=true; S.t0=now; S.acc=0; bigBeep(); say(['p_go']); save(); } }
  else if(S.phase==='rest'){ var rl=Math.ceil((S.restEnd-now)/1000), it=p.items[S.item]||{}, sets=it.sets||1;
    if(rl===10&&!S.said.r10&&S.restTot>=25){ S.said.r10=1; say(['p_10s']); }
    if(rl<=3&&rl>=1&&!S.said['r'+rl]){ S.said['r'+rl]=1; beep(); }
    if(rl<=0){ S.set++; if(S.set>=sets){ S.set=0; S.item=Math.min(p.items.length-1,S.item+1); } S.phase='work'; bigBeep(); say(['p_go']); save(); } }
  else if(S.phase==='work'&&S.run&&isWod(p)) wodVoice(p);
  if(MODE==='club') paint();
  if(now-(S.pushed||0)>1000){ S.pushed=now; push(); if(S.run) save(); }
}
function wodVoice(p){
  var e=el()/1000, cap=capS(), f=W.fmt;
  if(f==='emom'){ var I=emomI(), r=Math.floor(e/I), inI=e-r*I, left=I-inI;
    if(r>=(W.emr||10)) return finish();
    [3,2,1].forEach(function(n){ if(left<=n+.05&&left>n-1&&!S.said['e'+r+n]){ S.said['e'+r+n]=1; beep(); } });
    if(inI<.4&&r>0&&!S.said['s'+r]){ S.said['s'+r]=1; bigBeep(); var it=p.items[r%p.items.length]; if(it&&p.items.length>1) say([['x',it.slug]]); }
    return; }
  if(!cap) return;

  if(cap>=300&&l2<=60&&!S.said.last){ S.said.last=1; say(['wod_last']); }
  if(l2<=10&&l2>9&&!S.said.ten){ S.said.ten=1; say(['p_10s']); }
  [3,2,1].forEach(function(n){ if(l2<=n+.05&&l2>n-1&&!S.said['b'+n]){ S.said['b'+n]=1; beep(); } });
  if(l2<=0) finish();
}
function finish(){ if(S.phase==='done') return; S.acc=capS()*1000||el(); S.run=false; S.phase='done'; bigBeep(); say(['p_time']); setTimeout(function(){ say(['wod_end']); },2200); save(); push(); }
function status(){ if(!W||!S) return null; var p=part();
  return {flow:flow(p),p:S.p,n:W.parts.length,block:p&&p.block,run:S.run,phase:S.phase,clock:clockTxt(),rounds:S.rounds||0,voice:VOICE,wod:isWod(p),fmt:W.fmt,name:W.name}; }

function clockTxt(){ var p=part(), e=el()/1000;
  if(S.phase==='count') return String(Math.max(0,Math.ceil((S.cd-Date.now())/1000)));
  if(S.phase==='rest') return fmt((S.restEnd-Date.now())/1000);
  if(isWod(p)){ if(W.fmt==='amrap') return fmt(capS()-e); if(W.fmt==='emom'){ var I=emomI(); return fmt(I-(e%I)); } return fmt(e); }

    else if(W.fmt==='for_time') l+=' · For Time'+(W.cap?' · '+t('cap')+' '+Math.round(W.cap/60)+"'":''); else if(W.fmt==='rft') l+=' · '+(W.rft||'')+' RFT'+(W.cap?' · '+t('cap')+' '+Math.round(W.cap/60)+"'":''); }

/* « 4 × 4×10 » : si les reps contiennent deja le schema, on ne repete pas le nombre de series */

      (pp.items||[]).map(function(it){ return '<li class="'+(it.cur?'cur':it.done?'done':'')+'"><span class="q num">'+esc(it.q||'')+'</span><span class="n">'+esc(it.name||'')+'</span></li>'; }).join('')+'</ul></div>'; }).join('')); fitPlan();
  var h='', v=d.view;
  if(v==='count') h='<div class="lab">'+esc(t('ready'))+'</div><div class="big3 num goldtx">'+D(d.clock||'')+'</div>';
  else if(v==='rest'){ var left=(d.restLeft||0)-(Date.now()-d._at)/1000;
    h='<div class="lab">'+esc(t('rest'))+'</div><div class="clk num rest">'+D(fmt(left))+'</div>'+
      (d.next?'<div class="sub2">'+esc(t('next'))+'</div>'+mv({slug:d.next.slug,name:d.next.name,q:d.next.target},d.next.k||''):'')+
      (d.tip?'<div class="cue">'+esc(d.tip)+'</div>':'')+
      '<div class="bar" style="width:'+(100*(1-left/Math.max(1,d.restTotal||1))).toFixed(1)+'%"></div>'; }
  else if(v==='wod'){ h='<div class="lab">'+esc(d.fmt||'WOD')+'</div><div class="clk num go">'+D(d.clock||'')+'</div><div class="sub">'+D(d.sub||'')+'</div>'+
      (d.cur?mv({slug:d.cur.slug,name:d.cur.name,q:d.cur.target},''):''); }
  else if(v==='end'){ h='<div class="lab">'+esc(t('endT'))+'</div><div class="clk num go">✓</div><div class="sub">'+esc(d.sub||'')+'</div>'; }
  else if(v==='work'){ var f=fig(d.slug);
    h='<div class="lab">'+esc(d.block||t('work'))+'</div>'+(f?'<div class="fig rig" style="height:28vh;width:28vh;max-width:100%">'+f+'</div>':'')+
      '<div class="clk num" style="font-size:5.2vw;margin-top:1vw">'+esc(d.name||'')+'</div>'+
      (d.target?'<div class="sub num" style="font-size:4.4vw;color:var(--g)">'+esc(d.target)+'</div>':'')+
      (d.tempo?'<div class="sub2" style="color:var(--ice)">⏱ '+esc(d.tempo)+'</div>':'')+
      '<div class="sub2">'+esc(d.pips||'')+' · '+D(d.clock||'')+'</div>'+
      (d.cue?'<div class="cue">'+esc(d.cue)+'</div>':''); }
  else h='<div class="lab">'+esc(t('ath'))+'</div><div class="clk num">'+D(d.clock||'')+'</div>';
  setH('s-live',h);
}

/* =====================================================================
   TELEPHONE : la telecommande du coach
   Securite : le serveur verifie que c'est un compte COACH (tv_claim) et donne le jeton
   de pilotage. Un membre, meme Premium, est refuse. Le cours est ecrit dans la base
   (tv_set_class) : il ne circule jamais en clair sur le canal.
   ===================================================================== */
var RC={ch:null,code:null,st:null,seen:0,tab:'cls',user:null,key:null,cls:null,clsId:null,id:rnd(8),admin:false,sp:lsGet('cdm_tv_sp')||null};
var SPACES=[];
var EXL=null;
function rview(v){ ['r-choice','r-login','r-deny','r-code','r-pick','r-edit','r-space','r-ctl'].forEach(function(x){ G(x).hidden=(x!==v); }); window.scrollTo(0,0); }
function rsend(m){ if(RC.ch){ m.k=RC.key; m.id=RC.id; m.lang=LANG; RC.ch.send({type:'broadcast',event:'m',payload:m}); } }
function tap(){ try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){} }
async function startRemote(){
  document.body.className='ph'; G('rc').hidden=false; G('tv').hidden=true; G('r-sub').textContent=t('sub');
  document.querySelectorAll('[data-t]').forEach(function(e){ e.textContent=t(e.dataset.t); });
  G('pk-q').placeholder=t('q'); G('ed-title').placeholder=t('ed_title');
  ['warm','str','wod','cool'].forEach(function(k){ G('ed-'+k).placeholder=t('ph_'+k); });
  G('ed-rnd').placeholder=t('rnds');
  var ses=(await sb.auth.getSession()).data.session;
  if(!ses){ rview('r-login'); return; }
  RC.user=ses.user;
  var ok=await sb.rpc('tv_is_coach'); if(ok.error||ok.data!==true){ rview('r-deny'); return; }
  var ad=await sb.rpc('is_admin'); RC.admin=!ad.error&&ad.data===true; if(RC.admin) await loadSpaces();
  var c=QS.get('code')||lsGet('cdm_tv_remote');
  rview('r-code'); if(c&&/^\d{6}$/.test(c)){ G('cd-i').value=c; G('cd-b').click(); }
}
function rconnect(code){
  return new Promise(function(res){
    if(RC.ch) sb.removeChannel(RC.ch);
    RC.code=code; var ch=RC.ch=sb.channel('cdm-tv-'+code,{config:{broadcast:{self:false}}}); var done=false;
    ch.on('broadcast',{event:'m'},function(p){ var m=p.payload||{}; if(m.to&&m.to!==RC.id) return;
      RC.seen=Date.now();
      if(m.t==='here'&&!done){ done=true; res(m); }
      if((m.t==='st'||m.t==='here')&&m.st){ RC.st=m.st; rpaint(); } });
    ch.subscribe(function(s){ if(s==='SUBSCRIBED'){ var n=0; (function hi(){ if(done) return; if(++n>8){ done=true; return res(null); } rsend({t:'hello',who:'remote'}); setTimeout(hi,900); })(); } });
  });
}
G('cd-i').oninput=function(e){ e.target.value=e.target.value.replace(/\D/g,'').slice(0,6); };
G('cd-b').onclick=async function(){ tap(); var c=G('cd-i').value; if(c.length!==6) return; G('cd-e').textContent='…';
  var cl=await sb.rpc('tv_claim',{p_code:c});
  if(cl.error){ var em=cl.error.message||''; G('cd-e').textContent=/locked/.test(em)?t('cd_lock'):/coach_only/.test(em)?t('dn_h'):t('cd_e'); return; }
  RC.key=cl.data;
  var h=await rconnect(c); if(!h){ G('cd-e').textContent=t('cd_e'); return; }
  G('cd-e').textContent=''; lsSet('cdm_tv_remote',c);
  try{ RC.cls=JSON.parse(lsGet('cdm_tv_cls_'+c)||'null'); }catch(e){}
  if(h.mine&&h.st){ rview('r-ctl'); rpaint(); } else { rview('r-pick'); loadList(); } };

/* ---- choisir : mes cours ecrits, ou mes seances de la console ---- */
function nm(w){ return w['name_'+LANG]||w.name_fr||w.name_en||''; }
var FMT={amrap:'AMRAP',emom:'EMOM',for_time:'For Time',rft:'RFT',classic:''};
async function loadList(){
  var q=G('pk-q').value.trim().replace(/[%,()]/g,' '), html='';
  if(RC.tab==='cls'){
    var r=sb.from('tv_classes').select('id,title,updated_at,data').order('updated_at',{ascending:false}).limit(40);
    if(q) r=r.ilike('title','%'+q+'%');
    if(RC.admin&&RC.sp) r=r.eq('space_id',RC.sp);
    var d=(await r).data||[];
    html=d.length?d.map(function(c){ return '<button class="it" data-c="'+c.id+'"><b>'+esc(c.title||'—')+'</b><small>'+esc([FMT[(c.data||{}).fmt]||'',new Date(c.updated_at).toLocaleDateString(LANG==='en'?'en-GB':LANG+'-BE')].filter(Boolean).join(' · '))+'</small></button>'; }).join(''):'<p>'+esc(t('none_cls'))+'</p>';
    G('pk-l').innerHTML=html; G('pk-l').querySelectorAll('[data-c]').forEach(function(b){ var c=d.find(function(x){return x.id===b.dataset.c;}); b.onclick=function(){ tap(); RC.clsId=c.id; sendClass(c.data); }; });
    return;
  }
  var r2=sb.from('workouts').select('id,name_fr,name_en,name_nl,wod_format,time_cap_seconds,emom_rounds,updated_at').eq('created_by',RC.user.id).order('updated_at',{ascending:false}).limit(40);
  if(q) r2=r2.or('name_fr.ilike.%'+q+'%,name_en.ilike.%'+q+'%,name_nl.ilike.%'+q+'%');
  var data=(await r2).data||[];
  G('pk-l').innerHTML=data.length?data.map(function(w){ return '<button class="it" data-id="'+w.id+'"><b>'+esc(nm(w))+'</b><small>'+esc([FMT[w.wod_format]||'',w.time_cap_seconds?Math.round(w.time_cap_seconds/60)+' min':'',w.emom_rounds?w.emom_rounds+' rounds':'',new Date(w.updated_at).toLocaleDateString(LANG==='en'?'en-GB':LANG+'-BE')].filter(Boolean).join(' · '))+'</small></button>'; }).join(''):'<p>'+esc(t('none'))+'</p>';
  G('pk-l').querySelectorAll('[data-id]').forEach(function(b){ b.onclick=function(){ tap(); pick(b.dataset.id); }; });
}
/* ---- espaces (clubs, clients PT) : admin uniquement, protege par le serveur (RLS is_admin) ---- */
async function loadSpaces(){ var r=await sb.from('tv_spaces').select('id,name,kind,logo_url,created_at').order('created_at');
  SPACES=r.data||[]; if(RC.sp&&!SPACES.some(function(x){return x.id===RC.sp;})) RC.sp=null; chips(); }
function spOf(id){ return SPACES.find(function(x){return x.id===id;})||null; }
function chips(){ var b=G('pk-sp'); b.hidden=!RC.admin; if(!RC.admin) return;
  b.innerHTML='<button data-s="" class="'+(RC.sp?'':'on')+'">'+esc(t('sp_all'))+'</button>'+
    SPACES.map(function(x){ return '<button data-s="'+x.id+'" class="'+(RC.sp===x.id?'on':'')+'">'+esc(x.name)+'</button>'; }).join('')+
    '<button data-m="1">'+esc(t('sp_mng'))+'</button>';
  b.querySelectorAll('[data-s]').forEach(function(x){ x.onclick=function(){ tap(); RC.sp=x.dataset.s||null; lsSet('cdm_tv_sp',RC.sp); chips(); loadList(); }; });
  b.querySelector('[data-m]').onclick=function(){ tap(); spOpen(); }; }
function spOpen(){ G('sp-e').textContent=''; var l=G('sp-l');
  l.innerHTML=SPACES.map(function(x){ return '<div class="card ed" data-id="'+x.id+'"><div class="sprow">'+(x.logo_url?'<img src="'+esc(x.logo_url)+'" alt="">':'<div class="ph0">'+esc(t('sp_nolg'))+'</div>')+
    '<input class="spn" value="'+esc(x.name)+'" placeholder="'+esc(t('sp_name'))+'"></div>'+
    '<label class="b file">'+esc(t('sp_logo'))+'<input type="file" accept="image/*" hidden class="spf"></label>'+
    '<button class="b gold sps">'+esc(t('sp_save'))+'</button></div>'; }).join('');
  l.querySelectorAll('[data-id]').forEach(function(c){ var id=c.dataset.id;
    c.querySelector('.spf').onchange=function(e){ var f=e.target.files[0]; if(f) spLogo(id,f); };
    c.querySelector('.sps').onclick=async function(){ tap(); var n=c.querySelector('.spn').value.trim(); if(!n) return;
      var r=await sb.from('tv_spaces').update({name:n}).eq('id',id); G('sp-e').textContent=r.error?t('sp_err'):t('sp_ok'); await loadSpaces(); }; });
  rview('r-space'); }
async function spLogo(id,f){ G('sp-e').textContent='…';
  var ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,''), path=id+'/logo-'+Date.now()+'.'+ext;
  var up=await sb.storage.from('tv-logos').upload(path,f,{contentType:f.type||'image/png',upsert:true});
  if(up.error){ G('sp-e').textContent=t('sp_err'); return; }
  var url=sb.storage.from('tv-logos').getPublicUrl(path).data.publicUrl;
  var r=await sb.from('tv_spaces').update({logo_url:url}).eq('id',id);
  if(r.error){ G('sp-e').textContent=t('sp_err'); return; }
  await loadSpaces(); spOpen(); G('sp-e').textContent=t('sp_ok');
  if(RC.cls&&RC.cls.sp===id) sendClass(RC.cls); }
G('sp-new').onclick=async function(){ tap(); var r=await sb.from('tv_spaces').insert({name:t('sp_name').split(' (')[0]}).select('id').single();
  if(r.error){ G('sp-e').textContent=t('sp_err'); return; } await loadSpaces(); spOpen(); };
G('sp-back').onclick=function(){ tap(); rview('r-pick'); loadList(); };
var qT=0; G('pk-q').oninput=function(){ clearTimeout(qT); qT=setTimeout(loadList,300); };
G('tb-cls').onclick=function(){ RC.tab='cls'; G('tb-cls').className='on'; G('tb-me').className=''; loadList(); };
G('tb-me').onclick=function(){ RC.tab='me'; G('tb-me').className='on'; G('tb-cls').className=''; loadList(); };
G('pk-new').onclick=function(){ tap(); RC.clsId=null; editOpen(null); };
async function pick(id){
  var a=await Promise.all([sb.from('workouts').select('*').eq('id',id).single(),
    sb.from('workout_exercises').select('block,display_order,sets,reps,rest_sec,tempo,load_pct_1rm,exercises(slug,name_en,name_fr)').eq('workout_id',id).order('display_order')]);
  var w=a[0].data, items=a[1].data||[]; if(!w) return;
  var parts=[], cur=null;
  items.forEach(function(r){ var ex=r.exercises||{};
    if(!cur||cur.block!==r.block){ cur={block:r.block,items:[]}; parts.push(cur); }
    cur.items.push({slug:ex.slug,name:ex.name_en||ex.name_fr||'',sets:r.sets||1,reps:r.reps||'',rest:r.rest_sec||0,tempo:r.tempo||'',load:r.load_pct_1rm?Math.round(r.load_pct_1rm)+'% 1RM':''}); });
  RC.clsId=null;
  sendClass({name:nm(w),fmt:w.wod_format||'classic',cap:w.time_cap_seconds||0,emi:w.emom_interval_seconds||60,emr:w.emom_rounds||0,rft:w.rft_rounds||0,parts:parts});
}
async function sendClass(c){
  var sp=c.sp&&spOf(c.sp); if(sp) c.club={name:sp.name,logo:sp.logo_url||''}; else if(!RC.admin||!c.sp) delete c.club;
  var r=await sb.rpc('tv_set_class',{p_code:RC.code,p_class:c});
  if(r.error||r.data!==true){ G('ed-e').textContent=t('cd_lock'); G('cd-e').textContent=t('cd_lock'); rview('r-code'); return false; }
  RC.cls=c; lsSet('cdm_tv_cls_'+RC.code,JSON.stringify(c));
  rsend({t:'sync'}); RC.st=null; rview('r-ctl'); rpaint(); return true;
}

/* ---- ecrire / modifier le cours du jour, en direct ---- */
var BLK=[['warm','activation'],['str','strength'],['wod','conditioning'],['cool','recovery']];
function lineOf(it){ return [qty(it),it.name].filter(Boolean).join(' ')+(it.load?' @ '+it.load:''); }
function editOpen(c){
  G('ed-e').textContent=''; G('ed-title').value=c?c.name||'':'';
  G('ed-spc').hidden=!RC.admin;
  if(RC.admin){ G('ed-sp').innerHTML='<option value="">'+esc(t('sp_none'))+'</option>'+SPACES.map(function(x){ return '<option value="'+x.id+'">'+esc(x.name)+'</option>'; }).join('');
    G('ed-sp').value=c?(c.sp||''):(RC.sp||''); }
  BLK.forEach(function(b){ var lines=[]; (c&&c.parts||[]).forEach(function(p){ var k=p.block==='conditioning'?'wod':p.block==='recovery'?'cool':p.block==='activation'?'warm':'str'; if(k===b[0]){ p.items.forEach(function(it){ lines.push(lineOf(it)); }); if(p.note) lines.push('> '+p.note); } });
    G('ed-'+b[0]).value=lines.join('\n'); });
  G('ed-fmt').value=c&&c.fmt||'classic';
  var f=G('ed-fmt').value; G('ed-min').value=c?(f==='emom'?Math.round((c.emi||60)*(c.emr||0)/60)||'':c.cap?Math.round(c.cap/60):''):'';
  G('ed-rnd').value=c?(f==='emom'?(c.emr||''):f==='rft'?(c.rft||''):''):'';
  rview('r-edit'); loadEx();
}
async function loadEx(){ if(EXL) return; var r=await sb.from('exercises').select('slug,name_en').eq('is_published',true).limit(2000);
  EXL=(r.data||[]).filter(function(x){return x.name_en&&x.name_en.length>2;}).sort(function(a,b){ return b.name_en.length-a.name_en.length; }); }
function findEx(txt){ if(!EXL) return null; var l=' '+txt.toLowerCase()+' ';
  for(var i=0;i<EXL.length;i++){ var n=EXL[i].name_en.toLowerCase(); if(l.indexOf(' '+n+' ')>=0||l.indexOf(' '+n+'s ')>=0) return EXL[i]; } return null; }
/* « 5x5 Back Squat @ 75% » -> quantite, mouvement, charge ; le bonhomme et la voix si le mouvement est connu */
function parseLine(line,block){
  var s=line.trim(); if(!s) return null; var load='';
  var at=s.match(/\s+@\s*(.+)$/)||s.match(/\s+\(([^)]*\d[^)]*)\)\s*$/); if(at){ load=at[1].trim(); s=s.slice(0,at.index).trim(); }
  var m=s.match(/^((?:\d[\d.,:'"\/-]*\s*(?:[x×]\s*\d[\d.,\/-]*)?)\s*(?:reps?|rép\.?|répétitions|cal|kcal|m|km|min|sec|s|kg|tours?|rounds?|\/côté|\/side|\/kant)?)\s+(.+)$/i);
  var q=m?m[1].trim():'', name=m?m[2].trim():s, sets=1, ex=findEx(name);
  var sm=q.match(/^(\d+)\s*[x×]\s*(.+)$/i); if(sm&&block!=='conditioning'){ sets=+sm[1]; }
  return {q:q,name:ex?ex.name_en:name,slug:ex?ex.slug:null,load:load,sets:sets,reps:q,rest:block==='strength'?120:(block==='activation'||block==='recovery')?0:60};
}
G('ed-go').onclick=async function(){ tap();
  var parts=[]; BLK.forEach(function(b){ var notes=[], ls=G('ed-'+b[0]).value.split('\n').filter(function(l){ var m=l.match(/^\s*>\s*(.+)$/); if(m){ notes.push(m[1].trim()); return false; } return true; });
    var items=ls.map(function(l){ return parseLine(l,b[1]); }).filter(Boolean); if(items.length){ var pp={block:b[1],items:items}; if(notes.length) pp.note=notes.join(' '); parts.push(pp); } });
  if(!parts.length){ G('ed-e').textContent=t('ed_empty'); return; }
  var f=G('ed-fmt').value, mn=parseInt(G('ed-min').value,10)||0, rn=parseInt(G('ed-rnd').value,10)||0;
  var c={name:G('ed-title').value.trim()||t('club'),fmt:f,cap:f==='emom'?0:mn*60,emi:f==='emom'&&rn&&mn?Math.round(mn*60/rn):60,emr:f==='emom'?(rn||mn||10):0,rft:f==='rft'?rn:0,parts:parts};
  /* garde le cours pour le reutiliser (prive : seul ce coach le voit) */
  var spid=RC.admin?(G('ed-sp').value||null):(RC.cls&&RC.cls.sp||null); if(spid) c.sp=spid;
  var row={title:c.name,data:c,updated_at:new Date().toISOString()}; if(RC.admin) row.space_id=spid;
  var r=RC.clsId?await sb.from('tv_classes').update(row).eq('id',RC.clsId).select('id').single():await sb.from('tv_classes').insert(row).select('id').single();
  if(r.data) RC.clsId=r.data.id;
  await sendClass(c); };
G('ed-back').onclick=function(){ tap(); rview(RC.cls?'r-ctl':'r-pick'); if(!RC.cls) loadList(); };

/* ---- pilotage ---- */
function rcmd(c,v){ tap(); rsend({t:'cmd',c:c,v:v}); }
G('c-go').onclick=function(){ rcmd('go'); }; G('c-set').onclick=function(){ rcmd('set'); };
G('c-prev').onclick=function(){ rcmd('prev'); }; G('c-next').onclick=function(){ rcmd('next'); }; G('c-reset').onclick=function(){ rcmd('reset'); };
G('c-rp').onclick=function(){ rcmd('round',1); }; G('c-rm').onclick=function(){ rcmd('round',-1); };
G('c-voice').onclick=function(){ rcmd('voice',!(RC.st&&RC.st.voice!==false)); };
G('c-chg').onclick=function(){ tap(); rview('r-pick'); loadList(); };
G('c-edit').onclick=function(){ tap(); editOpen(RC.cls); };
G('c-quit').onclick=async function(e){ e.preventDefault(); await sb.rpc('tv_release',{p_code:RC.code}); rsend({t:'sync'}); lsSet('cdm_tv_remote',null); if(RC.ch) sb.removeChannel(RC.ch); RC.ch=null; RC.st=null; RC.cls=null; rview('r-code'); };
function rpaint(){
  var s=RC.st||{}, live=Date.now()-RC.seen<5000;
  G('c-dot').className='dot'+(live?' on':''); G('c-conn').textContent=(live?t('conn'):t('lost'))+' · '+(RC.code||'');
  G('c-lab').textContent=(s.block?t(BL[s.block]||'str').toUpperCase():'')+(s.n?'  ·  '+t('part')+' '+(s.p+1)+'/'+s.n:'');
  G('c-clk').textContent=s.clock||'0:00';
  G('c-ph').textContent=(s.name?s.name+' · ':'')+(({idle:t('idle'),count:t('count'),rest:t('rest'),done:t('fin')})[s.phase]||((s.run?t('run'):t('paused'))+(s.rounds?' · '+s.rounds+' '+t('rnds'):'')));
  var go=G('c-go'); go.textContent=s.phase==='idle'?t('c_go'):s.run?t('c_pause'):t('c_res'); go.className='b p'+(s.run?' am':'');
  go.disabled=s.phase==='count'||s.phase==='done'||s.phase==='rest';
  G('c-set').hidden=!!s.wod||s.phase!=='work'; G('c-set').textContent=s.flow?t('c_nx'):t('c_set');
  G('c-rnd').hidden=!(s.wod&&['amrap','rft'].indexOf(s.fmt)>=0);
  G('c-voice').textContent=s.voice===false?t('c_voff'):t('c_von');
}
/* ===== demarrage : ecran ou telephone (a la fin : tout est defini) ===== */
var IS_RC=QS.has('remote')||QS.has('code');
var SMALL=Math.min(screen.width,screen.height)<700&&window.matchMedia&&matchMedia('(pointer:coarse)').matches;
if(IS_RC){ mkSb(false); startRemote(); }
else if(SMALL&&!QS.has('screen')&&lsGet('cdm_tv_role')!=='screen'){ choice(); }
else { mkSb(true); startScreen(); }
setInterval(function(){ if(!G('r-ctl').hidden){ rpaint(); if(RC.ch&&Date.now()-RC.seen>4000) rsend({t:'hello',who:'remote'}); } },1000);
</script>
