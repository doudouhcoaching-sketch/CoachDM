<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0A">
<meta name="color-scheme" content="dark">
<title>Coach DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0B0A; --c1:#151513; --c2:#1D1C19; --c3:#262420;
  --tx:#F4F1E9; --mu:#8F8B80; --mu2:#5F5C55;
  --gold:#DCBB72; --gold2:#C49E4C; --ink:#1B1405;
  --red:#E0574F; --blue:#5B9AD6;
  --r:22px; --rs:14px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --fd:'Barlow Condensed','Arial Narrow',sans-serif;
  --ft:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--ft);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.hidden{display:none!important}

/* --- ecrans qu'on fait glisser --- */
.track{position:fixed;inset:0 0 calc(64px + var(--sab)) 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.sc{flex:0 0 100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(14px + var(--sat)) 18px 28px;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.in{max-width:520px;margin:0 auto}

/* --- barre du bas --- */
.bar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sab));padding-bottom:var(--sab);display:flex;background:#0E0E0D;z-index:20}
.bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu2);font-size:10.5px;font-weight:500;transition:color .2s}
.bar button svg{width:22px;height:22px}
.bar button.on{color:var(--gold)}

/* --- typo --- */
.h1{font-family:var(--fd);font-weight:600;font-size:34px;line-height:1.02;letter-spacing:-.005em}
.h2{font-size:15px;font-weight:600;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.h2 a{font-size:12px;font-weight:600;color:var(--gold)}
.eb{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mu{color:var(--mu)} .sm{font-size:12px}
.num{font-family:var(--fd);font-weight:600}

/* --- en-tete Aujourd'hui --- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.av{width:38px;height:38px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-family:var(--fd);font-size:15px;font-weight:600;color:var(--gold)}
.brand{font-family:var(--fd);font-size:13px;letter-spacing:.28em;color:var(--gold);font-weight:600}
.ib{width:38px;height:38px;border-radius:50%;background:var(--c2);display:grid;place-items:center;color:var(--tx)}
.ib svg{width:19px;height:19px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk{text-align:right}
.wk b{font-family:var(--fd);font-size:28px;font-weight:600;color:var(--gold);line-height:1}
.wk span{display:block;font-size:10.5px;color:var(--mu);margin-top:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 20px}
.day{border-radius:14px;background:var(--c1);padding:8px 0 7px;text-align:center}
.day i{display:block;font-style:normal;font-size:10px;color:var(--mu)}
.day b{display:block;font-family:var(--fd);font-size:19px;font-weight:600;margin-top:2px}
.day u{display:block;width:4px;height:4px;border-radius:50%;margin:4px auto 0;background:transparent;text-decoration:none}
.day.act u{background:var(--gold)}
.day.today{background:var(--gold);color:var(--ink)}
.day.today i{color:rgba(27,20,5,.65)} .day.today.act u{background:var(--ink)}

/* --- carte photo (seance du jour) --- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;background:var(--c1)}
.ph{position:absolute;inset:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.14);transform-origin:30% 30%;filter:grayscale(1) sepia(.55) saturate(1.35) contrast(1.06) brightness(.8)}
.hero .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,10,.05) 0%,rgba(11,11,10,.15) 40%,rgba(21,21,19,.96) 78%,var(--c1) 100%)}
.hero .pad{position:relative;padding:16px 16px 18px;min-height:388px;display:flex;flex-direction:column;justify-content:flex-end}
.pill{position:absolute;top:16px;left:16px;background:var(--gold);color:var(--ink);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px}
.hero .t{font-family:var(--fd);font-size:36px;font-weight:600;line-height:1;margin:6px 0 6px}
.hero .m{font-size:12.5px;color:#C9C4B8}
.seg3{display:flex;gap:5px;margin:14px 0 14px}
.seg3 i{flex:1;height:3px;border-radius:2px}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:54px;border-radius:999px;background:linear-gradient(180deg,#E6C783,#C9A24E);color:var(--ink);font-size:16px;font-weight:700}
.cta svg{width:14px;height:14px}
.cta.sm2{height:40px;width:auto;padding:0 18px;font-size:14px}
.lock{opacity:.9}

/* --- blocs --- */
.blk{background:var(--c1);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.dm{width:36px;height:36px;border-radius:50%;background:var(--c3);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:14px;color:var(--gold);flex:0 0 auto}
.voice{display:flex;align-items:center;gap:12px;background:var(--c2);border-radius:16px;padding:10px 14px 10px 10px;margin-top:12px}
.play{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.play svg{width:14px;height:14px}
.wave{flex:1;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave i{flex:1;max-width:3px;border-radius:2px;background:#6A5A35}
.wave i.on{background:var(--gold)}
.msg{font-size:14px;line-height:1.45;margin-top:10px;color:#DDD8CC}

/* objectif du jour */
.goal3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.g{background:var(--c2);border-radius:16px;padding:12px 6px 11px;text-align:center}
.g.ok{background:rgba(220,187,114,.14)}
.ring{width:46px;height:46px;margin:0 auto 7px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.g strong{display:block;font-size:13px;font-weight:600}
.g span{display:block;font-size:10.5px;color:var(--mu);margin-top:2px}
.note{font-size:11.5px;color:var(--mu);line-height:1.45;margin-top:12px}
.restb{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--gold)}

/* habitudes */
.hab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hab .g{background:var(--c1)}

/* repas conseille */
.rec{display:flex;align-items:center;gap:12px;background:var(--c1);border-radius:18px;padding:10px;width:100%;text-align:left}
.rec img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.rec .x{flex:1;min-width:0}
.rec .k{font-size:11px;font-weight:600;color:var(--gold)}
.rec .n{font-size:15px;font-weight:600;margin:3px 0 3px;line-height:1.25}
.rec .d{font-size:11.5px;color:var(--mu)}
.plus{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;font-size:22px;font-weight:500}

/* --- S'entrainer --- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 18px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 15px;border-radius:999px;background:var(--c2);font-size:13px;font-weight:600;color:#D9D4C8}
.chip.on{background:var(--gold);color:var(--ink)}
.prog{background:var(--c1);border-radius:var(--r);overflow:hidden}
.prog .top2{display:flex;gap:14px;padding:12px}
.prog .thumb{position:relative;width:104px;height:104px;border-radius:14px;overflow:hidden;flex:0 0 auto}
.prog .thumb .ph::after{display:none}
.prog .tt{font-family:var(--fd);font-size:28px;font-weight:600;line-height:1;margin:5px 0 4px}
.bar2{height:4px;border-radius:2px;background:var(--c3);margin:12px 0 8px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold);border-radius:2px}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c2);padding:13px 14px}
.next b{display:block;font-size:14.5px;font-weight:600;margin-top:2px}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.cc{position:relative;flex:0 0 46%;height:150px;border-radius:18px;overflow:hidden;background:var(--c1);scroll-snap-align:start;text-align:left}
.cc .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,11,10,.92))}
.cc .lab{position:absolute;left:12px;right:12px;bottom:11px}
.cc .lab b{display:block;font-family:var(--fd);font-size:22px;font-weight:600;line-height:1}
.cc .lab span{display:block;font-size:11px;color:#C9C4B8;margin-top:3px}
.cc .pill{top:10px;left:10px;font-size:10.5px;padding:4px 9px}
.pg{flex:0 0 46%;scroll-snap-align:start;text-align:left}
.pg .im{position:relative;height:150px;border-radius:18px;overflow:hidden;background:var(--c1)}
.pg .im .ph::after{display:none}
.pg b{display:block;font-size:14px;font-weight:600;margin-top:9px}
.pg span{display:block;font-size:11.5px;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.grid2 .pg{flex:none}

/* --- Manger --- */
.hd2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.kc{display:flex;gap:16px;align-items:center;background:var(--c1);border-radius:var(--r);padding:18px 16px}
.big{position:relative;width:132px;height:132px;flex:0 0 auto}
.big svg{width:100%;height:100%;transform:rotate(-90deg)}
.big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big .c b{font-family:var(--fd);font-size:32px;font-weight:600;line-height:1}
.big .c span{font-size:10.5px;color:var(--mu);margin-top:3px}
.mac{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.mac div{font-size:12.5px;color:#D9D4C8;display:flex;justify-content:space-between}
.mac div b{font-weight:700;color:var(--tx)} .mac div em{font-style:normal;color:var(--mu)}
.mac p{height:4px;border-radius:2px;background:var(--c3);margin-top:6px;overflow:hidden}
.mac p i{display:block;height:100%;border-radius:2px}
.acts{display:flex;gap:8px;margin:14px 0 6px}
.acts .cta{flex:1;height:50px;font-size:15px}
.ic2{width:50px;height:50px;border-radius:50%;background:var(--c2);display:grid;place-items:center;flex:0 0 auto}
.ic2 svg{width:20px;height:20px}
.meal{display:flex;align-items:center;gap:12px;background:var(--c1);border-radius:18px;padding:10px 14px 10px 10px;margin-top:10px}
.meal .mi{width:64px;height:64px;border-radius:12px;background:var(--c2);overflow:hidden;flex:0 0 auto;display:grid;place-items:center;color:var(--mu2)}
.meal .mi img{width:100%;height:100%;object-fit:cover}
.meal .mi svg{width:24px;height:24px}
.meal .x{flex:1;min-width:0}
.meal .k{font-size:11px;color:var(--mu)}
.meal .n{font-size:14.5px;font-weight:600;line-height:1.3;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meal .d{font-size:11.5px;color:var(--mu)}
.meal .kcal{font-family:var(--fd);font-size:26px;font-weight:600}
.empty{background:var(--c1);border-radius:18px;padding:18px 16px;font-size:13.5px;color:var(--mu);line-height:1.5;margin-top:10px}

/* --- Moi --- */
.me{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.me .av{width:64px;height:64px;font-size:24px}
.me b{display:block;font-family:var(--fd);font-size:30px;font-weight:600;line-height:1}
.me span{display:block;font-size:12.5px;color:var(--gold);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.st{background:var(--c1);border-radius:18px;padding:14px 12px}
.st b{display:block;font-family:var(--fd);font-size:28px;font-weight:600;line-height:1}
.st span{display:block;font-size:11px;color:var(--mu);margin-top:4px}
.list{background:var(--c1);border-radius:var(--r);overflow:hidden;margin-top:12px}
.li{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;text-align:left}
.li+.li{box-shadow:0 -1px 0 rgba(255,255,255,.04)}
.li .lx{flex:1;min-width:0}
.li b{display:block;font-size:15px;font-weight:600}
.li span{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.li em{font-style:normal;font-size:12.5px;color:var(--gold);font-weight:600}
.li svg.ch{width:16px;height:16px;color:var(--mu2)}

/* --- divers --- */
.sk{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.gate{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(30px + var(--sab));z-index:50;background:var(--bg)}
.gate .ph img{filter:grayscale(1) sepia(.5) saturate(1.3) brightness(.55)}
.gate .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,var(--bg) 82%)}
.gate .x{position:relative}
.gate h1{font-family:var(--fd);font-size:46px;font-weight:600;line-height:.98;margin:10px 0 12px}
.gate p{color:#C9C4B8;font-size:15px;line-height:1.5;margin-bottom:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--c3);color:var(--tx);padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="gate hidden" id="gate">
  <div class="ph"><img src="" id="gate-img" alt=""></div>
  <div class="x in">
    <div class="eb">Coach DM</div>
    <h1 id="gate-t"></h1>
    <p id="gate-p"></p>
    <button class="cta" id="gate-go"></button>
  </div>
</div>

<div class="track" id="track">
  <section class="sc" id="s-today"><div class="in" id="today"></div></section>
  <section class="sc" id="s-train"><div class="in" id="train"></div></section>
  <section class="sc" id="s-club"><div class="in" id="club"></div></section>
  <section class="sc" id="s-eat"><div class="in" id="eat"></div></section>
  <section class="sc" id="s-me"><div class="in" id="me"></div></section>
</div>

<nav class="bar" id="bar"></nav>
<div class="toast" id="toast"></div>

/* le programme en cours et sa prochaine seance (meme logique que l'app actuelle) */
function current(){
  const progs=W.filter(w=>w.program_slug);
  const doneIds=new Set(DONE.map(s=>s.workout_id));
  const last=DONE.map(s=>progs.find(x=>x.id===s.workout_id)).find(Boolean);
  if(!last) return null;
  const list=progs.filter(x=>x.program_slug===last.program_slug).sort((a,b)=>(a.week_number||0)-(b.week_number||0)||(a.day_number||0)-(b.day_number||0));
  const i=list.findIndex(x=>!doneIds.has(x.id)); const w=list[i<0?0:i];
  return { slug:last.program_slug, list, w, idx:(i<0?0:i)+1, done:list.filter(x=>doneIds.has(x.id)).length };
}

    <div class="g">${ring(wml/wtg,pc(wml/wtg))}<strong>${t('water')}</strong><span>${(wml/1000).toFixed(1).replace('.',',')} / ${(wtg/1000).toFixed(1).replace('.',',')} L</span></div>
    ${sleep?`<div class="g">${ring(sleep/480,pc(sleep/480))}<strong>${t('sleep')}</strong><span>${Math.floor(sleep/60)} h ${String(sleep%60).padStart(2,'0')}</span></div>`:''}
    ${steps?`<div class="g">${ring(steps/10000,pc(steps/10000))}<strong>${t('steps')}</strong><span>${nf(steps)}</span></div>`:''}</div>`;
}
async function reco(protToday){
  const tgt=TG&&+TG.protein_g; if(!tgt) return;
  const miss=Math.round(tgt-protToday); if(miss<15) return;
  const h=new Date().getHours(); const mt=h<10?'breakfast':h<14?'lunch':h<17?'snack':'dinner';
  const r=await sb.from('recipes').select('id,name_fr,name_en,name_nl,image_url,protein_per_serving,kcal_per_serving,prep_time_min,cook_time_min,meal_type').eq('is_published',true).eq('meal_type',mt).lte('protein_per_serving',miss+10).order('protein_per_serving',{ascending:false}).limit(1).maybeSingle();
  const x=r.data; if(!x) return;
  $('#t-reco').innerHTML=`<div class="h2">${t('finish')}</div><button class="rec fade" id="t-rec"><img src="${esc(x.image_url)}" alt="" loading="lazy"><div class="x"><div class="k">${t('miss')} ${miss} ${t('prot')}</div><div class="n">${esc(pick(x,'name'))}</div><div class="d">${Math.round(x.protein_per_serving)} ${t('prot')} · ${Math.round(x.kcal_per_serving)} kcal · ${(x.prep_time_min||0)+(x.cook_time_min||0)} ${t('min')}</div></div></button>`;
  $('#t-rec').onclick=()=>legacy('tab','&t=journal');
}

/* ---------- S'entrainer ---------- */
function programs(){
  const m=new Map();
  W.forEach(w=>{ if(!w.cover_image_url||/^(goal|plan|skill)_/.test(w.program_slug)) return; const p=m.get(w.program_slug)||{slug:w.program_slug,n:0,wk:0,cov:w.cover_image_url,diff:w.difficulty,name:progName(w)}; p.n++; p.wk=Math.max(p.wk,w.week_number||0); m.set(w.program_slug,p); });
  return [...m.values()];
}
async function renderTrain(){
  const cur=current(); const ps=programs();
  const curP=cur&&ps.find(p=>p.slug===cur.slug);
  const other=ps.filter(p=>!cur||p.slug!==cur.slug);
  const pc=cur?Math.round(cur.done/cur.list.length*100):0;
  const lk=cur&&locked(cur.w);
  $('#train').innerHTML=`<div class="h1" style="margin-top:4px">${t('train')}</div>
    <div class="chips"><button class="chip on">${t('progs')}</button><button class="chip" data-l="cours">${t('cours')}</button><button class="chip" data-l="analyse">${t('analyse')}</button><button class="chip" data-l="jeux">${t('jeux')}</button></div>
    ${cur?`<div class="prog fade"><div class="top2"><div class="thumb">${img(curP?curP.cov:cur.w.cover_image_url)}</div>
      <div style="flex:1;min-width:0"><div class="eb">${t('yourprog')}</div><div class="tt">${esc(curP?curP.name:progName(cur.w))}</div>
      <div class="sm mu">${t('week')} ${cur.w.week_number||1} ${t('sur')} ${curP?curP.wk:'?'}</div>
      <div class="bar2"><i style="width:${pc}%"></i></div><div class="sm mu" style="font-size:11px">${cur.done} ${t('sdone')} ${cur.list.length}</div></div></div>
      <div class="next"><div><span class="sm mu" style="font-size:11px">${t('nextses')}</span><b>${esc(wName(cur.w))} · ${cur.w.estimated_duration_min||45} ${t('min')}</b></div>
      <button class="cta sm2" id="tr-go">${lk?esc(t('premium')):esc(t('launch'))}</button></div></div>`
      :`<div class="empty">${t('choose')}</div>`}
    <div id="tr-cours"></div>
    <div class="h2">${cur?t('other'):t('choose')}</div>
    <div class="grid2">${other.map(p=>`<button class="pg" data-p="${esc(p.slug)}"><div class="im">${img(p.cov)}</div><b>${esc(p.name)}</b><span>${p.wk} ${t('wks')} · ${t(p.diff)||''}</span></button>`).join('')}</div>`;
  const g=$('#tr-go'); if(g) g.onclick=()=>{ if(lk){ legacy('tab','&t=profile&a=sub'); return; } legacy('open','&w='+encodeURIComponent(cur.w.id)); };
  document.querySelectorAll('#train [data-p]').forEach(b=>b.onclick=()=>{ const w=W.filter(x=>x.program_slug===b.dataset.p).sort((a,c)=>(a.week_number||0)-(c.week_number||0)||(a.day_number||0)-(c.day_number||0))[0]; if(w) legacy('open','&w='+encodeURIComponent(w.id)); });
  document.querySelectorAll('#train [data-l]').forEach(b=>b.onclick=()=>{ const l=b.dataset.l; if(l==='cours') go(2); else if(l==='analyse') legacy('tab','&t=analyse'); else location.href='jeu.html'; });
  coursRow('#tr-cours',true);
}
async function coursRow(sel,short){
  const now=new Date(), end=new Date(Date.now()+7*864e5);
  const r=await sb.from('class_instances').select('id,name_fr,name_en,name_nl,cover_image_url,starts_at,ends_at,capacity,status').gte('starts_at',now.toISOString()).lt('starts_at',end.toISOString()).neq('status','cancelled').order('starts_at').limit(12);
  const cs=r.data||[];
  if(!cs.length){ if(!short) $(sel).innerHTML=`<div class="h2">${t('cweek')}</div><div class="empty">${t('c_nocours')}</div>`; return; }
  const ids=cs.map(c=>c.id); const bk=await sb.from('class_bookings').select('instance_id,status').in('instance_id',ids).eq('status','booked');
  const cnt={}; (bk.data||[]).forEach(b=>cnt[b.instance_id]=(cnt[b.instance_id]||0)+1);
  $(sel).innerHTML=`<div class="h2">${t('cweek')}<a data-all="1">${t('all')}</a></div><div class="hs fade">${cs.map(c=>{ const d=new Date(c.starts_at); const dur=c.ends_at?Math.round((new Date(c.ends_at)-d)/60000):60;
    const left=c.capacity?c.capacity-(cnt[c.id]||0):null;
    return `<button class="cc" data-c="${c.id}">${img(c.cover_image_url||'https://kkcmhviyvttwpaclrjmv.supabase.co/storage/v1/object/public/food-images/programs/hyrox-engine-12w.jpg')}<span class="pill">${esc(d.toLocaleDateString(loc(),{weekday:'short'}).replace('.',''))} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span><div class="lab"><b>${esc(pick(c,'name'))}</b><span>${dur} ${t('min')}${left!=null?' · '+(left>0?left+' '+t('places'):t('full')):''}</span></div></button>`; }).join('')}</div>`;
  document.querySelectorAll(sel+' [data-c],'+sel+' [data-all]').forEach(b=>b.onclick=()=>legacy('tab','&t=cours'));
}

/* ---------- Club ---------- */

  const wk=DONE.filter(s=>new Date(s.completed_at)>=mon).length;
  const L0=LOOP||{};
  $('#club').innerHTML=`<div class="h1" style="margin-top:4px">${t('club')}</div>
    <div class="stats" style="margin-top:18px"><div class="st"><b>${wk}</b><span>${t('c_ses')}</span></div><div class="st"><b>${L0.streak||0}</b><span>${t('streak')}</span></div><div class="st"><b>${wk*10}</b><span>${t('c_pts')}</span></div></div>
    <div id="cl-chal"></div><div id="cl-cours"></div>
    <div class="h2">${t('c_board')}</div><div class="empty">${t('c_board2')}</div>`;
  coursRow('#cl-cours',false);
  if(P.coach_id){ const r=await sb.from('community_challenges').select('id,title_fr,title_en,title_nl,target_value,end_date,status').eq('coach_id',P.coach_id).eq('status','active').limit(1).maybeSingle();
    const c=r.data; if(c){ const me=await sb.from('challenge_participants').select('current_value,rank').eq('challenge_id',c.id).eq('user_id',U.id).maybeSingle(); const v=(me.data&&+me.data.current_value)||0; const days=Math.max(0,Math.ceil((new Date(c.end_date)-Date.now())/864e5));
      $('#cl-chal').innerHTML=`<div class="blk fade" style="margin-top:14px"><div class="row" style="justify-content:space-between"><span class="eb">${t('c_chal')}</span><span class="sm mu">${t('c_left')} ${days} ${t('c_d')}</span></div>
      <div class="row" style="justify-content:space-between;margin-top:8px"><div><div class="num" style="font-size:26px">${esc(pick(c,'title'))}</div><div class="sm mu">${t('c_you')} ${nf(v)}</div></div>${me.data&&me.data.rank?`<div class="num" style="font-size:30px;color:var(--gold)">${me.data.rank}e</div>`:''}</div>
      <div class="bar2"><i style="width:${Math.min(100,Math.round(v/(+c.target_value||1)*100))}%"></i></div></div>`; } }
}

/* ---------- Manger ---------- */
async function renderEat(){
  const d=ymd(new Date());
  const r=await sb.from('food_logs').select('id,meal_type,kcal,protein_g,carbs_g,fat_g,quantity_g,foods(name_fr,name_en,name_nl,image_url)').eq('user_id',U.id).eq('logged_date',d).order('logged_at');
  const ls=r.data||[]; const sum=k=>ls.reduce((a,x)=>a+(+x[k]||0),0);
  const K=sum('kcal'), Pp=sum('protein_g'), C=sum('carbs_g'), F=sum('fat_g');
  const tk=(TG&&+TG.daily_calories_kcal)||2200, tp=(TG&&+TG.protein_g)||150, tc=(TG&&+TG.carbs_g)||250, tf=(TG&&+TG.fat_g)||70;
  const left=tk-K, c=2*Math.PI*58, v=Math.min(1,K/tk);
  const mb=(lab,a,b,col)=>`<div><span>${lab}</span><span><b>${Math.round(a)}</b> <em>/ ${Math.round(b)} g</em></span></div><p><i style="width:${Math.min(100,a/b*100)}%;background:${col}"></i></p>`;
  const groups={}; ls.forEach(x=>{ (groups[x.meal_type||'snack']=groups[x.meal_type||'snack']||[]).push(x); });
  const order=['breakfast','lunch','pre_workout','snack','post_workout','dinner'];
  const meals=order.filter(k=>groups[k]).map(k=>{ const g=groups[k]; const names=g.map(x=>pick(x.foods,'name')).filter(Boolean); const im=(g.find(x=>x.foods&&x.foods.image_url)||{}).foods;
    return `<button class="meal fade" data-j="1" style="width:100%;text-align:left"><div class="mi">${im?`<img src="${esc(im.image_url)}" alt="" loading="lazy">`:I.bowl}</div><div class="x"><div class="k">${t(k)}</div><div class="n">${esc(names.slice(0,3).join(', '))}${names.length>3?'…':''}</div><div class="d">${Math.round(g.reduce((a,x)=>a+(+x.protein_g||0),0))} ${t('prot')}</div></div><div class="kcal">${Math.round(g.reduce((a,x)=>a+(+x.kcal||0),0))}</div></button>`; }).join('');
  $('#eat').innerHTML=`<div class="hd2"><div class="h1">${t('eat')}</div><span class="sm mu">${t('today')}</span></div>
    <div class="kc fade"><div class="big"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="58" fill="none" stroke="#2A2824" stroke-width="9"/><circle cx="66" cy="66" r="58" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}"/></svg><div class="c"><b>${nf(Math.abs(left))}</b><span>${left>=0?t('left'):t('over')}</span></div></div>
      <div class="mac">${mb(t('P'),Pp,tp,'var(--red)')}${mb(t('C'),C,tc,'var(--blue)')}${mb(t('F'),F,tf,'var(--gold)')}</div></div>
    <div class="acts"><button class="cta" id="e-ph">${I.cam}${t('photo')}</button><button class="ic2" id="e-sc" aria-label="scan">${I.scan}</button><button class="ic2" id="e-se" aria-label="search">${I.search}</button></div>
    ${meals||`<div class="empty">${t('nomeal')}</div>`}
    <div id="e-snack"></div>`;
  $('#e-ph').onclick=()=>legacy('tab','&t=journal&a=photo'); $('#e-sc').onclick=()=>legacy('tab','&t=journal&a=scan'); $('#e-se').onclick=()=>legacy('tab','&t=journal&a=search');
  document.querySelectorAll('#eat [data-j]').forEach(b=>b.onclick=()=>legacy('tab','&t=journal'));
  const s=await sb.from('recipes').select('id,name_fr,name_en,name_nl,image_url,protein_per_serving,kcal_per_serving,prep_time_min,cook_time_min').eq('is_published',true).eq('meal_type','snack').gte('protein_per_serving',15).limit(30);
  const xs=s.data||[]; if(!xs.length) return; const x=xs[new Date().getDate()%xs.length];
  $('#e-snack').innerHTML=`<div class="h2">${t('snackreco')}</div><button class="rec fade" id="e-rec"><img src="${esc(x.image_url)}" alt="" loading="lazy"><div class="x"><div class="n">${esc(pick(x,'name'))}</div><div class="d">${Math.round(x.protein_per_serving)} ${t('prot')} · ${Math.round(x.kcal_per_serving)} kcal · ${(x.prep_time_min||0)+(x.cook_time_min||0)} ${t('min')}</div></div><span class="plus">+</span></button>`;
  $('#e-rec').onclick=()=>legacy('tab','&t=journal');
}

  const n=String(P.full_name||'').trim(); const first=(n.split(/\s+/)[0]||'');
  const b=await sb.from('user_badges').select('id',{count:'exact',head:true}).eq('user_id',U.id);
  const prem=ACC!=='free';
  const li=(k,s,a,extra)=>`<button class="li" data-a="${a}"><div class="lx"><b>${t(k)}</b>${s?`<span>${t(s)}</span>`:''}</div>${extra||''}${I.chev}</button>`;
  $('#me').innerHTML=`<div class="me"><div class="av">${esc(initials(P.full_name))}</div><div><b>${esc(first?first.charAt(0).toUpperCase()+first.slice(1):'Coach DM')}</b><span>${t('athlete')} · ${prem?t('premium'):t('free')}</span></div></div>
    <div class="stats"><div class="st"><b>${DONE.length}</b><span>${t('sessions')}</span></div><div class="st"><b>${(LOOP&&LOOP.streak)||0}</b><span>${t('days')}</span></div><div class="st"><b>${b.count||0}</b><span>${t('badges')}</span></div></div>

    <div class="list">${li('l_sub','', 'sub','<em>'+(prem?t('premium'):t('free'))+'</em>')}${li('l_set','l_set2','set')}${li('l_help','','help')}</div>`;

}
