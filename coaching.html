section{padding:34px 0}
.sub{color:var(--mut);margin:0 0 20px}

.per{margin:-6px 0 0;font-size:13px;color:var(--mut);min-height:1.2em}
.app{font-size:13px;color:var(--gold);margin:0;font-weight:700}

.plan li{padding-left:22px;position:relative;font-size:14.5px}

const qs=new URLSearchParams(location.search);
let LANG=qs.get('lang'); try{ if(!LANG) LANG=localStorage.getItem('cdm_lang'); }catch(_){}
if(!['fr','nl','en'].includes(LANG)) LANG=(navigator.language||'fr').slice(0,2)==='nl'?'nl':(navigator.language||'').slice(0,2)==='en'?'en':'fr';
let PER=qs.get('p')==='q'?'q':'m';
const $=s=>document.querySelector(s);
const t=k=>(T[LANG]&&T[LANG][k]!=null)?T[LANG][k]:T.fr[k];
const eur=n=>LANG==='en'?n.toLocaleString('en-GB',{maximumFractionDigits:2}):n.toLocaleString(LANG+'-BE',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function paint(){
  document.documentElement.lang=LANG;
  $('#em').placeholder=LANG==='nl'?'jij@email.be':LANG==='en'?'you@email.com':'toi@email.be';
  document.querySelectorAll('[data-k]').forEach(e=>{ const v=t(e.dataset.k); if(e.hasAttribute('data-html')) e.innerHTML=v; else e.textContent=v; });
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.querySelectorAll('#per button').forEach(b=>b.classList.toggle('on',b.dataset.p===PER));
  $('#plans').innerHTML=PLANS.map(p=>{
    const price=PER==='m'?p.m:p.q, app=Math.round(price*0.8*100)/100;
    return `<div class="plan${p.rec?' rec':''}">${p.rec?`<span class="badge">${esc(t('rec'))}</span>`:''}
      <h3>${p.id==='elite'?'Elite':p.id==='performance'?'Performance':'Starter'}</h3>
      <p class="tag">${esc(t(p.id+'_tag'))}</p>
      <div class="price"><b>${LANG==='en'?'€'+eur(price):eur(price)+' €'}</b><span>${esc(t(PER==='m'?'per_m':'per_q'))}</span></div>
      <p class="per">${PER==='q'?esc(t('eq').replace('{x}',eur(Math.round(p.q/3*100)/100))):'&nbsp;'}</p>
      <p class="app">${esc(t('app').replace('{x}',eur(app)))}</p>
      <ul>${t(p.id).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <button class="go" type="button" data-id="${p.id}">${esc(t(p.id==='elite'?'goe':'go'))} →</button></div>`;
  }).join('');
  $('#plans').querySelectorAll('.go').forEach(b=>b.onclick=()=>buy(b));
  document.title=(LANG==='nl'?'Online coaching':LANG==='en'?'Online coaching':'Coaching en ligne')+' — Coach DM';
}
async function buy(btn){
  const p=PLANS.find(x=>x.id===btn.dataset.id); const em=$('#em').value.trim();
  $('#err').textContent='';
  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ $('#err').textContent=t('e_mail'); $('#em').focus(); return; }
  document.querySelectorAll('.go').forEach(b=>b.disabled=true);
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookup_key:p.key[PER],locale:LANG,email:em})});
    const j=await r.json().catch(()=>({}));
    if(j&&j.url){ location.href=j.url; return; }
    throw new Error(j&&j.error||'x');
  }catch(_){ $('#err').textContent=t('e_net'); document.querySelectorAll('.go').forEach(b=>b.disabled=false); }
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{ LANG=b.dataset.l; try{ localStorage.setItem('cdm_lang',LANG); }catch(_){} paint(); });
document.querySelectorAll('#per button').forEach(b=>b.onclick=()=>{ PER=b.dataset.p; paint(); });
window.addEventListener('pageshow',()=>document.querySelectorAll('.go').forEach(b=>b.disabled=false));
if(qs.get('email')) $('#em').value=qs.get('email');
if(qs.get('merci')==='1'){ $('#thanks').hidden=false; }
paint();
</script>
