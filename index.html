<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>COACH DM — Power · Transform · Excel</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --g: #C9A84C; --bk: #060606; --w: #F0EBE0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bk); color: var(--w); font-family: 'Barlow', sans-serif; overflow-x: hidden; }

        /* NAV */
        nav { 
            position: fixed; top: 0; width: 100%; height: 70px; z-index: 1000; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%; 
            background: rgba(6,6,6,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201,168,76,0.1);
        }
        .nb { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 3px; color: var(--w); }
        .nm a { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: #aaa; text-transform: uppercase; margin-left: 20px; text-decoration: none; }

        /* HERO - LA VIDEO EST ICI */
        .hero { 
            height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; background: #000;
        }
        
        .v-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        
        /* On force l'iframe à couvrir l'écran sans bloquer le reste */
        .v-bg iframe {
            width: 100vw; height: 100vh; 
            pointer-events: none;
            transform: scale(1.5); /* Zoom pour enlever les bords noirs du format Short */
        }

        .v-overlay {
            position: absolute; inset: 0; 
            background: rgba(0,0,0,0.6); /* Filtre pour voir le texte */
            z-index: 2; 
        }

        .hc { position: relative; z-index: 10; text-align: center; padding: 20px; }
        .ht { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(40px, 10vw, 100px); font-weight: 900; text-transform: uppercase; line-height: 0.9; }
        .gold { color: var(--g); }

        .bg { 
            background: var(--g); color: #000; padding: 15px 30px; margin-top: 25px;
            font-weight: 800; font-family: 'Barlow Condensed', sans-serif; 
            text-transform: uppercase; border: none; cursor: pointer; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        /* SECTION PROGRAMMES (NETTOYÉE) */
        .sec { padding: 80px 5%; background: var(--bk); position: relative; z-index: 20; }
        .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .pgc { background: #111; padding: 30px; border: 1px solid #222; transition: 0.3s; }
        .pgc:hover { border-color: var(--g); }
        .ptit { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: var(--g); margin-bottom: 10px; }

        @media (max-width: 768px) { .nm { display: none; } }
    </style>
</head>
<body>

    <nav>
        <div class="nb">COACH DM</div>
        <div class="nm">
            <a href="#programmes">Programmes</a>
            <a href="mailto:contact@coachdm.com">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div class="v-bg">
            <iframe 
                src="https://www.youtube.com/embed/hl9ercg5SE4?autoplay=1&mute=1&loop=1&playlist=hl9ercg5SE4&controls=0&modestbranding=1&rel=0" 
                frameborder="0" allow="autoplay">
            </iframe>
        </div>
        <div class="v-overlay"></div>
        
        <div class="hc">
            <h1 class="ht">Power <span class="gold">Transform</span> Excel</h1>
            <button class="bg" onclick="document.getElementById('programmes').scrollIntoView()">Voir les PDF</button>
        </div>
    </section>

    <section id="programmes" class="sec">
        <h2 class="ht" style="font-size: 40px;">Programmes <span class="gold">Premium</span></h2>
        <div class="pgrid">
            <div class="pgc">
                <h3 class="ptit">Programme Élite PDF</h3>
                <p style="color:#777; font-size:14px;">Optimisation complète avec démonstrations vidéo incluses.</p>
                <p style="margin-top:15px; font-weight:bold; color:var(--g)">29.99€</p>
            </div>
            <div class="pgc">
                <h3 class="ptit">Explosivité PDF</h3>
                <p style="color:#777; font-size:14px;">Préparation physique athlétique pour le terrain.</p>
                <p style="margin-top:15px; font-weight:bold; color:var(--g)">34.99€</p>
            </div>
        </div>
    </section>

</body>
</html>
