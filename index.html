<html lang="fr">
<head>

    <title>COACH DM — Power · Transform · Excel</title>

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --g: #C9A84C; --g2: #E8C97A; --g3: #8B6914;
            --bk: #060606; --d1: #0D0D0D; --d2: #141414; --d3: #1C1C1C;
            --w: #F0EBE0; --gr: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            background: var(--bk); 
            color: var(--w); 
            font-family: 'Barlow', sans-serif; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        ::selection { background: var(--g); color: var(--bk); }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--g); }

        /* PROGRESS BAR */
        #prog { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--g3), var(--g), var(--g2)); width: 0; z-index: 9999; }

        /* NAV */
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; background: rgba(6,6,6,.9); border-bottom: 1px solid rgba(201,168,76,.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .nl { display: flex; align-items: center; gap: 12px; }
        .nl img { width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid var(--g); object-fit: cover; }
        .nb { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 3px; }
        .nm a { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #999; padding: 8px 12px; }
        .nm a:hover { color: var(--g); }
        .ncta { background: var(--g)!important; color: #060606!important; font-weight: 700!important; border-radius: 4px; }

        /* HERO & VIDEO BACKGROUND */
        .hero { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
        }
        
        .v-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Overlay pour assombrir la vidéo et rendre le texte lisible */
        .v-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(6,6,6,0.5) 0%, rgba(6,6,6,0.9) 100%);
            z-index: 2;
        }

        .hc { position: relative; z-index: 10; max-width: 900px; padding: 20px; }
        .ht { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(45px, 10vw, 120px); font-weight: 900; line-height: 0.9; text-transform: uppercase; }
        .gold { color: var(--g); text-shadow: 0 0 30px rgba(201,168,76, 0.4); }

        /* BOUTONS */
        .bg { background: var(--g); color: #000; padding: 16px 35px; font-weight: 800; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 2px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); cursor: pointer; border: none; transition: 0.3s; }
        .bg:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(201,168,76,0.3); }

        /* SECTION PROGRAMMES - MOT "YOUTUBE" SUPPRIMÉ */
        .sec { padding: 80px 5%; }
        .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .pgc { background: var(--d2); border: 1px solid rgba(201,168,76,0.1); padding: 30px; transition: 0.3s; }
        .pgc:hover { border-color: var(--g); transform: translateY(-5px); }
        .ptit { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; color: var(--g); }

        /* MOBILE */
        .burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
        .burger span { width: 25px; height: 2px; background: white; }
        
        @media (max-width: 900px) {
            .nm { display: none; }
            .burger { display: flex; }
            .v-bg { width: 180vw; } /* Pour garder du mouvement sur mobile */
        }
    </style>
</head>
