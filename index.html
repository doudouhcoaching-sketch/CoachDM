<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>COACH DM — Power · Transform · Excel</title>
    <meta name="description" content="Coach DM — NASM PES CES, Ereps Level 4, CrossFit L3 CCFT. Personal Training, Coaching Online et Programmes PDF experts.">
    
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --g: #C9A84C; --g2: #E8C97A; --g3: #8B6914;
            --bk: #060606; --d1: #0D0D0D; --d2: #141414; --d3: #1C1C1C;
            --w: #F0EBE0; --gr: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            background: var(--bk); 
            color: var(--w); 
            font-family: 'Barlow', sans-serif; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--g); }

        /* PROGRESS BAR */
        #prog { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--g3), var(--g), var(--g2)); width: 0; z-index: 9999; }

        /* NAVIGATION */
        nav { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 70px; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%; 
            background: rgba(6,6,6,0.9); border-bottom: 1px solid rgba(201,168,76,0.1); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
        }
        .nl { display: flex; align-items: center; gap: 12px; }
        .nl img { width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid var(--g); object-fit: cover; }
        .nb { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 3px; }
        
        .nm { display: flex; gap: 5px; }
        .nm a { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #999; padding: 8px 15px; transition: 0.3s; }
        .nm a:hover { color: var(--g); }
        .ncta { background: var(--g)!important; color: #060606!important; font-weight: 700!important; border-radius: 4px; }

        /* HERO SECTION AVEC VIDEO */
        .hero { 
            height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; 
            text-align: center; position: relative; overflow: hidden; 
        }
        
        .v-bg {
            position: absolute; top: 50%; left: 50%; 
            width: 100vw; height: 100vh; 
            transform: translate(-50%, -50%);
            z-index: 1; pointer-events: none;
        }
        
        /* On ajuste l'iframe pour masquer les éléments YouTube et zoomer un peu */
        .v-bg iframe {
            width: 100vw; height: 56.25vw; /* Ratio 16:9 */
            min-height: 100vh; min-width: 177.77vh; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.1);
        }

        .v-overlay {
            position: absolute; inset: 0; 
            background: linear-gradient(to bottom, rgba(6,6,6,0.4), var(--bk)); 
            z-index: 2; 
        }

        .hc { position: relative; z-index: 10; max-width: 900px; padding: 20px; }
        .ht { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(50px, 11vw, 120px); font-weight: 900; line-height: 0.85; text-transform: uppercase; margin-bottom: 20px; }
        .gold { color: var(--g); text-shadow: 0 0 30px rgba(201,168,76, 0.4); }

        /* BOUTONS */
        .bg { 
            background: var(--g); color: #000; padding: 18px 40px; 
            font-weight: 800; font-family: 'Barlow Condensed', sans-serif; 
            text-transform: uppercase; letter-spacing: 2px; 
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); 
            cursor: pointer; border: none; transition: 0.3s; 
        }
        .
