workflows:
  ios-testflight:
    name: Coach DM iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CoachDM
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: be.coachdm.app
      vars:
        APP_ID: be.coachdm.app
    scripts:
      - name: Installer les dependances npm
        script: |
          npm install

      - name: Assembler les assets web embarques
        script: |
          bash build-www.sh

      - name: Generer le projet iOS natif
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Icones et splash (fond noir Coach DM)
        script: |
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#050807' \
            --iconBackgroundColorDark '#050807' \
            --splashBackgroundColor '#050807' \
            --splashBackgroundColorDark '#050807'

      - name: Patch Info.plist (camera + conformite)
        script: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string Coach DM utilise la caméra pour analyser tes mouvements (squat, saut, barre, course) en direct, localement sur ton appareil. Aucune vidéo n'est enregistrée ni envoyée." "$PLIST"
          $PB -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSPhotoLibraryAddUsageDescription string Permet d'enregistrer tes cartes de résultats Coach DM dans tes photos." "$PLIST"
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Numero de build
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Signature et build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
