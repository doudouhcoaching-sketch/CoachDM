<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="robots" content="noindex" />
<title>Analyse Barre — Bar Path & VBT — Coach DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface2:#1C1C1C; --line:rgba(255,255,255,.08);
    --gold:#D4AF37; --neon:#00FFA3; --txt:#F5F5F4; --muted:#9CA3AF; --ok:#10B981; --danger:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt)}
  body{
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;
    min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width:560px;margin:0 auto;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:transparent;-webkit-appearance:none;appearance:none}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .backapp{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#D4AF37;text-decoration:none;font-size:20px;font-weight:800;line-height:1;margin-right:2px}
  .backapp:active{transform:scale(.94)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-0.02em}
  .brandlogo{width:26px;height:26px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px rgba(212,175,55,.55)}
  .brand em{font-style:normal;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:2px}
  .lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 9px;border-radius:999px}
  .lang button.on{color:#0A0A0A;background:var(--neon)}

  .stage{
    position:relative;border-radius:22px;overflow:hidden;background:#000;
    border:1px solid var(--line);aspect-ratio:3/4;transition:box-shadow .15s ease;
  }
  .stage.deep{box-shadow:0 0 0 2px var(--neon),0 0 34px rgba(0,255,163,.35)}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding:12px;pointer-events:none}
  .pill{
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
    background:rgba(10,10,10,.72);border:1px solid var(--line);backdrop-filter:blur(8px);
    display:inline-flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.ok .dot{background:var(--neon);box-shadow:0 0 10px var(--neon)}
  .pill.warn .dot{background:var(--gold)}
  .pill.err .dot{background:var(--danger)}
  .angle-chip{
    position:absolute;right:10px;bottom:10px;pointer-events:none;
    font-size:13px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums;
    background:rgba(10,10,10,.72);border:1px solid var(--line);border-radius:12px;padding:8px 11px;
  }
  .angle-chip small{color:var(--muted);font-weight:600;font-size:10px;display:block;letter-spacing:.05em;text-transform:uppercase}
  .speed-chip{
    position:absolute;right:10px;bottom:74px;pointer-events:none;
    font-size:13px;font-weight:800;color:var(--neon);font-variant-numeric:tabular-nums;
    background:rgba(10,10,10,.72);border:1px solid rgba(0,255,163,.35);border-radius:12px;padding:8px 11px;
  }
  .speed-chip small{color:var(--muted);font-weight:600;font-size:10px;display:block;letter-spacing:.05em;text-transform:uppercase}
  .dbg{
    position:absolute;left:10px;bottom:10px;pointer-events:none;
    font-size:10px;font-weight:600;color:rgba(0,255,163,.9);
    font-variant-numeric:tabular-nums;letter-spacing:0;
    background:rgba(10,10,10,.65);border-radius:8px;padding:5px 8px;line-height:1.45;white-space:pre;
  }
  .splash{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#161616 0%,#0A0A0A 70%);
  }
  .splash p{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:300px}
  .squatter{width:54px;height:54px;stroke:var(--neon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .controls{display:flex;gap:10px;margin-top:12px}
  .btn{
    flex:1;font-size:15px;font-weight:700;padding:14px 12px;border-radius:16px;
    background:var(--neon);color:#062A1D;letter-spacing:-0.02em;transition:transform .08s ease,opacity .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line)}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .result{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
    padding:18px 18px 16px;text-align:center;
  }
  .result .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{
    font-size:64px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .meta{display:flex;justify-content:center;gap:18px;margin-top:8px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .meta b{color:var(--txt)}
  .meta .g{color:var(--ok)}

  .card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
  .card h3{font-size:14.5px;font-weight:700;margin-bottom:10px}
  .card.pro{border-color:rgba(212,175,55,.45)}
  .gatep{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 14px}
  .goldbtn{display:block;text-decoration:none;font-size:15px;font-weight:700;padding:14px;border-radius:16px;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);color:#0A0A0A;text-align:center}
  .protag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#0A0A0A;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);border-radius:6px;padding:2px 7px;vertical-align:2px;margin-left:6px}

  .vrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .vfield{display:flex;flex-direction:column;gap:5px}
  .vfield label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .vfield input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:16px;font-weight:700;padding:12px;width:100%;font-variant-numeric:tabular-nums}
  .vfield input:focus{outline:none;border-color:rgba(212,175,55,.6)}
  .vres{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .vres .m{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 4px;text-align:center}
  .vres .m .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
  .vres .m .v small{font-size:10px;font-weight:700;color:var(--muted)}
  .vres .m .k{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .vbar{position:relative;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:14px}
  .vbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--neon);transition:width .3s ease}
  .vbar.warn i{background:var(--gold)}
  .vbar.stop i{background:var(--danger)}
  .vmark{position:absolute;top:-2px;left:50%;width:2px;height:16px;background:rgba(255,255,255,.55)}
  .vscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  .vstop{margin-top:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);color:#EF4444;font-size:13px;font-weight:700;border-radius:12px;padding:11px 13px;line-height:1.5}
  .vnote{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.5}

  .rlist{list-style:none;display:flex;flex-direction:column;gap:8px}
  .rlist li{
    background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  }
  .rlist .n{color:var(--muted);font-size:12.5px;min-width:30px}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
  .b-ok{color:var(--ok);border-color:rgba(16,185,129,.4)}
  .b-no{color:var(--danger);border-color:rgba(239,68,68,.4)}
  .b-warn{color:var(--gold);border-color:rgba(212,175,55,.4)}
  .b-mut{color:var(--muted)}
  .b-spd{color:var(--neon);border-color:rgba(0,255,163,.4)}
  .empty{color:var(--muted);font-size:13px}
  .pro-note{margin-top:12px;font-size:12px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:7px}

  details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
  summary{font-size:14.5px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'+';color:var(--muted);font-size:18px;font-weight:600}
  details[open] summary::after{content:'−'}
  .help{margin-top:10px;color:var(--muted);font-size:13.5px;line-height:1.6}
  .help li{margin:0 0 6px 16px}
  .pdiag{width:100%;max-width:300px;display:block;margin:8px auto 2px}
  .note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
  footer b{color:var(--gold)}

  .plans{display:grid;gap:10px;text-align:left}
  .pcoach{font-size:12.5px;color:var(--muted);text-align:center;padding:10px 4px 2px;line-height:1.5}
  .pcoach a{color:var(--gold);font-weight:800;text-decoration:none;border-bottom:1px solid rgba(212,175,55,.4)}
  .plan{border:1px solid rgba(212,175,55,.45);border-radius:16px;padding:14px;background:rgba(212,175,55,.06)}
  .plan .pb{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0A0A0A;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);border-radius:999px;padding:4px 10px;margin-bottom:8px}
  .plan .pp{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .plan .pp small{font-size:13px;color:var(--muted);font-weight:600}
  .plan .old{font-size:14px;color:var(--muted);text-decoration:line-through;margin-left:8px;font-weight:600}
  .plan .pn{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .plan .pcta{margin-top:11px;width:100%;font-size:14px;font-weight:700;padding:12px;border-radius:13px;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);color:#0A0A0A}
  .plan .pcta:active{transform:scale(.98)}
  .pwov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px}
  .pwov.show{display:flex}
  .pwbox{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:14px}
  .pwclose{position:absolute;top:10px;right:10px;z-index:2;background:#eee;color:#333;width:32px;height:32px;border-radius:50%;font-size:15px;line-height:1}
  .mvseg{display:flex;gap:7px;margin:0 0 12px}
  .mvseg button{flex:1;padding:10px 4px;border-radius:13px;font-size:13.5px;font-weight:800;letter-spacing:.02em;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid rgba(255,255,255,.09)}
  .mvseg button.on{background:linear-gradient(135deg,rgba(212,175,55,.22),rgba(212,175,55,.10));color:var(--gold);border-color:rgba(212,175,55,.55)}
  @media (prefers-reduced-motion:reduce){.stage{transition:none}.btn{transition:none}.vbar i{transition:none}}
</style>
</head>
<body>

<header>
  <a class="backapp" href="app.html" aria-label="Coach DM App">‹</a>
  <div>
    <div class="brand"><img class="brandlogo" src="/logo-dm.png" alt="" onerror="this.remove()"><span>COACH <em>DM</em></span></div>
    <div class="sub" id="subline"></div>
  </div>
  <div class="lang" id="lang">
    <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="nl">NL</button>
  </div>
</header>

<div class="mvseg" id="mvseg">
  <button data-mv="snatch">Snatch</button><button data-mv="clean">Clean</button><button data-mv="jerk">Jerk</button>
</div>

<div class="stage" id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="hud"><span class="pill" id="pill"><span class="dot"></span><span id="pill-txt"></span></span></div>
  <div class="speed-chip" id="spd" hidden><small>m/s</small><span id="spd-val">—</span></div>
  <div class="angle-chip" id="chip" hidden><small id="chip-lbl"></small><span id="chip-val">—</span></div>
  <div class="dbg" id="cdm-dbg" hidden></div>
  <div class="splash" id="splash">
    <svg class="squatter" viewBox="0 0 24 24"><circle cx="12" cy="7" r="2"/><path d="M12 9v4M12 13l-3 4M12 13l3 4M12 10l-5-4M12 10l5-4"/><path d="M4.5 6v0M19.5 6v0"/><rect x="3" y="4.5" width="2.6" height="3" rx=".6"/><rect x="18.4" y="4.5" width="2.6" height="3" rx=".6"/></svg>
    <p id="splash-p"></p>
  </div>
</div>

<div class="controls">
  <button class="btn" id="b-start"></button>
  <button class="btn ghost" id="b-flip" disabled>⇄</button>
  <button class="btn ghost" id="b-reset" disabled></button>
</div>

<div class="result">
  <div class="lbl" id="res-lbl"></div>
  <div class="big" id="res-reps">0</div>
  <div class="meta">
    <span><span id="m-par"></span> <b class="g" id="res-par">—</b></span>
    <span><span id="m-depth"></span> <b id="res-depth">—</b></span>
  </div>
</div>

<div class="controls" id="save-row" style="display:none">
  <button class="btn" id="b-save"></button>
  <button class="btn ghost" id="b-share" style="flex:0 0 56px;font-size:19px">📤</button>
</div>

<!-- ══ Analyse Pro (VBT) — verrou Premium ══ -->
<div class="card pro" id="vbt-gate" style="display:none;text-align:center">
  <h3 id="vbt-gate-h" style="margin-bottom:8px"></h3>
  <p class="gatep" id="vbt-gate-p"></p>
  <div class="plans" id="gate-plans"></div>
</div>

<!-- ══ Analyse Pro (VBT) — panneau Premium ══ -->
<div class="card pro" id="vbt-card" style="display:none">
  <h3><span id="vbt-h"></span><span class="protag">PRO</span></h3>
  <p class="gatep" id="vbt-hint" style="margin-bottom:12px"></p>
  <div class="vrow">
    <div class="vfield"><label id="l-vh"></label><input id="in-vh" type="number" inputmode="decimal" min="120" max="220" step="0.5" placeholder="180"></div>
    <div class="vfield"><label id="l-vl"></label><input id="in-vl" type="number" inputmode="decimal" min="0" max="400" step="0.5" placeholder="100"></div>
  </div>
  <div class="vres">
    <div class="m"><div class="v"><span id="v-last">—</span><small> m/s</small></div><div class="k" id="k-last"></div></div>
    <div class="m"><div class="v"><span id="v-best">—</span><small> m/s</small></div><div class="k" id="k-best"></div></div>
    <div class="m"><div class="v"><span id="v-vl">—</span></div><div class="k" id="k-vl"></div></div>
    <div class="m"><div class="v"><span id="v-dev">—</span><small> cm</small></div><div class="k" id="k-dev"></div></div>
  </div>
  <div class="vbar" id="v-bar"><i id="v-fill"></i><span class="vmark"></span></div>
  <div class="vscale"><span>0%</span><span>−10%</span><span>−20%</span></div>
  <div class="vstop" id="v-stop" style="display:none"></div>
  <div class="vnote" id="vbt-note"></div>
</div>

<div class="card">
  <h3 id="list-h"></h3>
  <ul class="rlist" id="rlist"></ul>
  <div class="empty" id="rempty"></div>
  <div class="pro-note" id="pro-note" style="display:none">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span id="pro-note-txt"></span>
  </div>
</div>

<details>
  <summary id="place-h"></summary>
  <svg class="pdiag" viewBox="0 0 320 190" aria-hidden="true">
    <ellipse cx="150" cy="62" rx="30" ry="11" fill="none" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="150" cy="62" r="7.5" fill="#F5F5F4"/>
    <line x1="188" y1="62" x2="252" y2="62" stroke="rgba(0,255,163,.45)" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="258" y="49" width="17" height="27" rx="4.5" fill="none" stroke="#00FFA3" stroke-width="2.5"/>
    <text x="266" y="97" fill="#00FFA3" font-size="12" font-weight="800" text-anchor="middle">90° ✓</text>
    <line x1="150" y1="80" x2="150" y2="128" stroke="rgba(0,255,163,.45)" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="141" y="134" width="17" height="27" rx="4.5" fill="none" stroke="#00FFA3" stroke-width="2.5"/>
    <text x="150" y="182" fill="#00FFA3" font-size="12" font-weight="800" text-anchor="middle">0° ✓</text>
    <line x1="176" y1="80" x2="222" y2="122" stroke="rgba(239,68,68,.45)" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="226" y="126" width="17" height="27" rx="4.5" fill="none" stroke="#EF4444" stroke-width="2.5"/>
    <text x="235" y="174" fill="#EF4444" font-size="12" font-weight="800" text-anchor="middle">45° ✗</text>
  </svg>
  <ol class="help" id="place-ol"></ol>
</details>

<details>
  <summary id="help-h"></summary>
  <ol class="help" id="help-ol"></ol>
  <div class="note" id="help-note"></div>
</details>

<!-- ══ Paiement Stripe sur place — Coach & Coach+ ══ -->
<div class="pwov" id="pw-ov">
  <div class="pwbox">
    <button class="pwclose" id="pw-close" aria-label="Fermer">✕</button>
    <div id="pw-consent" style="padding:20px 16px">
      <h3 id="pw-consent-h" style="color:#111;font-size:16px;margin:0 0 12px"></h3>
      <label style="display:flex;gap:11px;align-items:flex-start;cursor:pointer;font-size:13.5px;line-height:1.55;color:#555">
        <input type="checkbox" id="pw-agree" style="margin-top:3px;width:18px;height:18px;flex:none;accent-color:#00A870"/>
        <span id="pw-consent-txt"></span>
      </label>
      <button id="pw-continue" disabled style="width:100%;margin-top:18px;font-size:15px;font-weight:700;padding:14px;border-radius:16px;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);color:#0A0A0A;opacity:1"></button>
    </div>
    <div id="ck-mount" style="display:none"></div>
  </div>
</div>

<footer>Coach DM · <b>Power · Transform · Excel</b> · coachdm.be · <span id="ver">barre v1.0</span></footer>

<script type="module">

}

/* ───────── Status ───────── */
let lastStatus='';
function setStatus(key,force){
  if(!key||(key===lastStatus&&!force))return;
  lastStatus=key;
  pillTxt.textContent=t(key);
  pill.classList.remove('ok','warn','err');
  if(key==='st_ready'||key==='st_lock')pill.classList.add('ok');
  else if(key==='st_pull'||key==='st_loading'||key==='st_view')pill.classList.add('warn');
  else if(key.startsWith('st_err')||key==='st_noperson')pill.classList.add('err');
}

/* ───────── Audio ───────── */
let AC=null;
function beep(freq,ms){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+ms/1000);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+ms/1000);
  }catch(_){}
}

/* ───────── VBT (Pro) : calibration & état ─────────
   Échelle métrique : hauteur du grand trochanter ≈ 0.53 × stature (anthropométrie).
   scale (m / unité normalisée Y) = (0.53 × taille_m) / (ankleY − hipY) DEBOUT.
   Calibration uniquement quand l'athlète est debout (genou > 160°) — jamais en position de départ. */
const VBT={heightCm:null,loadKg:0,hip0:null,an0:null,scale:null,best:null,last:null,vl:null,devLast:null,devBest:null,stop:false};
const VL_STOP=10; /* haltérophilie : seuil pic −10% (Weakley 2021) */
try{
  const st=JSON.parse(localStorage.getItem('cdm_vbt')||'{}');
  if(st.h)inVH.value=st.h; if(st.l)inVL.value=st.l;
}catch(_){}
function vbtInputs(){
  VBT.heightCm=parseFloat(inVH.value)||null;
  VBT.loadKg=parseFloat(inVL.value)||0;
  try{localStorage.setItem('cdm_vbt',JSON.stringify({h:inVH.value,l:inVL.value}));}catch(_){}
  renderVBT();
}
inVH.oninput=vbtInputs; inVL.oninput=vbtInputs;
function vbtCalib(lm,side){
  const hy=lm[side.hip].y, ay=lm[side.ankle].y;
  if(VBT.hip0==null){VBT.hip0=hy;VBT.an0=ay;}
  else{VBT.hip0=VBT.hip0*0.9+hy*0.1;VBT.an0=VBT.an0*0.9+ay*0.1;}
  if(VBT.heightCm){
    const d=VBT.an0-VBT.hip0;
    if(d>0.05)VBT.scale=(0.53*VBT.heightCm/100)/d;
  }else VBT.scale=null;
}
function vbtOnRep(pv,dev){
  if(pv!=null){
    VBT.last=pv;
    if(VBT.best==null||pv>VBT.best)VBT.best=pv;
    VBT.vl=VBT.best>0?Math.max(0,(1-VBT.last/VBT.best)*100):null;
    if(VBT.vl!=null&&VBT.vl>=VL_STOP&&!VBT.stop){
      VBT.stop=true;
      beep(300,180);setTimeout(()=>beep(300,180),230);setTimeout(()=>beep(240,320),460);
      if(navigator.vibrate)navigator.vibrate([80,60,80,60,180]);
    }
  }
  if(dev!=null){
    VBT.devLast=dev;
    if(VBT.devBest==null||dev<VBT.devBest)VBT.devBest=dev;
  }
  renderVBT();
}
function vbtResetSet(){VBT.best=null;VBT.last=null;VBT.vl=null;VBT.devLast=null;VBT.devBest=null;VBT.stop=false;renderVBT();}
function renderVBT(){

/* ───────── Bar engine (poignets = barre, machine à états par mouvement) ─────────
   Barre = point milieu des poignets (15/16). Rep valide si la barre part de la ligne
   de base (hanche — ou épaules pour le jerk), atteint le niveau requis (épaules pour
   clean, au-dessus du nez pour snatch/jerk) et revient à la base. */
const WARMUP_FRAMES=15, MIN_REP_MS=600, TRAIL_MAX=260, DEV_WARN_CM=15;
const MV_REQ={snatch:2,clean:1,jerk:2}; /* 1=épaules, 2=overhead */
let MV=localStorage.getItem('cdm_mv')||'snatch'; if(!MV_REQ[MV])MV='snatch';
const S={mode:'idle',rep:null,lastGoodTs:0,good:0,by:null,bx:null,pv:null,pt:null,vel:0};
let reps=[],bestPeak=null,bestDev=null,lastPath=null;

document.querySelectorAll('#mvseg button').forEach(b=>{
  b.classList.toggle('on',b.dataset.mv===MV);
  b.onclick=()=>{
    MV=b.dataset.mv;localStorage.setItem('cdm_mv',MV);
    document.querySelectorAll('#mvseg button').forEach(x=>x.classList.toggle('on',x===b));
    if(running)resetSet();
  };
});

function resetSet(){reps=[];bestPeak=null;bestDev=null;lastPath=null;S.mode='ready';S.rep=null;S.by=null;S.bx=null;S.pv=null;S.pt=null;S.vel=0;vbtResetSet();renderReps();updateSummary();}

function vis(p){return p?(p.visibility??1):0;}
function angle3(a,b,c){
  const v1={x:a.x-b.x,y:a.y-b.y,z:a.z-b.z},v2={x:c.x-b.x,y:c.y-b.y,z:c.z-b.z};
  const dot=v1.x*v2.x+v1.y*v2.y+v1.z*v2.z;
  const n=Math.hypot(v1.x,v1.y,v1.z)*Math.hypot(v2.x,v2.y,v2.z)||1e-9;
  return Math.acos(Math.min(1,Math.max(-1,dot/n)))*180/Math.PI;
}
function bodyVisible(lm){
  // chaîne épaule+hanche+poignet requise avec confiance élevée sur au moins un côté
  const chain=(sh,hip,wr)=>Math.min(vis(lm[sh]),vis(lm[hip]),vis(lm[wr]));
  return Math.max(chain(11,23,15),chain(12,24,16))>0.6;
}
function pickSide(lm){
  const L=(vis(lm[23])+vis(lm[25])+vis(lm[27]))/3;
  const R=(vis(lm[24])+vis(lm[26])+vis(lm[28]))/3;
  return L>=R?{hip:23,knee:25,ankle:27,sh:11}:{hip:24,knee:26,ankle:28,sh:12};
}
function kneeAngle(w,side){return angle3(w[side.hip],w[side.knee],w[side.ankle]);}
function avgY(lm,a,b){
  const va=vis(lm[a]),vb=vis(lm[b]);
  if(va>0.5&&vb>0.5)return (lm[a].y+lm[b].y)/2;
  if(va>0.5)return lm[a].y;
  if(vb>0.5)return lm[b].y;
  return null;
}
function barPoint(lm){
  const vl=vis(lm[15]),vr=vis(lm[16]);
  if(vl>0.5&&vr>0.5)return {x:(lm[15].x+lm[16].x)/2,y:(lm[15].y+lm[16].y)/2};
  if(vl>0.5)return {x:lm[15].x,y:lm[15].y};
  if(vr>0.5)return {x:lm[16].x,y:lm[16].y};
  return null;
}
function viewOf(lm,side){
  const shw=Math.abs(lm[11].x-lm[12].x);
  const torso=Math.hypot(lm[side.sh].x-lm[side.hip].x,lm[side.sh].y-lm[side.hip].y)||1e-9;
  const r=shw/torso;
  return r>0.5?'front':(r<0.35?'side':'mixed');
}
/* déviation horizontale en cm : dx normalisé × ratio d'aspect × échelle métrique */
function devCm(dx){
  if(!VBT.scale||!canvas.height)return null;
  return dx*(canvas.width/canvas.height)*VBT.scale*100;
}

function handle(lm,w,ts){
  if(!lm||!bodyVisible(lm)){
    S.good=0;S.pv=null;S.pt=null;
    if(ts-S.lastGoodTs>800){
      setStatus('st_noperson');chip.hidden=true;
      if(S.mode==='pull'){S.mode='ready';S.rep=null;stage.classList.remove('deep');} // rep en cours annulée
    }
    return;
  }
  S.lastGoodTs=ts;
  const side=pickSide(lm);
  const bp=barPoint(lm);
  if(!bp){updateDbg(ts,side,lm);return;}

  // lissage léger (mouvement balistique : réactivité > filtrage)
  S.by=S.by==null?bp.y:S.by*0.45+bp.y*0.55;
  S.bx=S.bx==null?bp.x:S.bx*0.45+bp.x*0.55;

  // vitesse verticale de la barre (unités normalisées / s, positif = vers le haut), EMA
  if(S.pv!=null&&S.pt!=null){
    const dt=(ts-S.pt)/1000;
    if(dt>0.005&&dt<0.5){
      const v=(S.pv-S.by)/dt;
      S.vel=S.vel*0.5+v*0.5;
    }
  }
  S.pv=S.by;S.pt=ts;

  // calibration métrique : uniquement debout (genou > 160°), jamais en position de départ
  if(w){
    const k=kneeAngle(w,side);
    if(k>160)vbtCalib(lm,side);
  }

  if(S.good<WARMUP_FRAMES){S.good++;updateDbg(ts,side,lm);return;} // ~0.75 s de présence stable avant d'armer

  const hipY=avgY(lm,23,24),shY=avgY(lm,11,12),noseY=vis(lm[0])>0.5?lm[0].y:null;
  if(hipY==null||shY==null){updateDbg(ts,side,lm);return;}
  const baseY=MV==='jerk'?(shY+0.04):hipY;

  if(PRO&&VBT.scale&&S.vel*VBT.scale>0.15){spdChip.hidden=false;$('#spd-val').textContent=(S.vel*VBT.scale).toFixed(2);}

  if(S.mode==='ready'){
    setStatus(viewOf(lm,side)!=='side'?'st_view':'st_ready'); // profil obligatoire pour un bar path fiable
    if(S.by<baseY-0.04&&S.vel>0.15){
      S.mode='pull';
      S.rep={t0:ts,x0:S.bx,pts:[{x:S.bx,y:S.by}],topY:S.by,level:0,xmin:S.bx,xmax:S.bx,peakV:0,view:viewOf(lm,side)};
      setStatus('st_pull');
    }
  }else if(S.mode==='pull'){
    const r=S.rep;
    if(r.pts.length<TRAIL_MAX)r.pts.push({x:S.bx,y:S.by});
    if(S.by<r.topY){ // nouvelle hauteur = phase montante : déviation mesurée ici
      r.topY=S.by;
      if(S.bx<r.xmin)r.xmin=S.bx;
      if(S.bx>r.xmax)r.xmax=S.bx;
    }
    if(S.vel>r.peakV)r.peakV=S.vel;
    if(shY!=null&&S.by<shY&&r.level<1)r.level=1;
    if(noseY!=null&&S.by<noseY-0.02&&r.level<2)r.level=2;
    r.view=viewOf(lm,side);
    const ok=r.level>=MV_REQ[MV];
    stage.classList.toggle('deep',ok);
    if(ok)setStatus('st_lock');
    if(S.by>baseY-0.02){ // retour à la base : fin de rep
      stage.classList.remove('deep');
      if(ok&&ts-r.t0>=MIN_REP_MS){
        const pv=(PRO&&VBT.scale)?+(r.peakV*VBT.scale).toFixed(3):null;
        const dv=PRO?devCm(r.xmax-r.xmin):null;
        finishRep(r,pv,dv==null?null:+dv.toFixed(1));
      }
      S.mode='ready';S.rep=null;setStatus('st_ready');
    }
  }
  updateDbg(ts,side,lm);
}

function finishRep(r,pv,dev){
  reps.push({level:r.level,peakV:pv,devCm:dev,view:r.view});
  lastPath=r.pts.filter((_,i)=>i%2===0); // ~130 points max pour la carte de partage
  if(pv!=null&&(bestPeak==null||pv>bestPeak))bestPeak=pv;
  if(dev!=null&&(bestDev==null||dev<bestDev))bestDev=dev;
  beep(1320,140);
  if(navigator.vibrate)navigator.vibrate(60);
  if(PRO)vbtOnRep(pv,dev);
  renderReps();updateSummary();
}

/* ───────── Results UI ───────── */
function updateSummary(){
  $('#res-reps').textContent=reps.length;
  const sr=$('#save-row'),sb2=$('#b-save');
  if(sr)sr.style.display=reps.length?'flex':'none';
  if(sb2&&reps.length&&sb2.textContent!==t('saving')){sb2.disabled=false;sb2.textContent=t('save');}
  $('#res-par').textContent=(PRO&&bestPeak!=null)?bestPeak.toFixed(2)+' m/s':'—';
  $('#res-depth').textContent=(PRO&&bestDev!=null)?bestDev.toFixed(0)+' cm':'—';
}
function renderReps(){
  const ul=$('#rlist');ul.innerHTML='';
  $('#rempty').textContent=reps.length?'':t('list_empty');
  [...reps].reverse().forEach((r,i)=>{
    const li=document.createElement('li');
    const badges=[];
    badges.push(`<span class="badge b-ok">${t(r.level>=2?'b_over':'b_shoulder')}</span>`);
    if(PRO){
      if(r.peakV!=null)badges.push(`<span class="badge b-spd">${r.peakV.toFixed(2)} m/s</span>`);
      if(r.devCm!=null)badges.push(`<span class="badge ${r.devCm>DEV_WARN_CM?'b-warn':'b-mut'}">${r.devCm>DEV_WARN_CM?t('b_dev_w')+' ':''}${r.devCm.toFixed(0)} cm</span>`);
    }
    li.innerHTML=`<span class="n">#${reps.length-i}</span>${badges.join('')}`;
    ul.appendChild(li);
  });
}

/* ───────── Drawing : squelette + barre + tracé + ligne de référence ───────── */
function draw(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const lm=res&&res.landmarks&&res.landmarks[0];
  if(lm&&du){
    du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:'rgba(0,255,163,.35)',lineWidth:2.5});
    du.drawLandmarks(lm,{color:'rgba(0,255,163,.8)',fillColor:'rgba(0,255,163,.8)',radius:2});
  }
  const pts=(S.mode==='pull'&&S.rep)?S.rep.pts:lastPath;
  if(pts&&pts.length>1){
    ctx.save();
    // ligne verticale de référence au point de départ
    const x0=((S.mode==='pull'&&S.rep)?S.rep.x0:pts[0].x)*canvas.width;
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.5;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,canvas.height);ctx.stroke();
    // tracé or de la barre
    ctx.setLineDash([]);ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';
    const g=ctx.createLinearGradient(0,canvas.height,0,0);
    g.addColorStop(0,'rgba(164,127,30,.9)');g.addColorStop(.5,'rgba(212,175,55,.95)');g.addColorStop(1,'#F6E27A');
    ctx.strokeStyle=g;
    ctx.beginPath();
    pts.forEach((p,i)=>{const X=p.x*canvas.width,Y=p.y*canvas.height;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
    ctx.stroke();
    ctx.restore();
  }
  // point barre (or) en direct
  if(S.by!=null&&S.mode!=='idle'){
    ctx.save();
    ctx.fillStyle='#D4AF37';ctx.strokeStyle='rgba(246,226,122,.9)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(S.bx*canvas.width,S.by*canvas.height,8,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }
}

/* live debug HUD */
const dbgEl=document.getElementById('cdm-dbg');
let dbgFrames=0,dbgFpsT=0,dbgFps=0;
function updateDbg(ts,side,lm){
  dbgFrames++;
  if(ts-dbgFpsT>=1000){dbgFps=dbgFrames;dbgFrames=0;dbgFpsT=ts;}

    'reps: '+reps.length+(PRO&&VBT.scale?'  éch: '+VBT.scale.toFixed(2):'');
}

/* ───────── Camera + loop ───────── */
let landmarker=null,stream=null,running=false,facing='environment',lastTs=-1,wakeLock=null;

async function loadModel(){
  if(landmarker)return;
  setStatus('st_loading');
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
  const model='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  const vision=await FilesetResolver.forVisionTasks(base);
  const opts=d=>({baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:0.6,minPosePresenceConfidence:0.6,minTrackingConfidence:0.6});
  try{landmarker=await PoseLandmarker.createFromOptions(vision,opts('GPU'));}
  catch(_){landmarker=await PoseLandmarker.createFromOptions(vision,opts('CPU'));}
  du=new DrawingUtils(ctx);
}

async function startCam(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false
  });
  video.srcObject=stream;
  await video.play();
  canvas.width=video.videoWidth||720;
  canvas.height=video.videoHeight||960;
  stage.style.aspectRatio=(canvas.width/canvas.height).toString();
  stage.classList.toggle('mirror',facing==='user');
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(_){}
}

function scheduleFrame(){
  if(!running)return;
  if(video.requestVideoFrameCallback){
    video.requestVideoFrameCallback((now,meta)=>onFrame(meta&&meta.mediaTime?meta.mediaTime*1000:performance.now()));
  }else{
    requestAnimationFrame(()=>onFrame(performance.now()));
  }
}
function onFrame(ts){
  if(!running)return;
  if(ts<=lastTs)ts=lastTs+1;
  lastTs=ts;
  let res=null;
  try{res=landmarker.detectForVideo(video,ts);}catch(_){}
  if(res)handle(res.landmarks&&res.landmarks[0],res.worldLandmarks&&res.worldLandmarks[0],ts);
  draw(res);
  scheduleFrame();
}

async function start(){
  bStart.disabled=true;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(_){}
  try{await startCam();}
  catch(e){setStatus('st_err_cam');showErr('Caméra: '+(e&&e.name||'')+' '+(e&&e.message||e)+' ['+VER+']');bStart.disabled=false;return;}
  splash.style.display='none';
  try{await loadModel();}
  catch(e){
    setStatus('st_err_model');showErr('Modèle: '+(e&&e.message||e)+' ['+VER+']');
    if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null;}
    splash.style.display='flex';bStart.disabled=false;return;
  }
  running=true;lastTs=-1;
  bStart.textContent=t('stop');bStart.disabled=false;
  bFlip.disabled=false;bReset.disabled=false;
  S.mode='ready';S.rep=null;S.lastGoodTs=0;S.good=0;S.by=null;S.bx=null;S.pv=null;S.pt=null;S.vel=0;
  VBT.hip0=null;VBT.an0=null;VBT.scale=null;
  setStatus('st_ready',true);
  scheduleFrame();
}
function stop(){
  running=false;
  if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null;}
  try{wakeLock&&wakeLock.release();}catch(_){}
  wakeLock=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  splash.style.display='flex';
  stage.classList.remove('deep');
  chip.hidden=true;spdChip.hidden=true;dbgEl.hidden=true;
  S.mode='idle';S.rep=null;
  bStart.textContent=t('start');
  bFlip.disabled=true;bReset.disabled=true;
  pillTxt.textContent='';pill.classList.remove('ok','warn','err');lastStatus='';
}
bStart.onclick=()=>{running?stop():start();};
bReset.onclick=()=>{if(running)resetSet();};
bFlip.onclick=async()=>{
  if(!running)return;
  facing=facing==='environment'?'user':'environment';
  if(stream)stream.getTracks().forEach(tr=>tr.stop());
  VBT.hip0=null;VBT.an0=null;VBT.scale=null;
  try{await startCam();}
  catch(e){setStatus('st_err_cam');}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&running)stop();
});

/* ═════════ Carte partageable (story 1080×1920) — vrai logo Coach DM ═════════ */
let LOGO=null,LOGO_TRIED=false;
function loadLogo(){
  return new Promise(res=>{
    if(LOGO)return res(LOGO);
    if(LOGO_TRIED)return res(null);
    const im=new Image();
    const done=ok=>{LOGO_TRIED=true;if(ok)LOGO=im;res(ok?im:null);};
    im.onload=()=>done(true);
    im.onerror=()=>done(false);
    im.src='/logo-dm.png';
    setTimeout(()=>{if(!LOGO&&!LOGO_TRIED)done(false);},2000);
  });
}
function shGoldGrad(c,x0,y0,x1,y1){
  const g=c.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'#F6E27A');g.addColorStop(.45,'#D4AF37');g.addColorStop(1,'#A47F1E');
  return g;
}
function shBase(c,W,H,title,logo){
  c.fillStyle='#0A0A0A';c.fillRect(0,0,W,H);
  const rg=c.createRadialGradient(W/2,0,0,W/2,0,H*.8);
  rg.addColorStop(0,'rgba(212,175,55,.10)');rg.addColorStop(1,'rgba(212,175,55,0)');
  c.fillStyle=rg;c.fillRect(0,0,W,H);
  c.textAlign='center';
  if(logo){
    const r=88,cx=W/2,cy=150;
    c.save();
    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.closePath();c.clip();
    c.fillStyle='#0A0A0A';c.fillRect(cx-r,cy-r,r*2,r*2);
    c.drawImage(logo,cx-r,cy-r,r*2,r*2);
    c.restore();
    c.lineWidth=6;c.strokeStyle=shGoldGrad(c,cx-r,cy-r,cx+r,cy+r);
    c.beginPath();c.arc(cx,cy,r+4,0,Math.PI*2);c.stroke();
  }else{
    c.font='800 78px Outfit';c.fillStyle='#F5F5F4';
    c.fillText('COACH ',W/2-92,170);
    c.fillStyle=shGoldGrad(c,W/2,110,W/2+240,190);
    c.fillText('DM',W/2+158,170);
  }
  c.font='700 40px Outfit';c.fillStyle='#9CA3AF';
  c.fillText(title,W/2,logo?312:255);
  c.strokeStyle='rgba(212,175,55,.5)';c.lineWidth=3;
  const dy=logo?352:295;
  c.beginPath();c.moveTo(W/2-130,dy);c.lineTo(W/2+130,dy);c.stroke();
  c.font='700 42px Outfit';c.fillStyle=shGoldGrad(c,W/2-220,H-150,W/2+220,H-110);
  c.fillText('Power · Transform · Excel',W/2,H-150);
  c.font='600 36px Outfit';c.fillStyle='#9CA3AF';
  c.fillText('coachdm.be  ·  @coachdm.be',W/2,H-85);
}
function shCardBar(logo){
  const W=1080,H=1920,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const c=cv.getContext('2d');
  shBase(c,W,H,t('sh_bar_t'),logo);
  c.textAlign='center';
  const mvName=t('mv_'+MV).toUpperCase();
  c.font='800 58px Outfit';c.fillStyle='#00FFA3';c.fillText(mvName,W/2,470);
  c.font='700 44px Outfit';c.fillStyle='#9CA3AF';c.fillText(t('sh_reps'),W/2,600);
  c.font='800 260px Outfit';c.fillStyle=shGoldGrad(c,W/2-320,660,W/2+320,880);
  c.fillText(String(reps.length),W/2,870);
  /* tracé bar path de la dernière rep, cadré */
  if(lastPath&&lastPath.length>1){
    const bx=W/2-230,by=980,bw=460,bh=470;
    c.save();
    c.strokeStyle='rgba(212,175,55,.4)';c.lineWidth=2.5;
    c.strokeRect(bx,by,bw,bh);
    c.font='700 32px Outfit';c.fillStyle='#9CA3AF';c.fillText(t('sh_path'),W/2,by-18);
    let xmin=1,xmax=0,ymin=1,ymax=0;
    lastPath.forEach(p=>{xmin=Math.min(xmin,p.x);xmax=Math.max(xmax,p.x);ymin=Math.min(ymin,p.y);ymax=Math.max(ymax,p.y);});
    const sx=(xmax-xmin)||1e-4,sy=(ymax-ymin)||1e-4;
    const scale=Math.min((bw-70)/sx,(bh-70)/sy);
    const ox=bx+bw/2-((xmin+xmax)/2)*scale, oy=by+bh/2-((ymin+ymax)/2)*scale;
    // référence verticale
    const rx=lastPath[0].x*scale+ox;
    c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.setLineDash([10,10]);
    c.beginPath();c.moveTo(rx,by+16);c.lineTo(rx,by+bh-16);c.stroke();
    c.setLineDash([]);c.lineWidth=7;c.lineJoin='round';c.lineCap='round';
    c.strokeStyle=shGoldGrad(c,bx,by+bh,bx,by);
    c.beginPath();
    lastPath.forEach((p,i)=>{const X=p.x*scale+ox,Y=p.y*scale+oy;i?c.lineTo(X,Y):c.moveTo(X,Y);});
    c.stroke();
    c.fillStyle='#00FFA3';
    const lp=lastPath[lastPath.length-1];
    c.beginPath();c.arc(lp.x*scale+ox,lp.y*scale+oy,10,0,Math.PI*2);c.fill();
    c.restore();
  }
  if(PRO&&VBT.best!=null){
    const mets=[
      [VBT.best.toFixed(2),t('sh_peak')],
      [VBT.vl!=null?('−'+VBT.vl.toFixed(0)+'%'):'—',t('sh_vl')],
      [VBT.devBest!=null?VBT.devBest.toFixed(0):'—',t('sh_dev')]
    ];
    mets.forEach((mm,i)=>{
      const x=W/6+(i*W/3);
      c.font='800 92px Outfit';c.fillStyle='#F5F5F4';c.fillText(mm[0],x,1610);
      c.font='700 32px Outfit';c.fillStyle='#9CA3AF';c.fillText(mm[1],x,1672);
    });
  }
  return cv;
}
async function shShare(cv,name){
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Coach DM'});return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  alert(t('sh_fail'));
}
async function shGo(){
  /* iOS : navigator.share doit rester dans la fenêtre du geste utilisateur —
     zéro attente ici, logo & polices préchargés au démarrage de la page. */
  await shShare(shCardBar(LOGO),'coachdm-barre.png');
}
document.getElementById('b-share').onclick=()=>{if(reps.length)shGo();};
