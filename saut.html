<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="robots" content="noindex" />
<title>Test de Saut — Coach DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface2:#1C1C1C; --line:rgba(255,255,255,.08);
    --gold:#D4AF37; --neon:#00FFA3; --txt:#F5F5F4; --muted:#9CA3AF; --danger:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt)}
  body{
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;
    min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width:560px;margin:0 auto;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:transparent;-webkit-appearance:none;appearance:none}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .brand{font-weight:800;font-size:18px;letter-spacing:-0.02em}
  .brand em{font-style:normal;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:2px}
  .sub .nl{font-style:italic}
  .lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 9px;border-radius:999px}
  .lang button.on{color:#0A0A0A;background:var(--neon)}

  .stage{
    position:relative;border-radius:22px;overflow:hidden;background:#000;
    border:1px solid var(--line);aspect-ratio:3/4;transition:box-shadow .15s ease;
  }
  .stage.air{box-shadow:0 0 0 2px var(--neon),0 0 34px rgba(0,255,163,.35)}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding:12px;pointer-events:none}
  .dbg{
    position:absolute;left:10px;bottom:10px;pointer-events:none;
    font-size:10px;font-weight:600;color:rgba(0,255,163,.9);
    font-variant-numeric:tabular-nums;letter-spacing:0;
    background:rgba(10,10,10,.65);border-radius:8px;padding:5px 8px;line-height:1.45;white-space:pre;
  }
  .pill{
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
    background:rgba(10,10,10,.72);border:1px solid var(--line);backdrop-filter:blur(8px);
    display:inline-flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.ok .dot{background:var(--neon);box-shadow:0 0 10px var(--neon)}
  .pill.warn .dot{background:var(--gold)}
  .pill.err .dot{background:var(--danger)}
  .splash{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#161616 0%,#0A0A0A 70%);
  }
  .splash p{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:300px}
  .jumper{width:54px;height:54px;stroke:var(--neon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .controls{display:flex;gap:10px;margin-top:12px}
  .btn{
    flex:1;font-size:15px;font-weight:700;padding:14px 12px;border-radius:16px;
    background:var(--neon);color:#062A1D;letter-spacing:-0.02em;transition:transform .08s ease,opacity .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line)}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .result{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
    padding:18px 18px 16px;text-align:center;
  }
  .result .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{
    font-size:64px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .big small{font-size:22px;font-weight:700}
  .meta{display:flex;justify-content:center;gap:18px;margin-top:8px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .meta b{color:var(--txt)}
  .meta .bb{color:var(--gold)}

  .card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
  .card h3{font-size:14.5px;font-weight:700;margin-bottom:10px}
  .jlist{list-style:none;display:flex;flex-direction:column;gap:8px}
  .jlist li{
    display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;
    background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-variant-numeric:tabular-nums;
  }
  .jlist li.best{border-color:rgba(212,175,55,.55)}
  .jlist li.best .cm{color:var(--gold)}
  .jlist .n{color:var(--muted);font-size:12.5px}
  .jlist .ms{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);font-size:13px}

  details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
  summary{font-size:14.5px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'+';color:var(--muted);font-size:18px;font-weight:600}
  details[open] summary::after{content:'−'}
  .help{margin-top:10px;color:var(--muted);font-size:13.5px;line-height:1.6}
  .help li{margin:0 0 6px 16px}
  .note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
  footer b{color:var(--gold)}

  @media (prefers-reduced-motion:reduce){.stage{transition:none}.btn{transition:none}}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">COACH <em>DM</em></div>
    <div class="sub" id="subline"></div>
  </div>
  <div class="lang" id="lang">
    <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="nl">NL</button>
  </div>
</header>

<div class="stage" id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="hud"><span class="pill" id="pill"><span class="dot"></span><span id="pill-txt"></span></span></div>
  <div class="dbg" id="cdm-dbg" hidden></div>
  <div class="splash" id="splash">
    <svg class="jumper" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6.5v4.5M12 11l-4 3.5M12 11l4 3.5M8 8l4 1.5L16 8"/><path d="M4 21h16" stroke-dasharray="2 3"/></svg>
    <p id="splash-p"></p>
  </div>
</div>

<div class="controls">
  <button class="btn" id="b-start"></button>
  <button class="btn ghost" id="b-flip" disabled>⇄</button>
  <button class="btn ghost" id="b-recal" disabled></button>
</div>

<div class="result">
  <div class="lbl" id="res-lbl"></div>
  <div class="big"><span id="res-cm">—</span><small> cm</small></div>
  <div class="meta">
    <span><span id="m-flight"></span> <b id="res-ms">—</b></span>
    <span><span id="m-best"></span> <b class="bb" id="res-best">—</b></span>
  </div>
</div>

<div class="card">
  <h3 id="list-h"></h3>
  <ul class="jlist" id="jlist"></ul>
  <div class="empty" id="jempty"></div>
</div>

<details>
  <summary id="help-h"></summary>
  <ol class="help" id="help-ol"></ol>
  <div class="note" id="help-note"></div>
</details>

<footer>Coach DM · <b>Power · Transform · Excel</b> · coachdm.be · <span id="ver">saut v2.1</span></footer>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ───────── i18n ───────── */
const I18N = {
  subline:{fr:'Test de Saut — hauteur en direct par IA',en:'Jump Test — live AI jump height',nl:'Sprongtest — live spronghoogte via AI'},
  splash:{fr:'Pose ton téléphone stable (2–4 m), corps entier visible, puis lance la caméra.',en:'Set your phone down stable (2–4 m), full body visible, then start the camera.',nl:'Zet je telefoon stabiel neer (2–4 m), hele lichaam zichtbaar, en start de camera.'},
  start:{fr:'Lancer la caméra',en:'Start camera',nl:'Camera starten'},
  stop:{fr:'Arrêter',en:'Stop',nl:'Stoppen'},
  recal:{fr:'Recalibrer',en:'Recalibrate',nl:'Herkalibreren'},
  st_loading:{fr:'Chargement du modèle IA…',en:'Loading AI model…',nl:'AI-model laden…'},
  st_calib:{fr:'Calibration — reste immobile, pieds au sol',en:'Calibrating — stand still, feet on the ground',nl:'Kalibratie — sta stil, voeten op de grond'},
  st_ready:{fr:'Prêt — saute !',en:'Ready — jump!',nl:'Klaar — spring!'},
  st_air:{fr:'EN L\'AIR…',en:'AIRBORNE…',nl:'IN DE LUCHT…'},
  st_noperson:{fr:'Corps entier non visible — recule',en:'Full body not visible — step back',nl:'Lichaam niet volledig zichtbaar — stap achteruit'},
  st_err_cam:{fr:'Caméra refusée — autorise l\'accès dans Réglages',en:'Camera denied — allow access in Settings',nl:'Camera geweigerd — sta toegang toe in Instellingen'},
  st_err_model:{fr:'Modèle IA indisponible — vérifie ta connexion',en:'AI model unavailable — check your connection',nl:'AI-model niet beschikbaar — controleer je verbinding'},
  res_lbl:{fr:'Dernier saut',en:'Last jump',nl:'Laatste sprong'},
  m_flight:{fr:'Temps de vol',en:'Flight time',nl:'Vluchttijd'},
  m_best:{fr:'Record séance',en:'Session best',nl:'Sessierecord'},
  list_h:{fr:'Sauts de la séance',en:'Session jumps',nl:'Sprongen deze sessie'},
  list_empty:{fr:'Aucun saut mesuré pour l\'instant.',en:'No jumps measured yet.',nl:'Nog geen sprongen gemeten.'},
  jump_n:{fr:'Saut',en:'Jump',nl:'Sprong'},
  help_h:{fr:'Comment ça marche',en:'How it works',nl:'Hoe het werkt'},
  help_1:{fr:'Téléphone posé ou sur trépied, stable, à 2–4 m. Corps entier dans le cadre.',en:'Phone resting or on a tripod, stable, 2–4 m away. Full body in frame.',nl:'Telefoon neergezet of op statief, stabiel, op 2–4 m. Hele lichaam in beeld.'},
  help_2:{fr:'Reste immobile ~1 s : l\'IA calibre ta position au sol.',en:'Stand still ~1 s: the AI calibrates your ground position.',nl:'Sta ~1 s stil: de AI kalibreert je grondpositie.'},
  help_3:{fr:'Saute (contre-mouvement libre) et atterris jambes tendues, même position qu\'au décollage.',en:'Jump (free countermovement) and land with legs extended, same position as takeoff.',nl:'Spring (vrije countermovement) en land met gestrekte benen, zelfde positie als bij de afzet.'},
  help_4:{fr:'La hauteur s\'affiche après l\'atterrissage. Enchaîne autant de sauts que tu veux.',en:'Your height shows after landing. Chain as many jumps as you like.',nl:'Je hoogte verschijnt na de landing. Doe zoveel sprongen als je wilt.'},
  help_note:{fr:'Méthode du temps de vol : h = g·t²/8 (Balsalobre-Fernández et al., 2015). 100% sur ton téléphone — aucune vidéo n\'est envoyée ni enregistrée. Précision ±2–3 cm ; plier les jambes à l\'atterrissage fausse la mesure.',en:'Flight-time method: h = g·t²/8 (Balsalobre-Fernández et al., 2015). Runs 100% on your phone — no video is uploaded or stored. Accuracy ±2–3 cm; bending your legs on landing skews the result.',nl:'Vluchttijdmethode: h = g·t²/8 (Balsalobre-Fernández et al., 2015). Draait 100% op je telefoon — er wordt geen video verstuurd of opgeslagen. Nauwkeurigheid ±2–3 cm; benen buigen bij de landing vertekent het resultaat.'}
};
const LANGS=['fr','en','nl'];
let LANG=localStorage.getItem('cdm_lang')||'fr'; if(!LANGS.includes(LANG)) LANG='fr';
const t=k=>{const e=I18N[k];return e?(e[LANG]||e.fr):k;};

/* ───────── DOM ───────── */
const $=s=>document.querySelector(s);
const video=$('#cam'), canvas=$('#overlay'), stage=$('#stage'), splash=$('#splash');
const pill=$('#pill'), pillTxt=$('#pill-txt');
const bStart=$('#b-start'), bFlip=$('#b-flip'), bRecal=$('#b-recal');
const ctx=canvas.getContext('2d');
let du=null;

function applyLang(){
  document.documentElement.lang=LANG;
  $('#subline').textContent=t('subline');
  $('#splash-p').textContent=t('splash');
  bStart.textContent=running?t('stop'):t('start');
  bRecal.textContent=t('recal');
  $('#res-lbl').textContent=t('res_lbl');
  $('#m-flight').textContent=t('m_flight');
  $('#m-best').textContent=t('m_best');
  $('#list-h').textContent=t('list_h');
  $('#help-h').textContent=t('help_h');
  $('#help-ol').innerHTML='';
  ['help_1','help_2','help_3','help_4'].forEach(k=>{
    const li=document.createElement('li'); li.textContent=t(k); $('#help-ol').appendChild(li);
  });
  $('#help-note').textContent=t('help_note');
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  renderJumps(); setStatus(lastStatus,true);
}
document.querySelectorAll('#lang button').forEach(b=>{
  b.onclick=()=>{LANG=b.dataset.lang;localStorage.setItem('cdm_lang',LANG);applyLang();};
});

/* ───────── Status ───────── */
let lastStatus='';
function setStatus(key,force){
  if(!key||(key===lastStatus&&!force))return;
  lastStatus=key;
  pillTxt.textContent=t(key);
  pill.classList.remove('ok','warn','err');
  if(key==='st_ready')pill.classList.add('ok');
  else if(key==='st_air')pill.classList.add('ok');
  else if(key==='st_calib'||key==='st_loading')pill.classList.add('warn');
  else if(key.startsWith('st_err')||key==='st_noperson')pill.classList.add('err');
  stage.classList.toggle('air',key==='st_air');
}

/* ───────── Audio ───────── */
let AC=null;
function beep(freq,ms){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+ms/1000);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+ms/1000);
  }catch(_){}
}

/* ───────── Jump engine V2 (flight-time, toe-based, rolling baseline) ───────── */
const G=9.81;
const EPS=0.010;      // ground-contact epsilon (normalized) for takeoff/landing crossings
const TRIG=0.030;     // min rise to consider airborne
const MINPEAK=0.035;  // min peak rise to validate a jump
const S={mode:'search',base:null,win:[],hist:[],minY:1,takeoffT:0,cooldownUntil:0,lastGoodTs:0};
let jumps=[],best=0;

function resetCalib(){S.mode='search';S.base=null;S.win=[];S.hist=[];setStatus('st_calib');}

function footY(lm){
  // prefer toe tips (31/32): last to leave the ground, first to touch
  const pick=(i)=>{const p=lm[i];return p&&(p.visibility??1)>0.25?p.y:null;};
  const lt=pick(31),rt=pick(32);
  if(lt!=null&&rt!=null)return (lt+rt)/2;
  if(lt!=null)return lt; if(rt!=null)return rt;
  const la=pick(27),ra=pick(28);
  if(la!=null&&ra!=null)return (la+ra)/2;
  if(la!=null)return la; if(ra!=null)return ra;
  return null;
}
function bodyVisible(lm){
  const ok=(a,b)=>{const p=lm[a],q=lm[b];return (p&&(p.visibility??1)>0.2)||(q&&(q.visibility??1)>0.2);};
  return ok(23,24)&&(ok(27,28)||ok(31,32));
}
function median(a){const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}

function crossTime(level,upward){
  // walk hist backwards, find pair straddling `level`; return interpolated time
  for(let i=S.hist.length-1;i>0;i--){
    const p1=S.hist[i],p0=S.hist[i-1];
    const c=upward?(p0.y>=level&&p1.y<level):(p0.y<level&&p1.y>=level);
    if(c){
      const f=Math.abs((p0.y-level)/(p0.y-p1.y||1e-9));
      return p0.t+(p1.t-p0.t)*f;
    }
  }
  return S.hist.length?S.hist[S.hist.length-1].t:0;
}

function handle(lm,ts){
  if(!lm||!bodyVisible(lm)){
    // tolerate brief dropouts (motion blur mid-jump); reset only if sustained
    if(S.mode!=='airborne'&&ts-S.lastGoodTs>800){setStatus('st_noperson');S.base=null;S.win=[];S.mode='search';}
    return;
  }
  const y=footY(lm);
  if(y==null)return;
  S.lastGoodTs=ts;
  S.hist.push({t:ts,y});
  if(S.hist.length>18)S.hist.shift();

  // rolling ground reference: median of a quiet 1.5s window (frozen while airborne)
  if(S.mode!=='airborne'){
    S.win.push({t:ts,y});
    while(S.win.length&&ts-S.win[0].t>1500)S.win.shift();
    if(S.win.length>=6&&ts-S.win[0].t>=600){
      const ys=S.win.map(p=>p.y);
      if(Math.max(...ys)-Math.min(...ys)<0.03){
        S.base=median(ys);
        if(S.mode==='search'){S.mode='ready';beep(880,70);}
      }
    }
  }

  if(S.mode==='search'){setStatus('st_calib');}
  else if(S.mode==='ready'){
    if(ts<S.cooldownUntil){setStatus('st_ready');}
    else if(S.base!=null&&S.base-y>TRIG){
      S.takeoffT=crossTime(S.base-EPS,true);
      S.minY=y;S.mode='airborne';setStatus('st_air');
    }else setStatus('st_ready');
  }
  else if(S.mode==='airborne'){
    if(y<S.minY)S.minY=y;
    if(y>=S.base-EPS){
      const landT=crossTime(S.base-EPS,false);
      const T=(landT-S.takeoffT)/1000;
      const rise=S.base-S.minY;
      if(T>0.12&&T<0.9&&rise>MINPEAK){
        const cm=G*T*T/8*100;
        addJump(cm,Math.round(T*1000));
      }
      S.mode='ready';S.cooldownUntil=ts+600;S.win=[];setStatus('st_ready');
    }else if(ts-S.takeoffT>1800){
      S.mode='ready';S.win=[];setStatus('st_ready');
    }
  }
  updateDbg(ts,y);
}

/* live debug HUD */
const dbgEl=document.getElementById('cdm-dbg');
let dbgFrames=0,dbgFpsT=0,dbgFps=0;
function updateDbg(ts,y){
  dbgFrames++;
  if(ts-dbgFpsT>=1000){dbgFps=dbgFrames;dbgFrames=0;dbgFpsT=ts;}
  const d=S.base!=null?(S.base-y):0;
  dbgEl.hidden=false;
  dbgEl.textContent=
    'état: '+S.mode+'  fps: '+dbgFps+'\n'+
    'sol: '+(S.base!=null?S.base.toFixed(3):'—')+'  Δ: '+d.toFixed(3)+'\n'+
    'seuil décollage: '+TRIG.toFixed(3);
}
/* ───────── Results UI ───────── */
function addJump(cm,ms){
  jumps.unshift({cm,ms});
  if(cm>best)best=cm;
  beep(1320,140);
  if(navigator.vibrate)navigator.vibrate(60);
  animateNumber($('#res-cm'),cm);
  $('#res-ms').textContent=ms+' ms';
  $('#res-best').textContent=best.toFixed(1)+' cm';
  renderJumps();
}
function animateNumber(el,target){
  const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:520;
  const t0=performance.now();
  function step(now){
    const p=dur?Math.min(1,(now-t0)/dur):1;
    const e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(1);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function renderJumps(){
  const ul=$('#jlist');ul.innerHTML='';
  $('#jempty').textContent=jumps.length?'':t('list_empty');
  jumps.forEach((j,i)=>{
    const li=document.createElement('li');
    if(j.cm===best)li.classList.add('best');
    li.innerHTML=`<span class="n">${t('jump_n')} ${jumps.length-i}</span><span><span class="cm">${j.cm.toFixed(1)} cm</span> <span class="ms">· ${j.ms} ms</span></span>`;
    ul.appendChild(li);
  });
}

/* ───────── Drawing ───────── */
function draw(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(S.base!=null){
    const yp=S.base*canvas.height;
    ctx.save();
    ctx.strokeStyle='rgba(212,175,55,.85)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.moveTo(0,yp);ctx.lineTo(canvas.width,yp);ctx.stroke();
    ctx.restore();
  }
  const lm=res&&res.landmarks&&res.landmarks[0];
  if(lm&&du){
    du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:'rgba(0,255,163,.55)',lineWidth:3});
    du.drawLandmarks(lm,{color:'#00FFA3',fillColor:'#00FFA3',radius:2.5});
  }
}

/* ───────── Camera + loop ───────── */
let landmarker=null,stream=null,running=false,facing='environment',lastTs=-1,wakeLock=null;

async function loadModel(){
  if(landmarker)return;
  setStatus('st_loading');
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
  const model='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  const vision=await FilesetResolver.forVisionTasks(base);
  const opts=d=>({baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numPoses:1});
  try{landmarker=await PoseLandmarker.createFromOptions(vision,opts('GPU'));}
  catch(_){landmarker=await PoseLandmarker.createFromOptions(vision,opts('CPU'));}
  du=new DrawingUtils(ctx);
}

async function startCam(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false
  });
  video.srcObject=stream;
  await video.play();
  canvas.width=video.videoWidth||720;
  canvas.height=video.videoHeight||960;
  stage.style.aspectRatio=(canvas.width/canvas.height).toString();
  stage.classList.toggle('mirror',facing==='user');
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(_){}
}

function scheduleFrame(){
  if(!running)return;
  if(video.requestVideoFrameCallback){
    video.requestVideoFrameCallback((now,meta)=>onFrame(meta&&meta.mediaTime?meta.mediaTime*1000:performance.now()));
  }else{
    requestAnimationFrame(()=>onFrame(performance.now()));
  }
}
function onFrame(ts){
  if(!running)return;
  if(ts<=lastTs)ts=lastTs+1;
  lastTs=ts;
  let res=null;
  try{res=landmarker.detectForVideo(video,ts);}catch(_){}
  if(res)handle(res.landmarks&&res.landmarks[0],ts);
  draw(res);
  scheduleFrame();
}

async function start(){
  bStart.disabled=true;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(_){}
  try{await loadModel();}
  catch(e){setStatus('st_err_model');bStart.disabled=false;return;}
  try{await startCam();}
  catch(e){setStatus('st_err_cam');bStart.disabled=false;return;}
  splash.style.display='none';
  running=true;lastTs=-1;
  bStart.textContent=t('stop');bStart.disabled=false;
  bFlip.disabled=false;bRecal.disabled=false;
  resetCalib();
  scheduleFrame();
}
function stop(){
  running=false;
  if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null;}
  try{wakeLock&&wakeLock.release();}catch(_){}
  wakeLock=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  splash.style.display='flex';
  stage.classList.remove('air');
  dbgEl.hidden=true;
  S.mode='search';S.base=null;S.win=[];S.hist=[];
  bStart.textContent=t('start');
  bFlip.disabled=true;bRecal.disabled=true;
  setStatus('st_calib',true);pillTxt.textContent='';pill.classList.remove('ok','warn','err');lastStatus='';
}
bStart.onclick=()=>{running?stop():start();};
bRecal.onclick=()=>{if(running)resetCalib();};
bFlip.onclick=async()=>{
  if(!running)return;
  facing=facing==='environment'?'user':'environment';
  if(stream)stream.getTracks().forEach(tr=>tr.stop());
  try{await startCam();resetCalib();}
  catch(e){setStatus('st_err_cam');}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&running)stop();
});

applyLang();
</script>
