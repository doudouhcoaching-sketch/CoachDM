<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0A0A0A" />
<meta name="robots" content="noindex" />
<title>Test de Saut — Coach DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --surface:#141414; --surface2:#1C1C1C; --line:rgba(255,255,255,.08);
    --gold:#D4AF37; --neon:#00FFA3; --txt:#F5F5F4; --muted:#9CA3AF; --danger:#EF4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt)}
  body{
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;
    min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width:560px;margin:0 auto;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:transparent;-webkit-appearance:none;appearance:none}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .backapp{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#D4AF37;text-decoration:none;font-size:20px;font-weight:800;line-height:1;margin-right:2px}
  .backapp:active{transform:scale(.94)}
  .brand{font-weight:800;font-size:18px;letter-spacing:-0.02em}
  .brand em{font-style:normal;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:2px}
  .sub .nl{font-style:italic}
  .lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 9px;border-radius:999px}
  .lang button.on{color:#0A0A0A;background:var(--neon)}

  .stage{
    position:relative;border-radius:22px;overflow:hidden;background:#000;
    border:1px solid var(--line);aspect-ratio:3/4;transition:box-shadow .15s ease;
  }
  .stage.air{box-shadow:0 0 0 2px var(--neon),0 0 34px rgba(0,255,163,.35)}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding:12px;pointer-events:none}
  .dbg{
    position:absolute;left:10px;bottom:10px;pointer-events:none;
    font-size:10px;font-weight:600;color:rgba(0,255,163,.9);
    font-variant-numeric:tabular-nums;letter-spacing:0;
    background:rgba(10,10,10,.65);border-radius:8px;padding:5px 8px;line-height:1.45;white-space:pre;
  }
  .pill{
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
    background:rgba(10,10,10,.72);border:1px solid var(--line);backdrop-filter:blur(8px);
    display:inline-flex;align-items:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.ok .dot{background:var(--neon);box-shadow:0 0 10px var(--neon)}
  .pill.warn .dot{background:var(--gold)}
  .pill.err .dot{background:var(--danger)}
  .splash{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#161616 0%,#0A0A0A 70%);
  }
  .splash p{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:300px}
  .jumper{width:54px;height:54px;stroke:var(--neon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .controls{display:flex;gap:10px;margin-top:12px}
  .btn{
    flex:1;font-size:15px;font-weight:700;padding:14px 12px;border-radius:16px;
    background:var(--neon);color:#062A1D;letter-spacing:-0.02em;transition:transform .08s ease,opacity .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line)}
  .btn[disabled]{opacity:.45;pointer-events:none}

  .result{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;
    padding:18px 18px 16px;text-align:center;
  }
  .result .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{
    font-size:64px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .big small{font-size:22px;font-weight:700}
  .meta{display:flex;justify-content:center;gap:18px;margin-top:8px;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .meta b{color:var(--txt)}
  .meta .bb{color:var(--gold)}

  .card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
  .card h3{font-size:14.5px;font-weight:700;margin-bottom:10px}
  .jlist{list-style:none;display:flex;flex-direction:column;gap:8px}
  .jlist li{
    display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;
    background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-variant-numeric:tabular-nums;
  }
  .jlist li.best{border-color:rgba(212,175,55,.55)}
  .jlist li.best .cm{color:var(--gold)}
  .jlist .n{color:var(--muted);font-size:12.5px}
  .jlist .ms{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);font-size:13px}

  details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 18px}
  summary{font-size:14.5px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'+';color:var(--muted);font-size:18px;font-weight:600}
  details[open] summary::after{content:'−'}
  .help{margin-top:10px;color:var(--muted);font-size:13.5px;line-height:1.6}
  .help li{margin:0 0 6px 16px}
  .note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
  footer b{color:var(--gold)}

  /* ── Modes ── */
  .modes{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:12px}
  .modes button{flex:1;font-size:13.5px;font-weight:700;padding:10px 8px;border-radius:12px;color:var(--muted)}
  .modes button.on{background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);color:#0A0A0A}

  /* ── F-V panel ── */
  .fvcard{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
  .fvcard h3{font-size:14.5px;font-weight:700;margin-bottom:4px}
  .fvcard .hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:12px}
  .fvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fvfield{display:flex;flex-direction:column;gap:5px}
  .fvfield label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fvfield input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:inherit;font-size:16px;font-weight:700;padding:12px;width:100%;font-variant-numeric:tabular-nums}
  .fvfield input:focus{outline:none;border-color:rgba(212,175,55,.6)}
  .fv-hpo{grid-column:1/-1;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
  .fv-hpo b{color:var(--gold);font-size:15px}
  .fvbtn{margin-top:12px;width:100%;font-size:15px;font-weight:700;padding:14px;border-radius:16px;background:var(--neon);color:#062A1D}
  .fvbtn.gold{background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 55%,#A47F1E 100%);color:#0A0A0A}
  .fvbtn.ghost{background:var(--surface2);color:var(--txt);border:1px solid var(--line)}
  .fvbtn[disabled]{opacity:.45;pointer-events:none}
  .fvrow{display:flex;gap:10px;margin-top:12px}
  .fvrow .fvbtn{margin-top:0}

  .loadchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .loadchip{font-size:13px;font-weight:700;padding:9px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
  .loadchip.cur{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(0,255,163,.25)}
  .loadchip.done{border-color:rgba(212,175,55,.6);color:var(--gold)}
  .loadchip.done::after{content:' ✓'}

  .fvbig{text-align:center;margin:10px 0 4px}
  .fvbig .load{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#F6E27A 0%,#D4AF37 45%,#A47F1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fvbig .bl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .fvbig .bb{margin-top:4px;font-size:14px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}

  .fvres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .fvres .m{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .fvres .m .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
  .fvres .m .v small{font-size:11px;font-weight:700;color:var(--muted)}
  .fvres .m .k{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

  .gauge{margin-top:14px}
  .gauge .bar{position:relative;height:14px;border-radius:999px;overflow:hidden;background:linear-gradient(90deg,#EF4444 0%,#D4AF37 30%,#00FFA3 44%,#00FFA3 56%,#D4AF37 70%,#EF4444 100%)}
  .gauge .needle{position:absolute;top:-3px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);transform:translateX(-50%)}
  .gauge .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  .gauge .verdict{text-align:center;margin-top:10px;font-size:16px;font-weight:800}
  .gauge .verdict.f{color:var(--danger)}
  .gauge .verdict.b{color:var(--neon)}
  .gauge .verdict.v{color:var(--gold)}
  .gauge .imbv{text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:8px}
  .fvreco{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--txt)}
  .fvreco b{color:var(--gold)}
  .fvwarn{margin-top:10px;font-size:12px;font-weight:600;color:var(--danger)}
  #fvchart{width:100%;height:220px;margin-top:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){.stage{transition:none}.btn{transition:none}}
</style>
</head>
<body>

<header>
  <a class="backapp" href="app.html" aria-label="Coach DM App">‹</a>
  <div>
    <div class="brand">COACH <em>DM</em></div>
    <div class="sub" id="subline"></div>
  </div>
  <div class="lang" id="lang">
    <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="nl">NL</button>
  </div>
</header>

<div class="modes" id="modes">
  <button data-mode="jump" class="on" id="tab-jump"></button>
  <button data-mode="fv" id="tab-fv"></button>
</div>

<div class="stage" id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="hud"><span class="pill" id="pill"><span class="dot"></span><span id="pill-txt"></span></span></div>
  <div class="dbg" id="cdm-dbg" hidden></div>
  <div class="splash" id="splash">
    <svg class="jumper" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6.5v4.5M12 11l-4 3.5M12 11l4 3.5M8 8l4 1.5L16 8"/><path d="M4 21h16" stroke-dasharray="2 3"/></svg>
    <p id="splash-p"></p>
  </div>
</div>

<div class="controls">
  <button class="btn" id="b-start"></button>
  <button class="btn ghost" id="b-flip" disabled>⇄</button>
  <button class="btn ghost" id="b-recal" disabled></button>
</div>

<div class="result">
  <div class="lbl" id="res-lbl"></div>
  <div class="big"><span id="res-cm">—</span><small> cm</small></div>
  <div class="meta">
    <span><span id="m-flight"></span> <b id="res-ms">—</b></span>
    <span><span id="m-best"></span> <b class="bb" id="res-best">—</b></span>
  </div>
</div>

<div class="controls" id="save-row" style="display:none">
  <button class="btn" id="b-save"></button>
</div>

<!-- ══ Profil Force-Vitesse ══ -->
<div class="fvcard" id="fv-setup" style="display:none">
  <h3 id="fv-setup-h"></h3>
  <div class="hint" id="fv-setup-hint"></div>
  <div class="fvgrid">
    <div class="fvfield"><label id="l-mass"></label><input id="in-mass" type="number" inputmode="decimal" min="30" max="200" step="0.1" placeholder="75"></div>
    <div class="fvfield"><label id="l-leg"></label><input id="in-leg" type="number" inputmode="decimal" min="60" max="130" step="0.5" placeholder="95"></div>
    <div class="fvfield"><label id="l-h90"></label><input id="in-h90" type="number" inputmode="decimal" min="30" max="90" step="0.5" placeholder="58"></div>
    <div class="fvfield"><label id="l-loads"></label><input id="in-loads" type="text" inputmode="numeric" placeholder="0, 10, 20, 30"></div>
    <div class="fv-hpo" id="fv-hpo"></div>
  </div>
  <button class="fvbtn gold" id="b-fv-start"></button>
</div>

<div class="fvcard" id="fv-capture" style="display:none">
  <h3 id="fv-cap-h"></h3>
  <div class="loadchips" id="loadchips"></div>
  <div class="fvbig">
    <div class="bl" id="fv-cap-lbl"></div>
    <div class="load" id="fv-cap-load">—</div>
    <div class="bb" id="fv-cap-best">—</div>
  </div>
  <div class="fvrow">
    <button class="fvbtn ghost" id="b-fv-next" disabled></button>
    <button class="fvbtn gold" id="b-fv-finish" disabled></button>
  </div>
</div>

<div class="fvcard" id="fv-results" style="display:none">
  <h3 id="fv-res-h"></h3>
  <div class="fvres">
    <div class="m"><div class="v"><span id="r-f0">—</span><small> N/kg</small></div><div class="k">F0</div></div>
    <div class="m"><div class="v"><span id="r-v0">—</span><small> m/s</small></div><div class="k">V0</div></div>
    <div class="m"><div class="v"><span id="r-pmax">—</span><small> W/kg</small></div><div class="k">Pmax</div></div>
  </div>
  <div class="gauge">
    <div class="imbv" id="r-imb">—</div>
    <div class="bar"><div class="needle" id="g-needle" style="left:50%"></div></div>
    <div class="scale"><span>40%</span><span>90%</span><span>110%</span><span>160%</span></div>
    <div class="verdict" id="r-verdict"></div>
  </div>
  <canvas id="fvchart"></canvas>
  <div class="fvreco" id="r-reco"></div>
  <div class="fvwarn" id="r-warn" style="display:none"></div>
  <button class="fvbtn" id="b-fv-save"></button>
  <button class="fvbtn ghost" id="b-fv-redo"></button>
</div>

<div class="card" id="jump-card">
  <h3 id="list-h"></h3>
  <ul class="jlist" id="jlist"></ul>
  <div class="empty" id="jempty"></div>
</div>

<details>
  <summary id="help-h"></summary>
  <ol class="help" id="help-ol"></ol>
  <div class="note" id="help-note"></div>
</details>

<footer>Coach DM · <b>Power · Transform · Excel</b> · coachdm.be · <span id="ver">saut v3.0</span></footer>

let lastStatus='';
function setStatus(key,force){
  if(!key||(key===lastStatus&&!force))return;
  lastStatus=key;
  pillTxt.textContent=t(key);
  pill.classList.remove('ok','warn','err');

/* ───────── Audio ───────── */
let AC=null;
function beep(freq,ms){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+ms/1000);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+ms/1000);
  }catch(_){}
}

/* ───────── Jump engine V2 (flight-time, toe-based, rolling baseline) ───────── */
const G=9.81;
const EPS=0.010;      // ground-contact epsilon (normalized) for takeoff/landing crossings
const TRIG=0.030;     // min rise to consider airborne
const MINPEAK=0.035;  // min peak rise to validate a jump
const S={mode:'search',base:null,win:[],hist:[],minY:1,takeoffT:0,cooldownUntil:0,lastGoodTs:0};
let jumps=[],best=0;

function resetCalib(){S.mode='search';S.base=null;S.win=[];S.hist=[];setStatus('st_calib');}

function footY(lm){
  // prefer toe tips (31/32): last to leave the ground, first to touch
  const pick=(i)=>{const p=lm[i];return p&&(p.visibility??1)>0.5?p.y:null;};
  const lt=pick(31),rt=pick(32);
  if(lt!=null&&rt!=null)return (lt+rt)/2;
  if(lt!=null)return lt; if(rt!=null)return rt;
  const la=pick(27),ra=pick(28);
  if(la!=null&&ra!=null)return (la+ra)/2;
  if(la!=null)return la; if(ra!=null)return ra;
  return null;
}
function bodyVisible(lm){
  const v=i=>{const p=lm[i];return p?(p.visibility??1):0;};
  const ok=(a,b)=>v(a)>0.6||v(b)>0.6;
  return ok(23,24)&&(ok(27,28)||ok(31,32));
}
function median(a){const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;}

function crossTime(level,upward){
  // walk hist backwards, find pair straddling `level`; return interpolated time
  for(let i=S.hist.length-1;i>0;i--){
    const p1=S.hist[i],p0=S.hist[i-1];
    const c=upward?(p0.y>=level&&p1.y<level):(p0.y<level&&p1.y>=level);
    if(c){
      const f=Math.abs((p0.y-level)/(p0.y-p1.y||1e-9));
      return p0.t+(p1.t-p0.t)*f;
    }
  }
  return S.hist.length?S.hist[S.hist.length-1].t:0;
}

function handle(lm,ts){
  if(!lm||!bodyVisible(lm)){
    // tolerate brief dropouts (motion blur mid-jump); reset only if sustained
    if(S.mode!=='airborne'&&ts-S.lastGoodTs>800){setStatus('st_noperson');S.base=null;S.win=[];S.mode='search';}
    return;
  }
  const y=footY(lm);
  if(y==null)return;
  S.lastGoodTs=ts;
  S.hist.push({t:ts,y});
  if(S.hist.length>18)S.hist.shift();

  // rolling ground reference: median of a quiet 1.5s window (frozen while airborne)
  if(S.mode!=='airborne'){
    S.win.push({t:ts,y});
    while(S.win.length&&ts-S.win[0].t>1500)S.win.shift();
    if(S.win.length>=6&&ts-S.win[0].t>=600){
      const ys=S.win.map(p=>p.y);
      if(Math.max(...ys)-Math.min(...ys)<0.03){
        S.base=median(ys);
        if(S.mode==='search'){S.mode='ready';beep(880,70);}
      }
    }
  }

  if(S.mode==='search'){setStatus('st_calib');}
  else if(S.mode==='ready'){
    if(ts<S.cooldownUntil){setStatus('st_ready');}
    else if(S.base!=null&&S.base-y>TRIG){
      S.takeoffT=crossTime(S.base-EPS,true);
      S.minY=y;S.mode='airborne';setStatus('st_air');
    }else setStatus('st_ready');
  }
  else if(S.mode==='airborne'){
    if(y<S.minY)S.minY=y;
    if(y>=S.base-EPS){
      const landT=crossTime(S.base-EPS,false);
      const T=(landT-S.takeoffT)/1000;
      const rise=S.base-S.minY;
      if(T>0.12&&T<0.9&&rise>MINPEAK){
        const cm=G*T*T/8*100;
        addJump(cm,Math.round(T*1000));
      }
      S.mode='ready';S.cooldownUntil=ts+600;S.win=[];setStatus('st_ready');
    }else if(ts-S.takeoffT>1800){
      S.mode='ready';S.win=[];setStatus('st_ready');
    }
  }
  updateDbg(ts,y);
}

/* live debug HUD */
const dbgEl=document.getElementById('cdm-dbg');
let dbgFrames=0,dbgFpsT=0,dbgFps=0;
function updateDbg(ts,y){
  dbgFrames++;
  if(ts-dbgFpsT>=1000){dbgFps=dbgFrames;dbgFrames=0;dbgFpsT=ts;}
  const d=S.base!=null?(S.base-y):0;
  dbgEl.hidden=false;
  dbgEl.textContent=
    'état: '+S.mode+'  fps: '+dbgFps+'\n'+
    'sol: '+(S.base!=null?S.base.toFixed(3):'—')+'  Δ: '+d.toFixed(3)+'\n'+
    'seuil décollage: '+TRIG.toFixed(3);
}
/* ───────── Results UI ───────── */
function addJump(cm,ms){
  if(FV.on&&FV.step==='capture'){fvOnJump(cm,ms);}
  jumps.unshift({cm,ms});
  const sr=$('#save-row'),sb2=$('#b-save');
  if(sr&&!FV.on){sr.style.display='flex';}
  if(sb2){sb2.disabled=false;sb2.textContent=t('save');}
  if(cm>best)best=cm;
  beep(1320,140);
  if(navigator.vibrate)navigator.vibrate(60);
  animateNumber($('#res-cm'),cm);
  $('#res-ms').textContent=ms+' ms';
  $('#res-best').textContent=best.toFixed(1)+' cm';
  renderJumps();
}
function animateNumber(el,target){
  const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:520;
  const t0=performance.now();
  function step(now){
    const p=dur?Math.min(1,(now-t0)/dur):1;
    const e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(1);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function renderJumps(){
  const ul=$('#jlist');ul.innerHTML='';
  $('#jempty').textContent=jumps.length?'':t('list_empty');
  jumps.forEach((j,i)=>{
    const li=document.createElement('li');
    if(j.cm===best)li.classList.add('best');
    li.innerHTML=`<span class="n">${t('jump_n')} ${jumps.length-i}</span><span><span class="cm">${j.cm.toFixed(1)} cm</span> <span class="ms">· ${j.ms} ms</span></span>`;
    ul.appendChild(li);
  });
}

/* ───────── Drawing ───────── */
function draw(res){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(S.base!=null){
    const yp=S.base*canvas.height;
    ctx.save();
    ctx.strokeStyle='rgba(212,175,55,.85)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.moveTo(0,yp);ctx.lineTo(canvas.width,yp);ctx.stroke();
    ctx.restore();
  }
  const lm=res&&res.landmarks&&res.landmarks[0];
  if(lm&&du){
    du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:'rgba(0,255,163,.55)',lineWidth:3});
    du.drawLandmarks(lm,{color:'#00FFA3',fillColor:'#00FFA3',radius:2.5});
  }
}

/* ───────── Camera + loop ───────── */
let landmarker=null,stream=null,running=false,facing='environment',lastTs=-1,wakeLock=null;

async function loadModel(){
  if(landmarker)return;
  setStatus('st_loading');
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
  const model='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  const vision=await FilesetResolver.forVisionTasks(base);
  const opts=d=>({baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:0.6,minPosePresenceConfidence:0.6,minTrackingConfidence:0.6});
  try{landmarker=await PoseLandmarker.createFromOptions(vision,opts('GPU'));}
  catch(_){landmarker=await PoseLandmarker.createFromOptions(vision,opts('CPU'));}
  du=new DrawingUtils(ctx);
}

async function startCam(){
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false
  });
  video.srcObject=stream;
  await video.play();
  canvas.width=video.videoWidth||720;
  canvas.height=video.videoHeight||960;
  stage.style.aspectRatio=(canvas.width/canvas.height).toString();
  stage.classList.toggle('mirror',facing==='user');
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(_){}
}

function scheduleFrame(){
  if(!running)return;
  if(video.requestVideoFrameCallback){
    video.requestVideoFrameCallback((now,meta)=>onFrame(meta&&meta.mediaTime?meta.mediaTime*1000:performance.now()));
  }else{
    requestAnimationFrame(()=>onFrame(performance.now()));
  }
}
function onFrame(ts){
  if(!running)return;
  if(ts<=lastTs)ts=lastTs+1;
  lastTs=ts;
  let res=null;
  try{res=landmarker.detectForVideo(video,ts);}catch(_){}
  if(res)handle(res.landmarks&&res.landmarks[0],ts);
  draw(res);
  scheduleFrame();
}

async function start(){
  bStart.disabled=true;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(_){}
  try{await loadModel();}
  catch(e){setStatus('st_err_model');bStart.disabled=false;return;}
  try{await startCam();}
  catch(e){setStatus('st_err_cam');bStart.disabled=false;return;}
  splash.style.display='none';
  running=true;lastTs=-1;
  bStart.textContent=t('stop');bStart.disabled=false;
  bFlip.disabled=false;bRecal.disabled=false;
  resetCalib();
  scheduleFrame();
}
function stop(){
  running=false;
  if(stream){stream.getTracks().forEach(tr=>tr.stop());stream=null;}
  try{wakeLock&&wakeLock.release();}catch(_){}
  wakeLock=null;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  splash.style.display='flex';
  stage.classList.remove('air');
  dbgEl.hidden=true;
  S.mode='search';S.base=null;S.win=[];S.hist=[];
  bStart.textContent=t('start');
  bFlip.disabled=true;bRecal.disabled=true;
  setStatus('st_calib',true);pillTxt.textContent='';pill.classList.remove('ok','warn','err');lastStatus='';
}
bStart.onclick=()=>{running?stop():start();};
bRecal.onclick=()=>{if(running)resetCalib();};
bFlip.onclick=async()=>{
  if(!running)return;
  facing=facing==='environment'?'user':'environment';
  if(stream)stream.getTracks().forEach(tr=>tr.stop());
  try{await startCam();resetCalib();}
  catch(e){setStatus('st_err_cam');}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&running)stop();
});

/* ═════════ Profil Force-Vitesse (Samozino & Morin) ═════════ */
const FV={on:false,step:'setup',mass:0,hpo:0,legCm:0,h90Cm:0,loads:[],idx:0,byLoad:{},res:null};
const fvSetup=$('#fv-setup'),fvCapture=$('#fv-capture'),fvResults=$('#fv-results'),jumpCard=$('#jump-card');
const inMass=$('#in-mass'),inLeg=$('#in-leg'),inH90=$('#in-h90'),inLoads=$('#in-loads');

/* persisted measurements */
try{
  const st=JSON.parse(localStorage.getItem('cdm_fv')||'{}');
  if(st.mass)inMass.value=st.mass; if(st.leg)inLeg.value=st.leg;
  if(st.h90)inH90.value=st.h90; inLoads.value=st.loads||'0, 10, 20, 30';
}catch(_){inLoads.value='0, 10, 20, 30';}

function fvHpoM(){
  const L=parseFloat(inLeg.value),h=parseFloat(inH90.value);
  if(!isFinite(L)||!isFinite(h))return null;
  const hpo=(L-h)/100;
  return (hpo>=0.15&&hpo<=0.65)?hpo:NaN;
}
function fvHpoUI(){
  const el=$('#fv-hpo'),hpo=fvHpoM();
  if(hpo==null){el.textContent='';return;}
  el.innerHTML=isNaN(hpo)?('<span style="color:var(--danger)">'+t('fv_hpo_err')+'</span>')
    :(t('fv_hpo')+' : <b>'+(hpo*100).toFixed(1)+' cm</b>');
}
inLeg.oninput=fvHpoUI; inH90.oninput=fvHpoUI;

function setMode(m){
  FV.on=(m==='fv');
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  jumpCard.style.display=FV.on?'none':'';
  $('#save-row').style.display=(!FV.on&&jumps.length)?'flex':'none';
  fvSetup.style.display=FV.on&&FV.step==='setup'?'':'none';
  fvCapture.style.display=FV.on&&FV.step==='capture'?'':'none';
  fvResults.style.display=FV.on&&FV.step==='done'?'':'none';
}
document.querySelectorAll('#modes button').forEach(b=>{b.onclick=()=>setMode(b.dataset.mode);});

$('#b-fv-start').onclick=()=>{
  const mass=parseFloat(inMass.value),hpo=fvHpoM();
  const loads=(inLoads.value||'').split(/[,;]/).map(x=>parseFloat(x.trim())).filter(x=>isFinite(x)&&x>=0&&x<=150);
  const uniq=[...new Set(loads)].sort((a,b)=>a-b);
  if(!isFinite(mass)||mass<30||!hpo||isNaN(hpo)||uniq.length<2){alert(t('fv_need_fields'));fvHpoUI();return;}
  try{localStorage.setItem('cdm_fv',JSON.stringify({mass:inMass.value,leg:inLeg.value,h90:inH90.value,loads:inLoads.value}));}catch(_){}
  FV.mass=mass;FV.hpo=hpo;FV.legCm=parseFloat(inLeg.value);FV.h90Cm=parseFloat(inH90.value);
  FV.loads=uniq;FV.idx=0;FV.byLoad={};FV.res=null;FV.step='capture';
  setMode('fv');fvCapUI();
};

function fvOnJump(cm,ms){
  const L=FV.loads[FV.idx];
  const cur=FV.byLoad[L];
  if(!cur||cm>cur.cm)FV.byLoad[L]={cm,ms};
  fvCapUI();
}
function fvDoneCount(){return FV.loads.filter(L=>FV.byLoad[L]).length;}
function fvCapUI(){
  if(!fvCapture||FV.step!=='capture')return;
  const chips=$('#loadchips');chips.innerHTML='';
  FV.loads.forEach((L,i)=>{
    const c=document.createElement('button');

  });

/* ── physics ── */
const GG=9.81;
function fvRegression(pts){ /* pts: [{F,v}] -> F = F0 + Sfv·v */
  const n=pts.length;
  let sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(p=>{sx+=p.v;sy+=p.F;sxx+=p.v*p.v;sxy+=p.v*p.F;});
  const Sfv=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  const F0=(sy-Sfv*sx)/n;
  const my=sy/n;let ssr=0,sst=0;
  pts.forEach(p=>{const f=F0+Sfv*p.v;ssr+=(p.F-f)*(p.F-f);sst+=(p.F-my)*(p.F-my);});
  return {F0,Sfv,r2:sst>0?1-ssr/sst:1};
}
/* Samozino 2012 — cadre "valeurs moyennes" cohérent avec la mesure :
   F̄ = F0(1 − v̄/V0)  et  F̄ = m·g·(h/hPO + 1)  avec  h = 2v̄²/g
   → (2m/hPO)·v̄² + (F0/V0)·v̄ + (m·g − F0) = 0 */
function hFromProfile(F0c,V0c,m,hpo){
  const A=2*m/hpo,B=F0c/V0c,C=m*GG-F0c;
  const d=B*B-4*A*C;
  if(d<=0)return 0;
  const v=(-B+Math.sqrt(d))/(2*A);
  return v>0?2*v*v/GG:0;
}
function fvOptimalSlope(Pmax,m,hpo){ /* pente optimale — recherche numérique */
  let bestH=-1,bestF0=0;
  const lo=m*GG*1.02,hi=m*GG*9;
  for(let F0c=lo;F0c<=hi;F0c+=(hi-lo)/1200){
    const h=hFromProfile(F0c,4*Pmax/F0c,m,hpo);
    if(h>bestH){bestH=h;bestF0=F0c;}
  }
  const V0o=4*Pmax/bestF0;
  return {slope:-bestF0/V0o,F0:bestF0,V0:V0o,h:bestH};
}
function fvCompute(){
  const pts=[];
  FV.loads.forEach(L=>{
    const b=FV.byLoad[L];if(!b)return;
    const h=b.cm/100,M=FV.mass+L;
    pts.push({load:L,cm:b.cm,ms:b.ms,
      F:M*GG*(h/FV.hpo+1),
      v:Math.sqrt(2*GG*h)/2});
  });
  const {F0,Sfv,r2}=fvRegression(pts);
  const V0=-F0/Sfv,Pmax=F0*V0/4;
  const opt=fvOptimalSlope(Pmax,FV.mass,FV.hpo);
  const imb=100*Sfv/opt.slope;
  const ori=imb<90?'force':(imb>110?'velocity':'balanced');
  FV.res={pts,F0,V0,Sfv,r2,Pmax,sfvOpt:opt.slope,f0Opt:opt.F0,v0Opt:opt.V0,imb,ori};
}
$('#b-fv-finish').onclick=()=>{
  if(fvDoneCount()<2)return;
  fvCompute();FV.step='done';setMode('fv');fvResUI();beep(1320,160);
};

function fvResUI(){
  const r=FV.res;if(!r)return;
  $('#r-f0').textContent=(r.F0/FV.mass).toFixed(1);
  $('#r-v0').textContent=r.V0.toFixed(2);
  $('#r-pmax').textContent=(r.Pmax/FV.mass).toFixed(1);
  $('#r-imb').textContent=r.imb.toFixed(0)+' %';
  const pct=Math.max(0,Math.min(100,(r.imb-40)/(160-40)*100));
  $('#g-needle').style.left=pct+'%';
  const vd=$('#r-verdict');
  vd.className='verdict '+(r.ori==='force'?'f':r.ori==='velocity'?'v':'b');
  vd.textContent=t(r.ori==='force'?'fv_ori_force':r.ori==='velocity'?'fv_ori_vel':'fv_ori_bal');
  $('#r-reco').innerHTML=t(r.ori==='force'?'fv_reco_force':r.ori==='velocity'?'fv_reco_vel':'fv_reco_bal');
  const w=$('#r-warn');
  if(r.r2<0.95){w.style.display='';w.textContent=t('fv_r2_warn')+' (R²='+r.r2.toFixed(3)+')';}
  else w.style.display='none';
  const sb=$('#b-fv-save');sb.disabled=false;sb.textContent=t('fv_save');
  fvDrawChart();
}
function fvDrawChart(){
  const cv=$('#fvchart'),r=FV.res;if(!cv||!r)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||320,H=220;
  cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  const padL=34,padB=24,padT=12,padR=10;
  const xmax=Math.max(r.V0,r.v0Opt)*1.08,ymax=Math.max(r.F0,r.f0Opt)/FV.mass*1.08;
  const X=v=>padL+(v/xmax)*(W-padL-padR);
  const Y=f=>H-padB-(f/ymax)*(H-padB-padT);
  c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=1;
  c.beginPath();c.moveTo(padL,padT);c.lineTo(padL,H-padB);c.lineTo(W-padR,H-padB);c.stroke();
  c.fillStyle='rgba(156,163,175,.9)';c.font='600 10px Outfit';
  c.fillText('N/kg',4,padT+8);c.fillText('m/s',W-30,H-8);
  c.strokeStyle='rgba(0,255,163,.7)';c.setLineDash([6,5]);c.lineWidth=2;
  c.beginPath();c.moveTo(X(0),Y(r.f0Opt/FV.mass));c.lineTo(X(r.v0Opt),Y(0));c.stroke();
  c.setLineDash([]);
  const grd=c.createLinearGradient(X(0),0,X(r.V0),0);
  grd.addColorStop(0,'#F6E27A');grd.addColorStop(.5,'#D4AF37');grd.addColorStop(1,'#A47F1E');
  c.strokeStyle=grd;c.lineWidth=3;
  c.beginPath();c.moveTo(X(0),Y(r.F0/FV.mass));c.lineTo(X(r.V0),Y(0));c.stroke();
  r.pts.forEach(p=>{
    c.fillStyle='#F5F5F4';c.strokeStyle='#D4AF37';c.lineWidth=2;
    c.beginPath();c.arc(X(p.v),Y(p.F/FV.mass),4.5,0,7);c.fill();c.stroke();
  });
}
window.addEventListener('resize',()=>{if(FV.step==='done')fvDrawChart();});
