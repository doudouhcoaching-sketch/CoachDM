.btn{display:inline-block;border:0;border-radius:12px;padding:11px 15px;font-weight:800;font-size:14px;cursor:pointer;color:#000;background:var(--gold);text-decoration:none;text-align:center}
.btn.sec{background:var(--s2);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.4)}
.btn.small{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
ul.ck{margin:8px 0 0;padding-left:18px;line-height:1.7;color:#d9d1bf}ul.ck li::marker{color:var(--gold)}
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.price .card{margin:0;text-align:center}.price b{display:block;font-size:24px;color:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--mut);font-weight:800;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.day{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;background:rgba(233,199,103,.14);color:var(--gold)}
.pill.w{background:rgba(245,158,11,.15);color:var(--amb)}.pill.r{background:rgba(239,68,68,.15);color:var(--red)}.pill.g{background:rgba(74,222,128,.13);color:var(--grn)}
.club-head{display:flex;align-items:center;gap:12px}
.club-head img{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff1}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:.12em;color:var(--gold)}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin-top:10px}
.roster{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.roster div{padding:4px 0;color:#d9d1bf}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F1B14;border:1px solid var(--gold);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.hide{display:none!important}

/* ---------------- demarrage ---------------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return renderAuth('login');
  ME=session.user.id;
  const inv=pendingInvite();
  if(inv){
    const {data,error}=await sb.rpc('club_accept_invite',{p_token:inv});
    if(!(data&&data.reason==='wrong_email')){ try{ localStorage.removeItem('cdm_club_invite'); }catch(_){} }
    if(error) MSG=t('err'); else if(data?.ok) toast(t('joined')+' '+data.name);
    else MSG=data?.reason==='wrong_email'?t('wrong_email')+' '+(data.email||''):t(data?.reason||'err');
    if(data?.reason==='wrong_email'){ await sb.auth.signOut(); return renderAuth('login'); }
  }
  const code=pendingJoin();
  if(code){
    const {data,error}=await sb.rpc('club_join',{p_code:code});
    try{ localStorage.removeItem('cdm_club_join'); }catch(_){}
    if(error) MSG=t('err'); else if(data?.ok) (data.pending?(MSG=t('pending_sent')+' ('+data.name+')'):toast(t('joined')+' '+data.name)); else MSG=t(data?.reason||'err');
  }
  if(QS.has('join')||QS.has('invite')) history.replaceState(null,'',location.pathname);
  if(QS.get('paid')==='1'){ await waitPaid(); return; }
  await load();
}
async function load(keepTab){
  const {data,error}=await sb.rpc('club_me');
  if(error){ app.innerHTML=`<p>${esc(t('err'))}</p>`; return; }
  CLUBS=data||[];
  CUR=CLUBS.find(c=>CUR&&c.id===CUR.id)||CLUBS[0]||null;
  if(!keepTab) TAB='plan';
  render();
}
async function waitPaid(){
  app.innerHTML=`<div class="card"><p>${esc(t('waiting'))}</p></div>`;
  for(let i=0;i<6;i++){ const r=await api('sync'); if(r?.club?.status==='active') break; await new Promise(z=>setTimeout(z,2500)); }
  history.replaceState(null,'',location.pathname); await load();
}

function render(){

async function paneSchedule(owner){
  const pane=$('#pane'); pane.innerHTML='<p class="mut">…</p>';
  const [{data:rows,error},{data:staff}]=await Promise.all([sb.rpc('club_schedule',{p_club:CUR.id,p_days:21}), sb.rpc('club_staff',{p_club:CUR.id})]);

  const list=(rows||[]).filter(r=>owner||r.mine);
  let h='', day='';
  if(!list.length) h+=`<p class="mut">${esc(t('none'))}</p>`;
  list.forEach(r=>{ const d=dKey(r.starts_at); if(d!==day){ day=d; h+=`<div class="day">${esc(d)}</div>`; }

    h+=`<div class="card"><div class="row"><div class="grow"><b>${esc(hhmm(r.starts_at))} · ${esc(r.name)}</b>
      <div class="mut sm">${esc(r.coach_name)}${r.location?' · '+esc(r.location):''}</div></div>
      ${off?`<span class="pill r">${esc(t('cancelled'))}</span>`:`<span class="pill">${r.booked_count}/${r.capacity}</span>`}</div>
      ${off?'':`<div class="row" style="margin-top:10px"><button class="btn sec small" data-ro="${r.id}">${esc(t('roster'))}</button><button class="btn red small" data-cx="${r.id}">${esc(t('del_class'))}</button></div><div class="roster hide" id="ro-${r.id}"></div>`}</div>`; });
  const me=(staff||[]).find(s=>s.user_id===ME);
  const coachSel=owner?`<label>${esc(t('c_coach'))}</label><select id="k-coach">${(staff||[]).map(s=>`<option value="${s.user_id}" ${s.user_id===ME?'selected':''}>${esc(s.full_name||'—')}</option>`).join('')}</select>`:'';
  const td=new Date(Date.now()+864e5).toISOString().slice(0,10);
  h+=`<div class="card" style="margin-top:16px"><h2>${esc(t('add_h'))}</h2>
    <label>${esc(t('c_name'))}</label><input id="k-name" maxlength="60" placeholder="WOD, Hyrox, Open Gym…">

    <label>${esc(t('c_loc'))}</label><input id="k-loc" maxlength="80">${coachSel}
    <button class="btn" id="k-add" style="width:100%;margin-top:14px">${esc(t('add_b'))}</button></div>`;
  pane.innerHTML=h;
  pane.querySelectorAll('[data-ro]').forEach(b=>b.onclick=async()=>{ const box=$('#ro-'+b.dataset.ro);
    if(!box.classList.contains('hide')){ box.classList.add('hide'); return; }
    const {data,error}=await sb.rpc('class_roster',{p_instance:b.dataset.ro}); if(error) return toast(t('err'));
    box.innerHTML=(data||[]).length?data.map(p=>`<div>${esc(p.full_name||p.email)} ${p.status==='waitlist'?`<span class="pill w">${esc(t('waitl'))}</span>`:''}</div>`).join(''):`<div class="mut">—</div>`;
    box.classList.remove('hide'); });
  pane.querySelectorAll('[data-cx]').forEach(b=>b.onclick=async()=>{ if(!confirm(t('sure'))) return;
    const {data,error}=await sb.rpc('club_cancel_class',{p_instance:b.dataset.cx}); if(error||!data?.ok) return toast(t('err')); paneSchedule(owner); });
  $('#k-add').onclick=async()=>{
    const start=new Date($('#k-date').value+'T'+$('#k-time').value);

  };

  $('#cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast(t('copied')); }catch(_){ prompt('',link); } };
  $('#nc').onclick=async()=>{ if(!confirm(t('newcode_q'))) return; const {error}=await sb.rpc('club_new_code',{p_club:c.id}); if(error) return toast(t('err')); load(true); };
  $('#portal').onclick=async()=>{ const r=await api('portal'); if(r?.url) location.href=r.url; else toast(t('err')); };
  $('#cs').onclick=saveName;
  $('#lf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>700*1024) return toast(t('too_big'));
    const rd=new FileReader(); rd.onload=async()=>{ const r=await api('logo',{data:rd.result,type:f.type}); if(r?.ok){ toast(t('saved')); load(true); } else toast(t(r?.reason==='too_big'?'too_big':'err')); }; rd.readAsDataURL(f); };
}

/* ---------------- membre ---------------- */
async function renderMember(){
  shell(`<h2 style="margin-top:16px">${esc(t('t_plan'))}</h2><div id="pane"><p class="mut">…</p></div>
    <p style="text-align:center;margin-top:18px"><a href="#" id="lv" class="sm mut">${esc(t('leave'))}</a></p>`);
  $('#lv').onclick=async e=>{ e.preventDefault(); if(!confirm(t('leave_q'))) return; await sb.rpc('club_leave',{p_club:CUR.id}); CUR=null; load(); };
  const {data,error}=await sb.rpc('club_schedule',{p_club:CUR.id,p_days:14});
  const pane=$('#pane'); if(error){ pane.innerHTML=`<p>${esc(t('err'))}</p>`; return; }
  let h='', day='';
  const list=(data||[]).filter(r=>r.status!=='cancelled'||r.my_status);
  if(!list.length) h=`<p class="mut">${esc(t('none'))}</p>`;
  list.forEach(r=>{ const d=dKey(r.starts_at); if(d!==day){ day=d; h+=`<div class="day">${esc(d)}</div>`; }
    const left=r.capacity-r.booked_count, mine=r.my_status==='booked'||r.my_status==='waitlist', off=r.status==='cancelled';
    const pill=off?`<span class="pill r">${esc(t('cancelled'))}</span>`:r.my_status==='booked'?`<span class="pill g">${esc(t('booked'))}</span>`:r.my_status==='waitlist'?`<span class="pill w">${esc(t('waitl'))}</span>`:left<=0?`<span class="pill r">${esc(t('full'))}</span>`:`<span class="pill">${left}/${r.capacity}</span>`;
    const act=off?'':mine?(r.can_cancel?`<button class="btn sec small" data-cn="${r.id}">${esc(t('cancel_b'))}</button>`:''):`<button class="btn small" data-bk="${r.id}">${esc(left<=0?t('waitl'):t('book'))}</button>`;
    h+=`<div class="card"><div class="row"><div class="grow"><b>${esc(hhmm(r.starts_at))} · ${esc(r.name)}</b><div class="mut sm">${esc(r.coach_name)}${r.location?' · '+esc(r.location):''}</div></div>${pill}</div>${act?`<div class="row" style="margin-top:10px">${act}</div>`:''}</div>`; });
  pane.innerHTML=h;
  pane.querySelectorAll('[data-bk]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const {data,error}=await sb.rpc('class_book',{p_instance:b.dataset.bk}); if(error||!data?.ok) toast(t('err')); renderMember(); });
  pane.querySelectorAll('[data-cn]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const {error}=await sb.rpc('class_cancel',{p_instance:b.dataset.cn}); if(error) toast(t('err')); renderMember(); });
}

boot();
</script>
