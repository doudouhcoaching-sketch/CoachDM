<style>
  :root{
    --ink:#0A0907; --ink-2:#12100C; --ink-3:#1A1712; --line:rgba(233,199,103,.16); --line-2:rgba(242,236,222,.08);
    --gold:#E9C767; --gold-2:#C9A44A; --paper:#F2ECDE; --mute:#A39A88; --mute-2:#6E675A; --err:#E8806B;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper)}
  body{font-family:Manrope,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;min-height:100dvh;
    background:radial-gradient(900px 520px at 50% -10%,rgba(233,199,103,.10),transparent 70%),var(--ink);
    padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:560px;margin:0 auto;padding:22px 0 56px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:10px;color:var(--paper);text-decoration:none}
  .brand img{width:38px;height:38px;border-radius:10px}
  .brand b{font-family:Sora,sans-serif;font-weight:800;letter-spacing:.06em;font-size:15px}
  .lang{display:flex;gap:4px}
  .lang button{font:600 12px/1 Manrope,sans-serif;letter-spacing:.06em;color:var(--mute);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:7px 10px;cursor:pointer}
  .lang button.on{color:var(--ink);background:var(--gold);border-color:var(--gold)}
  .kick{font:700 11.5px/1 Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
  h1{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.12;margin:0 0 10px;text-wrap:balance}
  .lead{color:#D9D1C1;margin:0}
  .card{background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:24px;padding:24px 20px;margin-top:18px}
  .card h2{font-family:Sora,sans-serif;font-size:17px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
  .card h2 i{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(233,199,103,.14);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:800}
  .card h2 small{font:600 12px/1 Manrope,sans-serif;color:var(--mute-2);margin-left:auto;letter-spacing:.04em}
  .f{margin:0 0 16px}
  .f:last-child{margin-bottom:0}
  .f > span{display:block;font-weight:600;font-size:14px;color:var(--mute);margin:0 0 8px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .num{position:relative}
  .num input{padding-right:40px}
  .num em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute-2);font-size:13px;font-weight:600;pointer-events:none}
  input[type=number],input[type=text],input[type=date],textarea{width:100%;font:500 16px/1.3 Manrope,sans-serif;color:var(--paper);background:var(--ink-3);border:1px solid var(--line-2);border-radius:14px;padding:13px 13px;outline:none;-webkit-appearance:none;appearance:none}
  input[type=date]{min-height:48px}
  textarea{resize:vertical;min-height:74px}
  input:focus,textarea:focus{border-color:var(--gold)}
  input::placeholder,textarea::placeholder{color:var(--mute-2)}
  .bad input,.bad .pills{border-color:var(--err)!important}
  .bad > span{color:var(--err)}
  .pills{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:16px}
  .pills button{font:600 14.5px/1 Manrope,sans-serif;color:#D9D1C1;background:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:11px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .pills button.on{color:#14110A;background:var(--gold);border-color:var(--gold)}
  .hint{color:var(--mute-2);font-size:13px;margin:8px 0 0}
  .ok{display:flex;gap:12px;align-items:flex-start;cursor:pointer;color:#D9D1C1;font-size:15px}
  .ok input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--gold)}
  .send{display:block;width:100%;margin-top:22px;padding:17px 20px;border:0;border-radius:16px;cursor:pointer;
    font:800 17px/1 Sora,sans-serif;color:#14110A;background:linear-gradient(180deg,#F0D27C,var(--gold) 55%,var(--gold-2));
    box-shadow:0 10px 30px rgba(233,199,103,.18)}
  .send[disabled]{opacity:.6;cursor:default}
  .ghost{background:var(--ink-3);color:var(--gold);box-shadow:none;border:1px solid var(--line)}
  .err{color:var(--err);font-size:14px;text-align:center;margin-top:12px;min-height:1em}
  .center{text-align:center}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:s .8s linear infinite;margin:60px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .check{width:64px;height:64px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center;background:rgba(233,199,103,.14);color:var(--gold);font-size:30px;font-weight:800}
  .when{font-family:Sora,sans-serif;font-size:30px;font-weight:800;color:var(--gold);margin:6px 0 2px}
  ul.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  ul.steps li{display:flex;gap:10px;align-items:flex-start;color:#D9D1C1;font-size:15px}
  ul.steps li i{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(233,199,103,.14);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px}
  footer{margin-top:34px;color:var(--mute-2);font-size:12px;text-align:center}
  footer a{color:var(--mute-2)}
  [hidden]{display:none!important}
  @media (max-width:380px){.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><img src="/logo-dm.png" alt=""><b>COACH DM</b></a>
    <div class="lang" id="langs" role="group" aria-label="Langue"><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="nl">NL</button></div>
  </header>

  <main id="v-load"><div class="spin" aria-label="…"></div></main>

  <!-- Questionnaire -->
  <main id="v-form" hidden>
    <p class="kick" data-t="kick"></p>
    <h1 id="hello"></h1>
    <p class="lead" data-t="lead"></p>

    <section class="card">
      <h2><i>1</i><span data-t="s1"></span></h2>
      <div class="f" data-k="sex"><span data-t="sex"></span><div class="pills" data-one="sex"><button data-v="male" data-t="male"></button><button data-v="female" data-t="female"></button></div></div>
      <div class="row">
        <label class="f" data-k="age"><span data-t="age"></span><div class="num"><input type="number" inputmode="numeric" id="age" min="18" max="90"><em data-t="yrs"></em></div></label>
        <label class="f" data-k="height"><span data-t="height"></span><div class="num"><input type="number" inputmode="numeric" id="height" min="130" max="220"><em>cm</em></div></label>
        <label class="f" data-k="weight"><span data-t="weight"></span><div class="num"><input type="number" inputmode="decimal" step="0.1" id="weight" min="35" max="250"><em>kg</em></div></label>
      </div>
    </section>

    <section class="card">
      <h2><i>2</i><span data-t="s2"></span></h2>
      <div class="f"><span data-t="goal"></span><div class="pills" data-one="goal">
        <button data-v="perte_gras" data-t="g_fat"></button><button data-v="forme" data-t="g_fit"></button><button data-v="force" data-t="g_str"></button><button data-v="endurance" data-t="g_end"></button><button data-v="energie" data-t="g_nrg"></button></div></div>
      <div class="row2">
        <label class="f" data-k="target_weight"><span data-t="tw"></span><div class="num"><input type="number" inputmode="decimal" step="0.1" id="target_weight" min="35" max="250"><em>kg</em></div></label>
        <label class="f"><span data-t="when"></span><input type="date" id="deadline"></label>
      </div>
      <p class="hint" data-t="when_h"></p>
    </section>

    <section class="card">
      <h2><i>3</i><span data-t="s3"></span></h2>
      <div class="f"><span data-t="level"></span><div class="pills" data-one="level"><button data-v="beginner" data-t="l1"></button><button data-v="intermediate" data-t="l2"></button><button data-v="advanced" data-t="l3"></button></div></div>
      <div class="f"><span data-t="place"></span><div class="pills" data-one="place"><button data-v="salle" data-t="p1"></button><button data-v="maison" data-t="p2"></button><button data-v="maison_materiel" data-t="p3"></button></div></div>
      <div class="f"><span data-t="days"></span><div class="pills" data-one="days"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
      <div class="f"><span data-t="dur"></span><div class="pills" data-one="session_min"><button data-v="30">30 min</button><button data-v="45">45 min</button><button data-v="60">60 min</button></div></div>
      <div class="f"><span data-t="daily"></span><div class="pills" data-one="daily"><button data-v="assis" data-t="d1"></button><button data-v="debout" data-t="d2"></button><button data-v="physique" data-t="d3"></button></div></div>
    </section>

    <section class="card">
      <h2><i>4</i><span data-t="s4"></span></h2>
      <div class="f"><span data-t="pain"></span><div class="pills" data-many="pain"><button data-v="none" data-t="none"></button><button data-v="dos" data-t="z_back"></button><button data-v="genou" data-t="z_knee"></button><button data-v="epaule" data-t="z_sh"></button><button data-v="poignet" data-t="z_wr"></button></div></div>
      <label class="f"><input type="text" id="pain_other" maxlength="300" data-ph="pain_o"></label>
      <p class="hint" data-t="pain_h"></p>
    </section>

    <section class="card">
      <h2><i>5</i><span data-t="s5"></span></h2>
      <div class="f"><div class="pills" data-many="diet"><button data-v="vegetarien" data-t="veg"></button><button data-v="sans_lactose" data-t="nolac"></button><button data-v="sans_gluten" data-t="nogl"></button><button data-v="sans_fruits_coque" data-t="nonut"></button><button data-v="sans_poisson" data-t="nofish"></button></div></div>
      <label class="f"><input type="text" id="avoid" maxlength="300" data-ph="avoid"></label>
    </section>

    <section class="card">
      <h2><i>6</i><span data-t="s6"></span><small data-t="opt"></small></h2>
      <label class="f"><span data-t="hist"></span><input type="text" id="history" maxlength="300" data-ph="hist_ph"></label>
      <label class="f"><span data-t="note"></span><textarea id="note" maxlength="500" data-ph="note_ph"></textarea></label>
    </section>

    <section class="card" data-k="medical_ok">
      <label class="ok"><input type="checkbox" id="medical_ok"><span data-t="med"></span></label>
    </section>

    <button class="send" id="send" data-t="send"></button>
    <p class="err" id="err"></p>
  </main>

  <!-- Merci -->
  <main id="v-done" class="center" hidden>
    <div class="check">✓</div>
    <h1 id="done_t"></h1>
    <p class="lead" id="done_d"></p>
    <p class="when" id="done_when" hidden></p>
    <div class="card" style="text-align:left">
      <p class="kick" data-t="next"></p>
      <ul class="steps">
        <li><i>1</i><span data-t="n1"></span></li>
        <li><i>2</i><span data-t="n2"></span></li>
        <li><i>3</i><span data-t="n3"></span></li>
      </ul>
    </div>
  </main>

  <!-- Lien invalide -->
  <main id="v-off" class="center" hidden>
    <h1 data-t="off_t" style="margin-top:30px"></h1>
    <p class="lead" data-t="off_d"></p>
    <p style="margin-top:22px"><a href="mailto:contact@coachdm.be" style="color:var(--gold)">contact@coachdm.be</a></p>
  </main>

  <!-- Espace coach : confirmation des liens de l'e-mail -->
  <main id="v-admin" hidden>
    <p class="kick">Essai coaching</p>
    <h1 id="a_t"></h1>
    <p class="lead" id="a_d"></p>
    <button class="send" id="a_go"></button>
    <p class="err" id="a_err"></p>
  </main>

  <footer><span>© 2026 Coach DM · coachdm.be</span> · <a href="/conditions.html" data-t="terms"></a> · <a href="/privacy.html" data-t="privacy"></a></footer>
</div>

      n2:'Je krijgt een e-mail en een melding zodra je programma en voedingsplan klaar zijn.',
      n3:'Een vraag? Stuur me een bericht in de app.',
      off_t:'Link niet gevonden', off_d:'Deze link is niet geldig. Gebruik de link uit de e-mail na je betaling, of stuur me een bericht.',
      terms:'Voorwaarden', privacy:'Privacy' }
  };
  var q = new URLSearchParams(location.search);
  var TOKEN = q.get('t') || '';
  var L = q.get('l');
  if(!T[L]){ try{ L = localStorage.getItem('cdm_lang'); }catch(_){ L = null; } }
  if(!T[L]){ var n=(navigator.language||'fr').slice(0,2).toLowerCase(); L = T[n] ? n : 'fr'; }
  var FIRST = '', DONE = null, PAIN = false;
  var S = { sex:'', goal:'perte_gras', level:'beginner', place:'salle', days:'3', session_min:'45', daily:'assis', pain:[], diet:[] };
  var $ = function(id){ return document.getElementById(id); };
  var f = function(s){ var a=arguments; return s.replace(/\{(\d)\}/g,function(m,i){ return a[+i+1]!=null?a[+i+1]:m; }); };
  var VIEWS = ['v-load','v-form','v-done','v-off','v-admin'];
  function show(id){ VIEWS.forEach(function(v){ $(v).hidden = v!==id; }); window.scrollTo(0,0); }
  function hhmm(iso){ try{ return new Intl.DateTimeFormat(L==='en'?'en-GB':(L==='nl'?'nl-BE':'fr-BE'),{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels'}).format(new Date(iso)); }catch(_){ return ''; } }

  function paint(){
    var t=T[L]; document.documentElement.lang=L; document.title=t.title;
    document.querySelectorAll('[data-t]').forEach(function(e){ var v=t[e.getAttribute('data-t')]; if(v!=null) e.textContent=v; });
    document.querySelectorAll('[data-ph]').forEach(function(e){ e.placeholder=t[e.getAttribute('data-ph')]||''; });
    document.querySelectorAll('#langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l===L); });
    $('hello').textContent = FIRST ? f(t.hi, FIRST) : t.hi0;
    if(DONE) paintDone();
  }
  function paintPills(){
    document.querySelectorAll('[data-one]').forEach(function(g){ var k=g.dataset.one; g.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', S[k]===b.dataset.v); }); });
    document.querySelectorAll('[data-many]').forEach(function(g){ var k=g.dataset.many; g.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v==='none' ? (S[k].length===0 && g.dataset.touched==='1') : S[k].indexOf(b.dataset.v)>=0); }); });
  }
  document.querySelectorAll('[data-one] button').forEach(function(b){ b.type='button'; b.onclick=function(){ var k=b.parentNode.dataset.one; S[k]=b.dataset.v; var w=b.closest('[data-k]'); if(w) w.classList.remove('bad'); paintPills(); }; });
  document.querySelectorAll('[data-many] button').forEach(function(b){ b.type='button'; b.onclick=function(){ var g=b.parentNode, k=g.dataset.many, v=b.dataset.v; g.dataset.touched='1';
    if(v==='none'){ S[k]=[]; } else { var i=S[k].indexOf(v); if(i>=0) S[k].splice(i,1); else S[k].push(v); } paintPills(); }; });
  document.querySelectorAll('#langs button').forEach(function(b){ b.onclick=function(){ L=b.dataset.l; try{ localStorage.setItem('cdm_lang',L); }catch(_){} paint(); }; });
  document.querySelectorAll('input').forEach(function(i){ i.addEventListener('input', function(){ var w=i.closest('[data-k]'); if(w) w.classList.remove('bad'); }); });
  var dl=$('deadline'); var tmr=new Date(Date.now()+86400000*14); dl.min=tmr.toISOString().slice(0,10);

  function post(body){
    return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .catch(function(){ return {ok:false, reason:'network'}; });
  }

  function paintDone(){
    var t=T[L], d=DONE;
    $('done_t').textContent = FIRST ? f(t.done_t, FIRST) : t.done_t0;
    $('done_when').hidden = true;
    if(d.status==='sent' || d.status==='sent_by_coach'){ $('done_d').textContent=t.done_sent; return; }
    if(d.status==='ready' && d.send_at){
      $('done_d').textContent = d.tomorrow ? t.done_morning : t.done_soon;
      $('done_when').textContent = hhmm(d.send_at); $('done_when').hidden = false; return;
    }
    $('done_d').textContent = PAIN ? t.done_held : t.done_prep;
  }

  $('send').onclick = function(){
    var t=T[L], bad=[];
    var num=function(id){ var v=String($(id).value||'').replace(',','.'); return v===''?null:Number(v); };
    var a = { sex:S.sex, age:num('age'), height:num('height'), weight:num('weight'), target_weight:num('target_weight'), deadline:$('deadline').value||'',
      goal:S.goal, level:S.level, place:S.place, days:Number(S.days), session_min:Number(S.session_min), daily:S.daily,
      pain:S.pain.slice(), pain_other:$('pain_other').value.trim(), diet:{}, avoid:$('avoid').value.trim(),
      history:$('history').value.trim(), note:$('note').value.trim(), medical_ok:$('medical_ok').checked };
    S.diet.forEach(function(k){ a.diet[k]=true; });
    if(!a.sex) bad.push('sex');
    if(!(a.age>=18 && a.age<=90)) bad.push('age');
    if(!(a.height>=130 && a.height<=220)) bad.push('height');
    if(!(a.weight>=35 && a.weight<=250)) bad.push('weight');
    if(!(a.target_weight>=35 && a.target_weight<=250)) bad.push('target_weight');
    document.querySelectorAll('[data-k]').forEach(function(w){ w.classList.toggle('bad', bad.indexOf(w.dataset.k)>=0); });
    if(bad.length){ $('err').textContent=t.missing; var first=document.querySelector('[data-k].bad'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    if(!a.medical_ok){ document.querySelector('[data-k="medical_ok"]').classList.add('bad'); $('err').textContent=t.med_miss; return; }
    document.querySelector('[data-k="medical_ok"]').classList.remove('bad');
    PAIN = a.pain.length>0 || a.pain_other.length>0;
    var b=$('send'); b.disabled=true; b.textContent=t.sending; $('err').textContent='';
    post({kind:'form', token:TOKEN, answers:a}).then(function(r){
      if(r && r.ok){ DONE={status:r.status, send_at:r.send_at, tomorrow:!!r.tomorrow}; paintDone(); show('v-done'); return; }
      b.disabled=false; b.textContent=t.send;
      if(r && r.reason==='missing'){ (r.fields||[]).forEach(function(k){ var w=document.querySelector('[data-k="'+k+'"]'); if(w) w.classList.add('bad'); }); $('err').textContent=t.missing; return; }
      if(r && r.reason==='token'){ show('v-off'); return; }
      $('err').textContent=t.neterr;
    });
  };

  /* Espace coach : les boutons de l'e-mail interne arrivent ici et demandent une confirmation,
     pour qu'un antivirus qui ouvre les liens d'un e-mail ne declenche jamais un envoi. */
  function admin(){
    $('langs').hidden = true; L='fr'; paint();
    var act=q.get('a'), sig=q.get('k')||'';
    post({kind:'admin_info', token:TOKEN, action:act, sig:sig}).then(function(r){
      if(!(r && r.ok)){ $('a_t').textContent='Lien invalide'; $('a_d').textContent='Ce lien de validation n’est pas valide.'; $('a_go').hidden=true; show('v-admin'); return; }
      var who = r.first_name || 'ce client';
      if(r.status==='sent' || r.status==='sent_by_coach'){ $('a_t').textContent='Déjà envoyé'; $('a_d').textContent='Le programme de '+who+' est déjà parti.'; $('a_go').hidden=true; show('v-admin'); return; }
      if(act==='send'){ $('a_t').textContent='Envoyer le programme de '+who+' ?'; $('a_d').textContent='Programme, plan nutrition, message personnel et e-mail partent tout de suite.'; $('a_go').textContent='Envoyer maintenant'; }
      else { $('a_t').textContent='Retenir l’envoi pour '+who+' ?'; $('a_d').textContent='L’envoi automatique s’arrête. Rien ne part tant que tu n’as pas appuyé sur « Envoyer maintenant » dans l’e-mail.'; $('a_go').textContent='Retenir l’envoi'; $('a_go').classList.add('ghost'); }
      show('v-admin');
      $('a_go').onclick=function(){
        var g=$('a_go'); g.disabled=true; $('a_err').textContent='';
        post({kind:'admin', token:TOKEN, action:act, sig:sig}).then(function(x){
          if(x && x.ok){ $('a_t').textContent = x.done==='sent' ? 'Envoyé' : 'Envoi retenu'; $('a_d').textContent = x.done==='sent' ? who+' reçoit son programme, son plan nutrition et ton message.' : 'Rien ne part sans toi. Le bouton « Envoyer maintenant » de l’e-mail reste valable.'; g.hidden=true; return; }
          g.disabled=false; $('a_err').textContent = 'Échec : '+((x&&x.reason)||'réseau')+'. Réessaie ou passe par la console coach.';
        });
      };
    });
  }

  paint(); paintPills();
  if(!/^[0-9a-f-]{36}$/i.test(TOKEN)){ show('v-off'); return; }
  if(q.get('admin')==='1'){ admin(); return; }
  post({kind:'info', token:TOKEN}).then(function(r){
    if(!(r && r.ok)){ show('v-off'); return; }
    FIRST = r.first_name || '';
    if(!q.get('l') && T[r.lang]) L = r.lang;
    paint();
    if(r.status==='awaiting_form' || r.status==='failed'){ show('v-form'); return; }
    DONE={status:r.status, send_at:r.send_at, tomorrow: !!r.send_at && new Date(r.send_at).toDateString()!==new Date().toDateString()}; paintDone(); show('v-done');
  });
})();
</script>
</body>
</html>
