<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Télécommande Coach DM TV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070A08">
<link rel="icon" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#070A08;--card:#101712;--line:rgba(255,255,255,.09);--fg:#F2F5F3;--mut:#8FA399;--g:#00E896;--gold:#D9B65C;--amb:#FFB547;--red:#FF5A5F;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:'Outfit',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
.brand{font-weight:900;letter-spacing:.3em;font-size:12px;color:var(--gold)}
h1{font-size:26px;font-weight:800;line-height:1.1}
p{color:var(--mut);font-size:15px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:#0B100D;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input:focus{border-color:var(--g)}
.code{font-size:40px;font-weight:900;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.b{width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:17px;background:#18221C;border:1px solid var(--line)}
.b.p{background:var(--g);color:#04140C;border-color:var(--g);font-size:22px;padding:22px}
.b.am{background:var(--amb);color:#231500;border-color:var(--amb)}
.b:active{transform:scale(.98)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.it{text-align:left;padding:13px 14px;border-radius:14px;background:#0B100D;border:1px solid var(--line)}
.it b{display:block;font-size:16px}
.it small{color:var(--mut);font-size:13px}
.st{text-align:center}
.st .lab{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--gold)}
.st .clk{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0}
.st .ph{font-size:14px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--g)}
.small{font-size:13px;color:var(--mut);text-align:center}
.lnk{color:var(--g);text-decoration:underline;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{color:#04140C;background:var(--g);border-color:var(--g)}
</style>
</head>
<body>
<div class="brand">COACH DM · TÉLÉCOMMANDE</div>

<!-- 1. connexion au compte -->
<section id="v-login" hidden class="card">
  <h1 data-t="lg_h"></h1>
  <p style="margin:8px 0 14px" data-t="lg_p"></p>
  <a class="b p" style="display:block;text-align:center;text-decoration:none" id="lg-a" href="app.html" data-t="lg_b"></a>
</section>

<!-- 2. code de la TV -->
<section id="v-code" hidden>
  <h1 data-t="cd_h"></h1>
  <p style="margin:6px 0 14px" data-t="cd_p"></p>
  <input id="cd-i" class="code" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="•••••">
  <div style="height:12px"></div>
  <button class="b p" id="cd-b" data-t="cd_b"></button>
  <p class="small" id="cd-e" style="margin-top:10px"></p>
</section>

<!-- 3. choix de la seance -->
<section id="v-pick" hidden>
  <h1 data-t="pk_h"></h1>
  <div class="tabs" style="margin:12px 0 10px"><button id="tb-me" class="on" data-t="tb_me"></button><button id="tb-all" data-t="tb_all"></button></div>
  <input id="pk-q" type="search" autocomplete="off">
  <div style="height:10px"></div>
  <div class="list" id="pk-l"></div>
</section>

<!-- 4. pilotage -->
<section id="v-ctl" hidden style="display:flex;flex-direction:column;gap:12px">
  <div class="card st">
    <div class="lab" id="c-lab"></div>
    <div class="clk" id="c-clk">0:00</div>
    <div class="ph" id="c-ph"></div>
  </div>
  <button class="b p" id="c-go"></button>
  <button class="b" id="c-set" hidden data-t="c_set"></button>
  <div class="row" id="c-rnd" hidden><button class="b" id="c-rm">− 1</button><button class="b" id="c-rp" data-t="c_rp"></button></div>
  <div class="row"><button class="b" id="c-prev" data-t="c_prev"></button><button class="b" id="c-next" data-t="c_next"></button></div>
  <div class="row"><button class="b" id="c-reset" data-t="c_reset"></button><button class="b" id="c-voice"></button></div>
  <button class="b" id="c-chg" data-t="c_chg"></button>
  <p class="small"><span class="dot" id="c-dot"></span><span id="c-conn"></span> · <a href="#" class="lnk" id="c-quit" data-t="c_quit"></a></p>
</section>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb=createClient('https://kkcmhviyvttwpaclrjmv.supabase.co','sb_publishable_XA3iF2j17_cNROPNaG9JuQ_1Swkbz8b');
let LANG=(()=>{ try{ const l=localStorage.getItem('cdm_lang'); if(l) return l; }catch(_){} return (navigator.language||'fr').slice(0,2); })();
if(!['fr','en','nl'].includes(LANG)) LANG='fr';
document.documentElement.lang=LANG;
const TX={
 lg_h:{fr:'Connecte-toi d’abord',en:'Sign in first',nl:'Log eerst in'},
 lg_p:{fr:'La télécommande utilise ton compte Coach DM pour retrouver les séances que tu as créées dans la console. Connecte-toi dans l’app web, puis reviens ici.',en:'The remote uses your Coach DM account to find the sessions you built in the console. Sign in to the web app, then come back here.',nl:'De afstandsbediening gebruikt je Coach DM-account om de trainingen te vinden die je in de console maakte. Log in op de web-app en kom dan terug.'},
 lg_b:{fr:'Me connecter',en:'Sign in',nl:'Inloggen'},
 cd_h:{fr:'Code de la TV',en:'TV code',nl:'Code van de tv'},
 cd_p:{fr:'Ouvre coachdm.be/tv sur l’écran de la box. Tape le code à 5 chiffres affiché.',en:'Open coachdm.be/tv on the box screen. Enter the 5-digit code it shows.',nl:'Open coachdm.be/tv op het scherm van de box. Typ de code van 5 cijfers.'},
 cd_b:{fr:'Connecter',en:'Connect',nl:'Verbinden'},
 cd_e:{fr:'Pas de réponse de la TV. Vérifie le code et que la page est ouverte.',en:'No answer from the TV. Check the code and that the page is open.',nl:'Geen antwoord van de tv. Controleer de code en of de pagina open staat.'},
 pk_h:{fr:'Le cours du jour',en:'Today’s class',nl:'De les van vandaag'},
 tb_me:{fr:'Mes séances',en:'My sessions',nl:'Mijn trainingen'}, tb_all:{fr:'Bibliothèque',en:'Library',nl:'Bibliotheek'},
 q:{fr:'Chercher une séance…',en:'Search a session…',nl:'Zoek een training…'},
 none:{fr:'Aucune séance. Crée ton cours dans la console coach (échauffement, force, WOD…).',en:'No sessions. Build your class in the coach console (warm-up, strength, WOD…).',nl:'Geen trainingen. Maak je les in de coachconsole (opwarming, kracht, WOD…).'},
 c_go:{fr:'▶  Lancer',en:'▶  Start',nl:'▶  Start'}, c_pause:{fr:'⏸  Pause',en:'⏸  Pause',nl:'⏸  Pauze'}, c_res:{fr:'▶  Reprendre',en:'▶  Resume',nl:'▶  Verder'},
 c_set:{fr:'✓  Série faite → repos',en:'✓  Set done → rest',nl:'✓  Set klaar → rust'}, c_rp:{fr:'+ 1 tour',en:'+ 1 round',nl:'+ 1 ronde'},
 c_prev:{fr:'⏮  Partie',en:'⏮  Part',nl:'⏮  Deel'}, c_next:{fr:'Partie  ⏭',en:'Part  ⏭',nl:'Deel  ⏭'},
 c_reset:{fr:'↺  Recommencer',en:'↺  Restart',nl:'↺  Herstarten'}, c_von:{fr:'🔊  Voix',en:'🔊  Voice',nl:'🔊  Stem'}, c_voff:{fr:'🔇  Voix coupée',en:'🔇  Voice off',nl:'🔇  Stem uit'},
 c_chg:{fr:'Changer de séance',en:'Change session',nl:'Andere training'}, c_quit:{fr:'Déconnecter la TV',en:'Disconnect the TV',nl:'Tv loskoppelen'},
 conn:{fr:'TV connectée',en:'TV connected',nl:'Tv verbonden'}, lost:{fr:'TV hors ligne',en:'TV offline',nl:'Tv offline'},
 idle:{fr:'Prêt — appuie sur Lancer',en:'Ready — tap Start',nl:'Klaar — tik op Start'}, count:{fr:'Mise en place…',en:'Get ready…',nl:'Klaarmaken…'},
 work:{fr:'En cours',en:'Running',nl:'Bezig'}, paused:{fr:'En pause',en:'Paused',nl:'Gepauzeerd'}, rest:{fr:'Repos',en:'Rest',nl:'Rust'}, done:{fr:'Terminé',en:'Done',nl:'Klaar'},
 part:{fr:'Partie',en:'Part',nl:'Deel'}, rounds:{fr:'tours',en:'rounds',nl:'rondes'},
 warm:{fr:'ÉCHAUFFEMENT',en:'WARM-UP',nl:'OPWARMING'}, str:{fr:'FORCE / SKILL',en:'STRENGTH / SKILL',nl:'KRACHT / SKILL'}, acc:{fr:'ACCESSOIRES',en:'ACCESSORIES',nl:'ACCESSOIRES'},
 plyo:{fr:'SPRINT / PLIO',en:'SPRINT / PLYO',nl:'SPRINT / PLYO'}, wod:{fr:'WOD',en:'WOD',nl:'WOD'}, cool:{fr:'RETOUR AU CALME',en:'COOL-DOWN',nl:'COOLING-DOWN'}
};
const t=k=>{const o=TX[k];return o?(o[LANG]||o.fr):k;};
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
document.getElementById('pk-q').placeholder=t('q');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const view=v=>['v-login','v-code','v-pick','v-ctl'].forEach(x=>$(x).hidden=(x!==v));
const tap=()=>{ try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} };
const BL={activation:'warm',sprint_plyo:'plyo',strength:'str',accessory:'acc',conditioning:'wod',recovery:'cool'};
const FMT={amrap:'AMRAP',emom:'EMOM',for_time:'For Time',rft:'RFT',classic:''};

let USER=null, CH=null, CODE=null, ST=null, SEEN=0, TAB='me', W=null;

/* ---------- canal avec la TV ---------- */
function send(m){ if(CH) CH.send({type:'broadcast',event:'m',payload:Object.assign({lang:LANG},m)}); }
function connect(code){
  return new Promise(res=>{
    if(CH) sb.removeChannel(CH);
    CODE=code; CH=sb.channel('cdm-tv-'+code,{config:{broadcast:{self:false}}});
    let ok=false;
    CH.on('broadcast',{event:'m'},p=>{ const m=p.payload||{}; SEEN=Date.now();
      if(m.t==='here'){ ok=true; res(true); }
      if(m.t==='st'||m.t==='here'){ if(m.st){ ST=m.st; paint(); } } });
    CH.subscribe(s=>{ if(s==='SUBSCRIBED'){ let n=0; const hi=()=>{ if(ok) return; if(++n>6) return res(false); send({t:'hello',who:'remote'}); setTimeout(hi,800); }; hi(); } });
  });
}
$('cd-i').oninput=e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,5); };
$('cd-b').onclick=async()=>{ tap(); const c=$('cd-i').value; if(c.length!==5) return; $('cd-e').textContent='…';
  const ok=await connect(c); if(!ok){ $('cd-e').textContent=t('cd_e'); return; }
  $('cd-e').textContent=''; try{ sessionStorage.setItem('cdm_tv_remote',c); }catch(_){}
  if(ST&&ST.n) { view('v-ctl'); paint(); } else { view('v-pick'); loadList(); } };

/* ---------- seances ---------- */
const nm=w=>w['name_'+LANG]||w.name_fr||w.name_en||'';
async function loadList(){
  const q=$('pk-q').value.trim(); let r=sb.from('workouts').select('id,name_fr,name_en,name_nl,wod_format,time_cap_seconds,emom_rounds,updated_at,created_by').order('updated_at',{ascending:false}).limit(40);
  if(TAB==='me') r=r.eq('created_by',USER.id); else r=r.eq('is_published',true);
  if(q) r=r.or(`name_fr.ilike.%${q.replace(/[%,()]/g,' ')}%,name_en.ilike.%${q.replace(/[%,()]/g,' ')}%,name_nl.ilike.%${q.replace(/[%,()]/g,' ')}%`);
  const { data }=await r;
  $('pk-l').innerHTML=(data&&data.length)?data.map(w=>`<button class="it" data-id="${w.id}"><b>${esc(nm(w))}</b><small>${esc([FMT[w.wod_format]||'',w.time_cap_seconds?Math.round(w.time_cap_seconds/60)+' min':'',w.emom_rounds?w.emom_rounds+' rounds':'',new Date(w.updated_at).toLocaleDateString(LANG==='en'?'en-GB':LANG+'-BE')].filter(Boolean).join(' · '))}</small></button>`).join(''):`<p>${esc(t('none'))}</p>`;
  $('pk-l').querySelectorAll('.it').forEach(b=>b.onclick=()=>{ tap(); pick(b.dataset.id); });
}
let qT=0; $('pk-q').oninput=()=>{ clearTimeout(qT); qT=setTimeout(loadList,300); };
$('tb-me').onclick=()=>{ TAB='me'; $('tb-me').className='on'; $('tb-all').className=''; loadList(); };
$('tb-all').onclick=()=>{ TAB='all'; $('tb-all').className='on'; $('tb-me').className=''; loadList(); };
async function pick(id){
  const [{ data:w },{ data:items }]=await Promise.all([
    sb.from('workouts').select('*').eq('id',id).single(),
    sb.from('workout_exercises').select('block,display_order,sets,reps,rest_sec,tempo,load_pct_1rm,notes_fr,notes_en,notes_nl,exercises(slug,name_en,name_fr)').eq('workout_id',id).order('display_order')]);
  if(!w) return;
  const parts=[]; let cur=null;
  (items||[]).forEach(r=>{ const ex=r.exercises||{};
    if(!cur||cur.block!==r.block){ cur={block:r.block,items:[]}; parts.push(cur); }
    cur.items.push({slug:ex.slug,name:ex.name_en||ex.name_fr||'',sets:r.sets||1,reps:r.reps||'',rest:r.rest_sec||0,tempo:r.tempo||'',
      load:r.load_pct_1rm?Math.round(r.load_pct_1rm)+'% 1RM':'', note:r['notes_'+LANG]||r.notes_fr||''}); });
  W={name:nm(w),fmt:w.wod_format||'classic',cap:w.time_cap_seconds||0,emi:w.emom_interval_seconds||60,emr:w.emom_rounds||0,rft:w.rft_rounds||0,parts};
  send({t:'load',w:W}); ST=null; view('v-ctl'); paint();
}

/* ---------- pilotage ---------- */
const cmd=(c,v)=>{ tap(); send({t:'cmd',c,v}); };
$('c-go').onclick=()=>cmd('go'); $('c-set').onclick=()=>cmd('set');
$('c-prev').onclick=()=>cmd('prev'); $('c-next').onclick=()=>cmd('next'); $('c-reset').onclick=()=>cmd('reset');
$('c-rp').onclick=()=>cmd('round',1); $('c-rm').onclick=()=>cmd('round',-1);
$('c-voice').onclick=()=>cmd('voice',!(ST&&ST.voice!==false));
$('c-chg').onclick=()=>{ tap(); view('v-pick'); loadList(); };
$('c-quit').onclick=e=>{ e.preventDefault(); send({t:'bye'}); try{ sessionStorage.removeItem('cdm_tv_remote'); }catch(_){} if(CH) sb.removeChannel(CH); CH=null; ST=null; view('v-code'); };
function paint(){
  const s=ST||{}; const live=Date.now()-SEEN<5000;
  $('c-dot').className='dot'+(live?' on':''); $('c-conn').textContent=(live?t('conn'):t('lost'))+' · '+(CODE||'');
  $('c-lab').textContent=(s.block?t(BL[s.block]||'str'):'')+(s.n?'  ·  '+t('part')+' '+(s.p+1)+'/'+s.n:'');
  $('c-clk').textContent=s.clock||'0:00';
  $('c-ph').textContent=({idle:t('idle'),count:t('count'),rest:t('rest'),done:t('done')})[s.phase]||(s.run?t('work'):t('paused'))+(s.rounds?' · '+s.rounds+' '+t('rounds'):'');
  const go=$('c-go'); go.textContent=s.phase==='idle'?t('c_go'):s.run?t('c_pause'):t('c_res'); go.className='b p'+(s.run?' am':'');
  go.disabled=s.phase==='count'||s.phase==='done'; go.style.opacity=go.disabled?.4:1;
  $('c-set').hidden=!!s.wod||s.phase==='idle'||s.phase==='done'||s.phase==='count';
  $('c-rnd').hidden=!(s.wod&&['amrap','rft'].includes(s.fmt));
  $('c-voice').textContent=s.voice===false?t('c_voff'):t('c_von');
}
setInterval(()=>{ if(!$('v-ctl').hidden) paint(); if(CH&&!$('v-ctl').hidden&&Date.now()-SEEN>4000) send({t:'hello',who:'remote'}); },1000);

/* ---------- demarrage ---------- */
(async()=>{
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){  view('v-login'); return; }
  USER=session.user;
  const qs=new URLSearchParams(location.search); let c=qs.get('code'); try{ c=c||sessionStorage.getItem('cdm_tv_remote'); }catch(_){}
  if(c&&/^\d{5}$/.test(c)){ $('cd-i').value=c; view('v-code'); $('cd-b').click(); } else view('v-code');
})();
</script>
</body>
</html>
