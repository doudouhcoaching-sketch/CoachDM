<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Coach DM — Lecteur</title>
<style>html,body{margin:0;height:100%;background:#070A08}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<script>
(function(){
  var q=new URLSearchParams(location.search), v=(q.get('v')||'').trim();
  if(!/^[\w-]{11}$/.test(v)) return;
  var f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+v+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&fs=1&iv_load_policy=3';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.setAttribute('allowfullscreen','');
  document.body.appendChild(f);
})();
</script></body></html>
