<style>
:root{
  --bg:#0A0907;--card:#12100C;--card2:#17140F;--line:rgba(242,236,222,.10);--line2:rgba(233,199,103,.35);
  --ink:#F2ECDE;--mut:#A39A88;--gold:#E9C767;--gold1:#F1D485;--gold2:#D9B154;--err:#E8806B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(233,199,103,.10),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(233,199,103,.06),transparent 60%)}
a{color:var(--gold)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 36px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 13px/1 Sora,sans-serif;letter-spacing:.16em}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.langs{display:flex;gap:4px}
.langs button{background:none;border:0;color:var(--mut);font:600 12px/1 Manrope,sans-serif;letter-spacing:.08em;padding:8px 10px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold);color:#14110A}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font:600 11px/1 Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
h1{font:700 clamp(38px,9vw,56px)/1.02 Sora,sans-serif;letter-spacing:-.03em;margin:18px 0 18px}
h1 em{font:italic 400 1.08em/1 "Instrument Serif",Georgia,serif;color:var(--gold);letter-spacing:-.01em}
.lead{color:var(--mut);font-size:17px;max-width:54ch}
form{margin-top:36px;display:grid;gap:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px}
.q label.t,.q .t{display:block;font:600 15px/1.35 Sora,sans-serif;letter-spacing:-.01em;margin-bottom:4px}
.q .n{color:var(--gold);font:600 11px/1 Manrope,sans-serif;letter-spacing:.16em;margin-bottom:10px;display:block}
.q .h{color:var(--mut);font-size:13.5px;margin-bottom:12px;display:block}
.req::after{content:" *";color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 110px;gap:10px}
input[type=text],input[type=email],textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font:500 16px/1.4 Manrope,sans-serif;padding:13px 14px;outline:none;transition:border-color .15s}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:#6F685A}
.count{display:block;text-align:right;color:#6F685A;font-size:12px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font:500 14.5px/1.2 Manrope,sans-serif;cursor:pointer;transition:all .15s}
.chip input:checked+span{border-color:var(--gold);color:#14110A;background:linear-gradient(var(--gold1),var(--gold2))}
.chip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;line-height:0}
.stars svg{width:38px;height:38px;fill:transparent;stroke:#5E584B;stroke-width:1.4;transition:all .12s}
.stars button.on svg{fill:var(--gold);stroke:var(--gold)}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);cursor:pointer;font-size:15px}
.radio input{appearance:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #6F685A;flex:none;margin-top:1px;display:grid;place-content:center}
.radio input:checked{border-color:var(--gold)}
.radio input:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.radio:has(input:checked){border-color:var(--line2)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #6F685A;flex:none;margin-top:1px;display:grid;place-content:center}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid #14110A;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
#emailBox{margin-top:12px;display:none}
.legal{color:var(--mut);font-size:13px;padding:2px 4px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:17px 22px;border-radius:999px;background:linear-gradient(var(--gold1),var(--gold2));color:#14110A;
  font:700 16px/1 Sora,sans-serif;letter-spacing:-.01em;box-shadow:0 10px 30px -10px rgba(233,199,103,.45);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.55;cursor:wait}
.err{color:var(--err);font-size:14px;min-height:1px;padding:0 4px}
.done{display:none;margin-top:40px;background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:34px 22px;text-align:center}
.done h2{font:700 30px/1.1 Sora,sans-serif;letter-spacing:-.02em;margin-bottom:12px}
.done h2 em{font:italic 400 1.1em/1 "Instrument Serif",serif;color:var(--gold)}
.done p{color:var(--mut);margin-bottom:22px}
.done a.btn{display:inline-block;width:auto;text-decoration:none}
footer{margin-top:48px;color:#6F685A;font-size:12.5px;text-align:center}
footer a{color:#8D8576}
@media (max-width:420px){.row{grid-template-columns:1fr 90px}.stars svg{width:34px;height:34px}}
</style>
</head>

          <label class="chip"><input type="radio" name="service" value="online"><span data-i="s_online"></span></label>
          <label class="chip"><input type="radio" name="service" value="app"><span data-i="s_app"></span></label>
        </div>
      </div>

      <div class="q">
        <span class="n">03</span>
        <span class="t" data-i="q3"></span>
        <div class="chips" style="margin-top:12px">
          <label class="chip"><input type="radio" name="duration" value="lt3m"><span data-i="d1"></span></label>
          <label class="chip"><input type="radio" name="duration" value="3to12m"><span data-i="d2"></span></label>
          <label class="chip"><input type="radio" name="duration" value="gt1y"><span data-i="d3"></span></label>
        </div>
      </div>

      <div class="q">
        <span class="n">04</span>
        <label class="t" for="before_text" data-i="q4"></label>
        <span class="h" data-i="q4h"></span>
        <textarea id="before_text" name="before_text" maxlength="600" data-ph="ph4"></textarea>
      </div>

      <div class="q">
        <span class="n">05</span>
        <label class="t" for="after_text" data-i="q5"></label>
        <span class="h" data-i="q5h"></span>
        <textarea id="after_text" name="after_text" maxlength="600" data-ph="ph5"></textarea>
      </div>

      <div class="q">
        <span class="n">06</span>
        <label class="t req" for="quote" data-i="q6"></label>
        <span class="h" data-i="q6h"></span>
        <textarea id="quote" name="quote" maxlength="280" data-ph="ph6" required></textarea>
        <span class="count"><span id="qc">0</span>/280</span>
      </div>

      <div class="q">
        <span class="n">07</span>
        <span class="t" data-i="q7"></span>
        <div class="stars" id="stars" style="margin-top:12px"></div>
      </div>

      <div class="q">
        <span class="n">08</span>
        <span class="t req" data-i="q8"></span>
        <span class="h" data-i="q8h"></span>
        <div class="radios">
          <label class="radio"><input type="radio" name="publish" value="name"><span data-i="p_name"></span></label>
          <label class="radio"><input type="radio" name="publish" value="anonymous"><span data-i="p_anon"></span></label>
          <label class="radio"><input type="radio" name="publish" value="private"><span data-i="p_priv"></span></label>
        </div>
        <div style="margin-top:16px">
          <label class="check"><input type="checkbox" name="recontact" id="recontact"><span data-i="recontact"></span></label>
          <div id="emailBox"><input type="email" name="email" maxlength="200" autocomplete="email" data-ph="ph_mail"></div>
        </div>
      </div>

      <p class="legal" data-i="legal"></p>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="send" data-i="send"></button>
    </form>
  </main>

  <section class="done" id="done" aria-live="polite">
    <h2 data-i="thx_t"></h2>
    <p data-i="thx_p"></p>
    <a class="btn" href="index.html" data-i="thx_b"></a>
  </section>

  <footer>© 2026 Coach DM · <a href="mailto:contact@coachdm.be">contact@coachdm.be</a> · <a href="privacy.html" data-i="privacy"></a></footer>
</div>

    if (!q) { err.textContent = t.e_quote; quote.focus(); return; }
    if (!pub) { err.textContent = t.e_pub; return; }
    if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { err.textContent = t.e_mail; f.elements.email.focus(); return; }

    var init = val('last_initial');
    if (init) init = init.replace(/[^A-Za-zÀ-ÿ]/g, '').slice(0, 2).toUpperCase() || null;

    var row = {
      source: 'site',
      lang: lang,
      first_name: first,
      last_initial: init,
      service: val('service'),
      duration: val('duration'),
      before_text: val('before_text'),
      after_text: val('after_text'),
      quote: q,
      rating: rating || null,
      publish: pub,
      recontact: rc.checked && !!mail,
      email: mail
    };

    send.disabled = true;
    send.textContent = t.sending;
    fetch(SB_URL + '/rest/v1/testimonials', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(row)
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      showDone();
    }).catch(function () {
      err.textContent = t.e_net;
      send.disabled = false;
      send.textContent = t.send;
    });
  });

  function showDone() {
    document.getElementById('main').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  apply();
})();
</script>
</body>
</html>
