<!-- ───────────────────────────────────────────────────────────────────────────
  Le mode jeu ne vit plus ici. Il a ete fusionne dans app.html, pour une raison
  de fond : cette page n'avait pas la session de l'app, donc elle lisait
  l'abonnement dans un drapeau du stockage local — que n'importe qui pouvait
  mettre a 1. Le jeu tourne maintenant dans l'app, derriere le meme controle
  serveur que les programmes et la console coach.

  Ce fichier reste en place et ne fait qu'une chose : renvoyer vers l'app. Des
  raccourcis, des favoris et surtout les paquets iOS et Android deja construits
  pointent encore sur /jeu.html ; le supprimer donnerait un ecran blanc a ces
  gens-la, sans aucun message.
─────────────────────────────────────────────────────────────────────────── -->

  html,body{margin:0;height:100%;background:#050807;color:#C9DCD3;

</div>

     sinon le bouton retour y ramene en boucle. */

</script>
