<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#070A08" />
<title>Coach DM · Atelier programmes</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ATELIER PROGRAMMES — Coach DM
   Une page a part de la console : la messagerie, les cours et la fiche
   client restent dans coach.html, intacts. Ici on ne fait qu'une chose,
   construire et envoyer des programmes, et on la fait simplement.
   ===================================================================== */
:root{
  --bg:#070A08; --bg2:#0C110E; --s1:#111814; --s2:#18211C; --s3:#202B25;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#F2F0E9; --muted:#93A69B; --dim:#64766C;
  --brand:#00E896; --brand2:#00B978; --brandsoft:rgba(0,232,150,.13);
  --gold:#E9C767; --goldsoft:rgba(233,199,103,.14); --red:#FF6464; --redsoft:rgba(255,100,100,.12);
  --r:20px; --r2:14px; --r3:10px;
  --sh:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background:radial-gradient(120% 60% at 50% -12%, rgba(0,232,150,.14), transparent 62%),linear-gradient(180deg,var(--bg2),var(--bg) 40%);
  min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}
.hidden{display:none!important}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(7,10,8,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.96)}
.lang{display:flex;gap:4px}
.lang button{padding:7px 9px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted)}
.lang button.on{background:var(--brandsoft);color:var(--brand)}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 22px;border-radius:16px;
  font-size:16.5px;font-weight:800;letter-spacing:.005em;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(180deg,var(--brand),var(--brand2));color:#03140C;box-shadow:0 10px 26px rgba(0,232,150,.28)}
.btn.soft{background:var(--s2);border:1.5px solid var(--line2)}
.btn.gold{background:var(--goldsoft);color:var(--gold);border:1.5px solid rgba(233,199,103,.4)}
.btn.danger{background:var(--redsoft);color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- accueil ---------- */
.hero{display:flex;flex-direction:column;gap:14px;margin:6px 0 22px}
.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.bigadd{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(0,232,150,.18),rgba(0,232,150,.05));border:1.5px solid rgba(0,232,150,.45)}
.bigadd .plus{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--brand);color:#03140C;flex:none}
.bigadd .plus .ic{width:30px;height:30px;stroke-width:2.6}
.bigadd b{display:block;font-size:19px;font-weight:800}
.bigadd span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.sect{font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:26px 2px 12px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);text-align:left;width:100%}
.pcard:active{transform:scale(.99)}
.av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;
  background:linear-gradient(145deg,#2A3A31,#18211C);color:var(--brand);border:1px solid var(--line2)}
.pcard .tx{flex:1;min-width:0}
.pcard b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{color:var(--muted);font-size:13px;margin-top:3px}
.bar{height:6px;border-radius:9px;background:var(--s3);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.pill.on{background:var(--brandsoft);color:var(--brand)}
.pill.draft{background:var(--goldsoft);color:var(--gold)}
.pill.off{background:var(--s3);color:var(--muted)}
.empty{padding:30px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line2);border-radius:var(--r);font-size:15px;line-height:1.5}

/* ---------- assistant (3 etapes) ---------- */
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--s3)}
.steps i.on{background:var(--brand)}
.q{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.015em}
.qsub{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.45}
.tdcard{align-items:flex-start;cursor:pointer}
.tdcard.hot{border-color:rgba(255,100,100,.45)}
.tdchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tdchip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--s3);color:var(--muted)}
.tdchip.l2{background:var(--redsoft);color:var(--red)}
.tdchip.l1{background:var(--goldsoft);color:var(--gold)}
.tdwk{font-weight:700}
.tdacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tdb{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--s2,var(--s3));border:1px solid var(--line);font-weight:700;font-size:13.5px;color:inherit}
.tdb .ic{width:16px;height:16px}
.tdstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.tdstats>div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.tdstats small{display:block;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.tdstats b{display:block;font-size:16px;margin-top:4px}
.tdstats span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tdbig{display:flex;flex-direction:column;gap:10px}
.tdall{display:flex;align-items:center;gap:10px;margin:22px 2px;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:var(--r);background:var(--s1);
  border:2px solid var(--line);text-align:center;font-weight:700;font-size:15px}
.tile .av{width:56px;height:56px;font-size:20px;border-radius:18px}
.tile.on{border-color:var(--brand);background:var(--brandsoft)}
.tile small{color:var(--muted);font-weight:600;font-size:12px}
.field{margin-bottom:18px}
.field > label{display:block;font-size:14px;font-weight:700;margin:0 0 8px 2px}
.inp{width:100%;min-height:54px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line2);background:var(--s1);outline:none;font-size:17px}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brandsoft)}
textarea.inp{min-height:90px;padding:14px 16px;line-height:1.5;resize:vertical}
.stepper{display:flex;align-items:center;gap:0;background:var(--s1);border:1.5px solid var(--line2);border-radius:16px;overflow:hidden;width:max-content}
.stepper button{width:56px;height:56px;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--brand)}
.stepper button:active{background:var(--s3)}
.stepper output{min-width:76px;text-align:center;font-size:22px;font-weight:800}
.stepper output small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.days button{height:56px;border-radius:14px;background:var(--s1);border:2px solid var(--line);font-weight:800;font-size:15px}
.days button.on{background:var(--brand);color:#03140C;border-color:var(--brand)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{padding:16px;border-radius:var(--r);background:var(--s1);border:2px solid var(--line);text-align:left}
.choice button.on{border-color:var(--brand);background:var(--brandsoft)}
.choice b{display:block;font-size:16px}
.choice span{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}
.progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:12px}
.progs button{padding:14px;border-radius:16px;background:var(--s1);border:2px solid var(--line);text-align:left}
.progs button.on{border-color:var(--gold);background:var(--goldsoft)}
.progs b{display:block;font-size:15px}
.progs span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}

/* ---------- grille du programme ---------- */
.phead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.phead .inp{flex:1;min-width:220px;font-weight:800;font-size:19px}
.legend{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
.week{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.whead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.whead b{font-size:17px;font-weight:800;flex:1;min-width:110px}
.whead b small{color:var(--muted);font-weight:600;font-size:13px;margin-left:6px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:12px;background:var(--s2);
  border:1px solid var(--line2);font-size:13.5px;font-weight:700;color:var(--text)}
.chipbtn .ic{width:16px;height:16px}
.cells{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
@media (max-width:760px){.cells{grid-template-columns:1fr}}
.cell{min-height:118px;border-radius:16px;border:2px dashed var(--line2);display:flex;flex-direction:column;gap:6px;padding:12px;text-align:left;position:relative;background:transparent}
.cell .d{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.cell.add{align-items:center;justify-content:center;text-align:center;color:var(--brand)}
.cell.add .d{position:absolute;top:10px;left:12px}
.cell.add .pl{width:44px;height:44px;border-radius:14px;background:var(--brandsoft);display:grid;place-items:center}
.cell.add .pl .ic{width:24px;height:24px;stroke-width:2.6}
.cell.add em{font-style:normal;font-weight:700;font-size:14px}
.cell.full{border-style:solid;border-color:rgba(0,232,150,.35);background:linear-gradient(180deg,rgba(0,232,150,.08),rgba(0,232,150,.02))}
.cell.full b{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.full .m{color:var(--muted);font-size:12.5px;margin-top:auto}
.cell.full .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--goldsoft);color:var(--gold)}
.cell.full.mine .tag{background:var(--brandsoft);color:var(--brand)}
.cell.done{opacity:.6}
.cell.done::after{content:'✓';position:absolute;bottom:10px;right:12px;color:var(--brand);font-weight:900}
.addweek{width:100%;min-height:60px;border-radius:var(--r);border:2px dashed var(--line2);color:var(--muted);font-weight:700;font-size:15px}

/* ---------- barre d'action du bas ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(7,10,8,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.dock .in{max-width:1180px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}

/* ---------- feuilles (panneaux du bas / modales) ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:760px;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg2);
  border:1px solid var(--line2);border-bottom:none;border-radius:26px 26px 0 0;box-shadow:var(--sh);
  transform:translateY(30px);transition:transform .2s}
.ov.show .sheet{transform:none}
.ov.full .sheet{max-width:980px;height:96dvh;max-height:none}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--line2);max-height:88dvh}.ov.full .sheet{height:90dvh}}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;margin:0;font-size:19px;font-weight:800}
.sh-b{padding:16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh-f .btn{flex:1}
.acts{display:grid;gap:9px}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;font-size:16px;font-weight:700}
.act .ic{width:24px;height:24px;color:var(--brand)}
.act.red .ic,.act.red{color:var(--red)}
.act small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- choix d'une seance ---------- */
.tabs{display:flex;gap:6px;background:var(--s1);padding:5px;border-radius:16px;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border-radius:12px;font-weight:800;font-size:14.5px;color:var(--muted)}
.tabs button.on{background:var(--s3);color:var(--text)}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:46px}
.wlist{display:grid;gap:8px}
.witem{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;background:var(--s1);border:1px solid var(--line);text-align:left;width:100%}
.witem .tx{flex:1;min-width:0}
.witem b{display:block;font-size:15px;line-height:1.3}
.witem span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.witem .go{color:var(--brand)}
.mitem .tx{flex:1 1 55%;min-width:170px}
.grp{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin:16px 2px 8px}
.progrow{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.progrow::-webkit-scrollbar{display:none}
.progrow button{flex:none;min-height:40px;padding:0 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line2);font-weight:700;font-size:13.5px;white-space:nowrap}
.progrow button.on{background:var(--goldsoft);border-color:var(--gold);color:var(--gold)}

/* ---------- editeur de seance ---------- */
.exl{display:grid;gap:12px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative}
.ex.ss{border-left:4px solid var(--gold)}
.ex.drag{opacity:.55;border-color:var(--brand)}
.ex-top{display:flex;gap:12px;align-items:center}
.thumb{width:74px;height:74px;border-radius:14px;flex:none;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 8%, rgba(0,255,163,.10), transparent 66%),#0B100E;border:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .noanim{width:100%;height:100%;display:grid;place-items:center;color:var(--dim);font-weight:800;font-size:20px}
.ex-top .tx{flex:1;min-width:0}
.ex-top b{display:block;font-size:16px;line-height:1.25}
.ex-top span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.ex-top .ssb{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;color:var(--gold);background:var(--goldsoft);padding:3px 8px;border-radius:999px}
.handle{width:40px;height:56px;display:grid;place-items:center;color:var(--dim);touch-action:none;cursor:grab}
.ex-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:520px){.ex-ctl{grid-template-columns:1fr 1fr}}
.mini{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:8px 6px 6px;text-align:center}
.mini > label{display:block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mini .row{display:flex;align-items:center;justify-content:space-between}
.mini .row button{width:40px;height:40px;border-radius:11px;font-size:22px;font-weight:700;color:var(--brand)}
.mini .row button:active{background:var(--s3)}
.mini .row input{width:100%;min-width:0;text-align:center;background:transparent;border:none;outline:none;font-size:19px;font-weight:800;padding:0}
.mini.off .row input{color:var(--dim)}
.ex-more{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ex-x{display:none;margin-top:10px;gap:8px;grid-template-columns:1fr 1fr}
.ex.open .ex-x{display:grid}
.ex-x .inp{min-height:46px;font-size:15px}
.ex-x .full{grid-column:1/-1}
.ex-x label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.addex{width:100%;min-height:64px;border-radius:var(--r);border:2px dashed rgba(0,232,150,.45);color:var(--brand);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.addex .ic{width:24px;height:24px;stroke-width:2.6}
.total{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin:6px 2px 14px}
.total b{color:var(--text)}

/* ---------- bibliotheque de mouvements ---------- */
.fchips{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);font-weight:700;font-size:13.5px;white-space:nowrap}
.fchips button.on{background:var(--brand);color:#03140C;border-color:var(--brand)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mv{position:relative;display:flex;flex-direction:column;border-radius:16px;background:var(--s1);border:2px solid var(--line);overflow:hidden;text-align:left}
.mv .thumb{width:100%;height:118px;border-radius:0;border:none;border-bottom:1px solid var(--line)}
.mv b{font-size:13.5px;line-height:1.25;padding:9px 10px 2px}
.mv span{font-size:11.5px;color:var(--muted);padding:0 10px 10px}
.mv.added{border-color:var(--brand)}
.mv .cnt{position:absolute;top:8px;right:8px;min-width:28px;height:28px;border-radius:999px;background:var(--brand);color:#03140C;font-weight:900;font-size:14px;display:none;place-items:center;padding:0 7px}
.mv.added .cnt{display:grid}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:90;
  background:#F2F0E9;color:#06110B;font-weight:800;font-size:15px;padding:13px 20px;border-radius:14px;box-shadow:var(--sh);
  opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}
.load{display:grid;place-items:center;min-height:50dvh;color:var(--muted);gap:14px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--s3);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gate{max-width:440px;margin:12dvh auto;padding:28px;text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.gate h2{margin:0 0 8px}
.gate p{color:var(--muted);line-height:1.5}
.help{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--goldsoft);border:1px solid rgba(233,199,103,.3);color:#EFDFAE;font-size:14px;line-height:1.5;margin-bottom:16px}
.help .ic{color:var(--gold);margin-top:1px}
.rig .f1,.rig .f2,.rig .f3{animation-duration:3.6s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.rig .f1{animation-name:phA}.rig .f2{animation-name:phB}.rig .f3{animation-name:phC}
@keyframes phA{0%,18%{opacity:1}30%,100%{opacity:0}}
@keyframes phB{0%,18%{opacity:0}30%,52%{opacity:1}64%,100%{opacity:0}}
@keyframes phC{0%,52%{opacity:0}64%,100%{opacity:1}}
.still .f2,.still .f3{opacity:0}
@media (prefers-reduced-motion: reduce){.rig .f1,.rig .f2,.rig .f3{animation:none}.rig .f1,.rig .f2{opacity:0}}

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = (d) => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); x.setHours(0, 0, 0, 0); return x; };

const cellOf = (w) => ({ workout_id: w.id, name: wName(w), name_fr: w.name_fr, name_en: w.name_en, name_nl: w.name_nl, dur: w.estimated_duration_min, n: w.exercise_count, mine: !!w.is_mine });

/* =====================================================================
   OUVRIR UN PROGRAMME EXISTANT
   ===================================================================== */
async function openPlan(p) {
  try {
    const d = await rpc('coach_get_plan', { p_id: p.id });
    const items = d.items || [];
    const lib = await loadLib(); const byId = {}; lib.forEach((w) => byId[w.id] = w);
    const dates = items.filter((i) => i.scheduled_date).map((i) => parse(i.scheduled_date));
    const s0 = d.plan.start_date ? parse(d.plan.start_date) : (dates.length ? new Date(Math.min(...dates)) : new Date());
    const m = monday(s0);
    const days = [...new Set(dates.map(dowOf))].sort();
    const weeks = dates.length ? Math.max(1, Math.floor((Math.max(...dates) - m) / 864e5 / 7) + 1) : 4;
    PLAN = { id: d.plan.id, client: p.client, title: d.plan.title_fr || '', start: iso(m), weeks, days: days.length ? days : [1, 3, 5], cells: {}, status: d.plan.status, dirty: false };
    const loose = [];
    items.forEach((i) => {
      const w = byId[i.workout_id] || { id: i.workout_id, name_fr: i.workout_name, estimated_duration_min: i.estimated_duration_min, is_mine: false };
      const c = { ...cellOf(w), done: !!i.completed_at, notes: i.notes || '' };
      if (!i.scheduled_date) { loose.push(c); return; }
      const dt = parse(i.scheduled_date); const wk = Math.floor((dt - m) / 864e5 / 7);
      PLAN.cells[wk + '-' + dowOf(dt)] = c;
    });
    for (const c of loose) { outer: for (let w = 0; w < PLAN.weeks; w++) for (const d2 of PLAN.days) if (!PLAN.cells[w + '-' + d2]) { PLAN.cells[w + '-' + d2] = c; break outer; } }
    go(viewPlan);
  } catch (e) { toast(errMsg(e), true); }
}

/* =====================================================================

   ===================================================================== */
const cellDate = (w, d) => addDays(parse(PLAN.start), w * 7 + (d - 1));

  if (!filled) h += `<div class="help">${ic('info')}<div>${t('help_first')}</div></div>`;
  for (let w = 0; w < P.weeks; w++) {
    const d0 = cellDate(w, 1);
    h += `<section class="week"><div class="whead"><b>${esc(t('week', { n: w + 1 }))}<small>${esc(fmtShort(d0))}</small></b>

      <div class="cells" style="--n:${P.days.length}">`;
    for (const d of P.days) {
      const k = w + '-' + d, c = P.cells[k], dt = cellDate(w, d);
      const lab = `${DOW[LANG][d - 1]} ${dt.getDate()}`;

function copyWeek(from, to) {
  const P = PLAN; if (to >= P.weeks) P.weeks = to + 1;
  for (const d of P.days) { const c = P.cells[from + '-' + d]; if (c) P.cells[to + '-' + d] = { ...c, done: false }; else delete P.cells[to + '-' + d]; }
  P.dirty = true; viewPlan(); toast(t('copied', { a: from + 1, b: to + 1 }));
  const secs = $$('.week'); if (secs[to]) secs[to].scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function weekMenu(w) {
  const sh = openSheet('ov', shHead(t('week', { n: w + 1 }), 'ov') + `<div class="sh-b"><div class="acts">

    ${PLAN.weeks > 1 ? `<button class="act red" data-a="del">${ic('trash')}<div>${esc(t('del_week'))}</div></button>` : ''}</div></div>`);
  $$('[data-a]', sh).forEach((b) => b.onclick = () => {
    const P = PLAN, a = b.dataset.a; closeSheet('ov');

    if (a === 'all') { for (let x = w + 1; x < P.weeks; x++) for (const d of P.days) { const c = P.cells[w + '-' + d]; if (c) P.cells[x + '-' + d] = { ...c, done: false }; else delete P.cells[x + '-' + d]; } }
    if (a === 'clear') for (const d of P.days) delete P.cells[w + '-' + d];
    if (a === 'del') {
      const nc = {}; for (const k in P.cells) { const [ww, dd] = k.split('-').map(Number); if (ww < w) nc[k] = P.cells[k]; else if (ww > w) nc[(ww - 1) + '-' + dd] = P.cells[k]; }
      P.cells = nc; P.weeks--;

}

async function savePlan(status, leave = false, quiet = false) {
  const P = PLAN; const btns = $$('#dock .btn'); btns.forEach((b) => b.disabled = true);
  try {
    const id = await rpc('coach_upsert_plan', { p_id: P.id, p_client: P.client.client_id, p_title_fr: (P.title || '').trim() || t('prog_of', { n: firstName(P.client) }), p_start_date: P.start, p_status: status });
    P.id = id;
    const keys = Object.keys(P.cells).map((k) => { const [w, d] = k.split('-').map(Number); return { k, w, d, dt: cellDate(w, d) }; }).sort((a, b) => a.dt - b.dt);
    const items = keys.map((x, i) => ({ workout_id: P.cells[x.k].workout_id, scheduled_date: iso(x.dt), pos: i + 1, notes: P.cells[x.k].notes || null }));
    await rpc('coach_set_plan_items', { p_plan: id, p_items: items });
    P.status = status; P.dirty = false; HOME_PLANS = null;
    if (!quiet) toast(status === 'active' ? t('sent', { n: firstName(P.client) }) : status === 'archived' ? t('archived') : t('saved'));
    if (leave || status === 'archived') { STACK.length = 0; HOME_TAB = 'prog'; go(viewHome); } else if (!quiet) viewPlan();
  } catch (e) { toast(errMsg(e), true); }
  finally { btns.forEach((b) => b.disabled = false); }
}

function estMin(items) {
  let s = 0;
  items.forEach((it) => { const sets = +it.sets || 3; const r = parseInt(it.reps, 10) || 10; s += sets * (Math.min(r, 30) * 3.5 + (+it.rest_sec || 60)); });
  return Math.max(5, Math.round(s / 60 / 5) * 5 + 5);
}
function groupsOf(items) {
  const g = []; let letter = 0, cur = null;
  items.forEach((it, i) => {
    const prevLinked = i > 0 && items[i - 1].link;
    if (it.link || prevLinked) { if (!prevLinked) cur = String.fromCharCode(65 + letter++); g[i] = cur; } else g[i] = null;
  });
  return g;
}

      const move = (ev) => {
        const cards = $$('.ex', list).filter((c) => c !== card);
        let placed = false;
        for (const c of cards) { const r = c.getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { list.insertBefore(card, c); placed = true; break; } }
        if (!placed) list.appendChild(card);
        const sr = scroller.getBoundingClientRect();
        if (ev.clientY < sr.top + 60) scroller.scrollTop -= 12; else if (ev.clientY > sr.bottom - 60) scroller.scrollTop += 12;
      };
      const up = () => {
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        const order = $$('.ex', list).map((c) => +c.dataset.i);
        if (order.join() !== ED.items.map((_, i) => i).join()) { ED.items = order.map((i) => ED.items[i]); ED.open = {}; ED.dirty = true; }
        paintKeepScroll();
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    };
  });
}

async function saveEditor() {
  if (!ED) return;
  const name = (ED.name || '').trim();
  if (!name) return toast(t('need_name'), true);
  if (!ED.items.length) return toast(t('need_ex'), true);
  const btn = $('#ed-save'); btn.disabled = true;
  try {
    const dur = estMin(ED.items);
    let id = ED.id;
    if (!id) {
      id = await rpc('admin_upsert_workout', { p_id: null, p_name_fr: name, p_name_en: name, p_name_nl: name, p_type: 'strength', p_difficulty: 'intermediate', p_estimated_duration_min: dur, p_is_published: false });
    } else {
      await rpc('studio_rename_workout', { p_id: id, p_name: name, p_duration: dur });
    }
    const G = groupsOf(ED.items);
    const items = ED.items.map((it, i) => ({ exercise_id: it.exercise_id, block: it.block || 'strength', display_order: i + 1, sets: it.sets ?? 3, reps: String(it.reps ?? ''),
      target_rpe: it.target_rpe ?? '', rest_sec: it.rest_sec ?? '', tempo: it.tempo || '', superset_group: G[i] || '', notes_fr: it.notes_fr || '', notes_en: it.notes_en || '', notes_nl: it.notes_nl || '' }));
    await rpc('admin_set_workout_exercises', { p_workout_id: id, p_items: items });
    await rpc('studio_set_loads', { p_workout_id: id, p_items: ED.items.map((it, i) => ({ display_order: i + 1, load_pct_1rm: it.load_pct_1rm == null || it.load_pct_1rm === '' ? null : +it.load_pct_1rm })) });
    const w = { id, name_fr: name, name_en: name, name_nl: name, estimated_duration_min: dur, exercise_count: ED.items.length, is_mine: true };
    if (LIB) { LIB = LIB.filter((x) => x.id !== id); LIB.unshift(w); }
    if (PLAN && ED.cellKey) {
      const oldId = PLAN.cells[ED.cellKey] && PLAN.cells[ED.cellKey].workout_id;
      if (!ED.asCopy && oldId === id) { for (const k in PLAN.cells) if (PLAN.cells[k].workout_id === id) PLAN.cells[k] = { ...PLAN.cells[k], ...cellOf(w) }; }

      PLAN.dirty = true;
    }
    ED.dirty = false; closeSheet('ov2'); toast(t('saved')); if (PLAN) viewPlan();
  } catch (e) { toast(errMsg(e), true); btn.disabled = false; }
}

/* ---------------- calculateur ---------------- */
let CALC = null;
function ageOf(dob) { if (!dob) return null; const d = parse(dob), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; }
function openCalc() {
  const d = NC.detail || {}, p = d.profile || {}, nt = d.nutrition_targets || {};
  const w = (Array.isArray(d.weight) && d.weight.length && (d.weight[d.weight.length - 1].kg || d.weight[d.weight.length - 1].weight_kg)) || nt.current_weight_kg || 75;
  CALC = { sex: p.sex === 'female' ? 'female' : 'male', age: ageOf(p.date_of_birth) || 30, h: Math.round(p.height_cm || (p.sex === 'female' ? 166 : 178)),
    w: Math.round(+w * 2) / 2, act: 'moderate', goal: nt.goal && GOALS.some((g) => g[0] === nt.goal) ? nt.goal : 'maintain', pace: 2, pkg: null, adj: 0 };
  paintCalc();
}
function calcRes() {
  const C = CALC;
  const bmr = 10 * C.w + 6.25 * C.h - 5 * C.age + (C.sex === 'male' ? 5 : -161);
  const f = (ACT.find((a) => a[0] === C.act) || ACT[2])[1];
  const tdee = bmr * f;
  const pace = { lose_fat: [.10, .18, .25], build_muscle: [.05, .10, .15] };
  let kcal = tdee;
  if (C.goal === 'lose_fat') kcal = tdee * (1 - pace.lose_fat[C.pace - 1]);
  else if (C.goal === 'build_muscle') kcal = tdee * (1 + pace.build_muscle[C.pace - 1]);
  else if (C.goal === 'recomp') kcal = tdee * .95;
  else if (C.goal === 'performance') kcal = tdee * 1.05;
  kcal = Math.max(C.sex === 'male' ? 1500 : 1200, r5(kcal + C.adj));
  const pkgDef = { lose_fat: 2.0, maintain: 1.8, build_muscle: 1.8, recomp: 2.2, performance: 1.8 }[C.goal];
  const pkg = C.pkg || pkgDef;
  const P = Math.round(pkg * C.w);
  const F = Math.round(Math.max(.8 * C.w, kcal * .25 / 9));
  const Cb = Math.max(50, Math.round((kcal - P * 4 - F * 9) / 4));
  const weekly = C.goal === 'lose_fat' || C.goal === 'build_muscle' ? Math.abs((kcal - tdee) * 7 / 7700) : 0;
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, P, F, C: Cb, pkg, fiber: Math.round(kcal / 1000 * 14), water: Math.round(C.w * 35 / 250) * 250, weekly };
}

  $$('[data-sex]', b).forEach((x) => x.onclick = () => { C.sex = x.dataset.sex; re(); });

function itemVals(it) {
  if (it.kind === 'recipe') return { k: it.base.k * it.qty, p: it.base.p * it.qty, c: it.base.c * it.qty, f: it.base.f * it.qty };

}
function targetsOf() { const nt = NC && NC.detail && NC.detail.nutrition_targets; return nt && nt.daily_calories_kcal ? { k: nt.daily_calories_kcal, p: nt.protein_g, c: nt.carbs_g, f: nt.fat_g } : null; }

/* remplissage automatique : une recette par moment vide, portion ajustee
   pour coller a la part de calories du moment, puis on privilegie les
   recettes riches en proteines si on est en dessous de l'objectif. */
async function autoFill() {
  const rec = await loadRecipes(); const T = targetsOf() || { k: 2200, p: 140, c: 250, f: 70 };
  const usedIds = new Set(MP.items.filter((i) => i.kind === 'recipe').map((i) => i.ref.id));
  const shares = MP.slots.reduce((a, s) => a + SLOT_SHARE[s], 0) || 1;
  for (const s of MP.slots) {
    if (MP.items.some((i) => i.day === MP.day && i.slot === s)) continue;
    const want = T.k * SLOT_SHARE[s] / shares, wantP = T.p * SLOT_SHARE[s] / shares;
    const pool = rec.filter((r) => SLOT_MT[s].includes(String(r.meal_type)) && +r.kcal_per_serving > 0 && !usedIds.has(r.id));
    if (!pool.length) continue;
    const scored = pool.map((r) => { let q = Math.max(.5, Math.min(2.5, Math.round(want / r.kcal_per_serving * 4) / 4));
      const k = r.kcal_per_serving * q, p = r.protein_per_serving * q; return { r, q, sc: Math.abs(k - want) / want + .6 * Math.max(0, wantP - p) / (wantP || 1) + Math.random() * .15 }; })
      .sort((a, b) => a.sc - b.sc);
    const best = scored[0]; usedIds.add(best.r.id);
    MP.items.push(recipeItem(best.r, s, best.q));
  }
}
const recipeItem = (r, slot, q) => ({ kind: 'recipe', day: MP.day, slot, ref: r, qty: q, base: { k: +r.kcal_per_serving || 0, p: +r.protein_per_serving || 0, c: +r.carbs_per_serving || 0, f: +r.fat_per_serving || 0 } });

async function saveMP() {
  if (!MP) return;
  const btn = $('#mp-save'); btn.disabled = true;
  try {
    const title = (MP.title || '').trim() || t('mp_def', { n: firstName(NC.client) });
    const id = await rpc('coach_upsert_meal_plan', { p_id: MP.id, p_client: NC.client.client_id, p_title: title, p_notes: MP.notes || null, p_plan_type: MP.type, p_is_active: true, p_title_en: title, p_title_nl: title });
    MP.id = id;
    const ord = {}; const items = MP.items.slice().sort((a, b) => a.day - b.day || SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot)).map((it) => {
      const v = itemVals(it); const key = it.day; ord[key] = (ord[key] || 0) + 1;
      let tFr, tEn, tNl, dFr = '', dEn = '', dNl = '';
      if (it.kind === 'recipe') { tFr = it.ref.name_fr; tEn = it.ref.name_en || tFr; tNl = it.ref.name_nl || tFr;
        const q = nf(it.qty, 2); dFr = `${q} ${it.qty === 1 ? 'portion' : 'portions'}`; dEn = `${q} ${it.qty === 1 ? 'serving' : 'servings'}`; dNl = `${q} ${it.qty === 1 ? 'portie' : 'porties'}`; }
      else if (it.kind === 'food') { tFr = it.ref.name_fr; tEn = it.ref.name_en || tFr; tNl = it.ref.name_nl || tFr; dFr = dEn = dNl = `${Math.round(it.qty)} g`; }
      else { tFr = it.title; tEn = it.title_en || tFr; tNl = it.title_nl || tFr; dFr = dEn = dNl = it.desc || ''; }
      return { day_index: it.day, slot: it.slot, title: tFr, title_en: tEn, title_nl: tNl, description: dFr, description_en: dEn, description_nl: dNl,
        kcal: Math.round(v.k), protein_g: Math.round(v.p), carbs_g: Math.round(v.c), fat_g: Math.round(v.f), display_order: ord[key] };
    });
    await rpc('coach_set_meal_plan_items', { p_plan: id, p_items: items });
    MP.dirty = false; closeSheet('ov2'); toast(t('mp_saved')); viewNutriClient();
  } catch (e) { toast(errMsg(e), true); btn.disabled = false; }
}

let TD = null, TD_ALL = false;
const daysSince = (d) => d ? Math.floor((Date.now() - new Date(String(d).length <= 10 ? d + 'T12:00:00' : d).getTime()) / 864e5) : null;
const agoTxt = (d) => { const n = daysSince(d); return n == null ? t('td_never') : n <= 0 ? t('td_today') : t('td_ago', { n }); };

function tdIssues(r) {
  const out = []; // [niveau 2=rouge 1=or 0=gris, texte, action]
  if (r.unread > 0) out.push([2, t('td_unread', { n: r.unread }), 'msg']);
  if (r.checkins_todo > 0) out.push([1, t('td_checkin'), 'msg']);
  if (!r.personal) return out;
  if (r.missed_7d > 0) out.push([2, t('td_missed', { n: r.missed_7d }), 'msg']);
  const today = iso(new Date());
  if (r.active_plan && r.plan_end && r.plan_end < today) out.push([1, t('td_ended'), 'new']);
  else if (r.active_plan && r.plan_end) { const n = -daysSince(r.plan_end); if (n <= 7) out.push([1, t('td_ends', { n }), 'new']); }
  if (!r.active_plan) out.push([1, t('td_noplan'), 'new']);
  const idle = daysSince(r.last_session_at);
  if (r.active_plan && idle != null && idle >= 10) out.push([1, t('td_idle', { n: idle }), 'msg']);
  if (!r.has_targets) out.push([0, t('td_notarget'), 'food']);
  else { const f = daysSince(r.last_food); if (f == null) out.push([0, t('td_nofood0'), 'food']); else if (f >= 3) out.push([0, t('td_nofood', { n: f }), 'food']); }
  return out;
}

async function viewToday() {
  PLAN = null; setTitle(t('tab_today')); dock('');
  const v = $('#view');
  v.innerHTML = homeTabs() + `<div id="td"><div class="load" style="min-height:160px"><div class="spin"></div></div></div>`;
  bindHomeTabs();
  try { TD = (await rpc('studio_today')) || []; } catch (e) { $('#td').innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; return; }
  paintToday();
}

function paintToday() {
  const el = $('#td'); if (!el) return;
  const rows = TD.map((r) => ({ r, c: CLIENTS.find((x) => x.client_id === r.client_id) || { client_id: r.client_id, full_name: r.full_name, email: r.email }, is: tdIssues(r) }))
    .filter((x) => x.r.personal || x.is.length || TD_ALL);
  const score = (x) => x.is.reduce((s, i) => s + [1, 10, 100][i[0]], 0);
  const todo = rows.filter((x) => x.is.some((i) => i[0] > 0)).sort((a, b) => score(b) - score(a));
  const ok = rows.filter((x) => !todo.includes(x));
  TD._rows = rows;
  const hasMembers = TD.some((r) => !r.personal);
  el.innerHTML = `<div class="hero"><p>${esc(todo.length ? t('td_hero', { n: todo.length }) : t('td_hero0'))}</p></div>` +
    (todo.length ? `<div class="sect">${esc(t('td_todo'))} · ${todo.length}</div><div class="plist">${todo.map(tdCard).join('')}</div>` : '') +
    (ok.length ? `<div class="sect">${esc(t('td_ok'))} · ${ok.length}</div><div class="plist">${ok.map(tdCard).join('')}</div>` : '') +
    (hasMembers ? `<label class="tdall"><input type="checkbox" id="td-all" ${TD_ALL ? 'checked' : ''}> ${esc(t('td_members'))}</label>` : '');
  const all = $('#td-all'); if (all) all.onchange = () => { TD_ALL = all.checked; paintToday(); };
  $$('[data-td]', el).forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const x = rows.find((y) => y.r.client_id === b.dataset.id); if (!x) return;
    tdAct(b.dataset.td, x);
  });
  $$('.tdcard', el).forEach((b) => b.onclick = () => { const x = rows.find((y) => y.r.client_id === b.dataset.id); if (x) openClient360(x); });
}

function tdCard(x) {
  const { r, c, is } = x;
  const wk = r.planned_7d ? `<span class="tdwk">${esc(t('td_week', { d: r.done_7d, n: r.planned_7d }))}</span>` : '';
  const chips = is.map((i) => `<span class="tdchip l${i[0]}">${esc(i[1])}</span>`).join('');
  const lvl = is.reduce((m, i) => Math.max(m, i[0]), -1);
  return `<div class="pcard tdcard ${lvl === 2 ? 'hot' : ''}" data-id="${r.client_id}" role="button" tabindex="0">
    <div class="av">${esc(initials(c.full_name || c.email))}</div>
    <div class="tx"><b>${esc(c.full_name || c.email || '—')}</b>
      <div class="meta">${r.active_plan_title ? esc(r.active_plan_title) + ' · ' : ''}${wk || esc(t('td_last_s')) + ' : ' + esc(agoTxt(r.last_session_at))}</div>
      ${chips ? `<div class="tdchips">${chips}</div>` : ''}
      <div class="tdacts">
        <button class="tdb" data-td="msg" data-id="${r.client_id}">${ic('send')}${esc(t('td_msg'))}</button>
        <button class="tdb" data-td="${r.active_plan ? 'open' : 'new'}" data-id="${r.client_id}">${ic('cal')}${esc(t('td_prog'))}</button>
        <button class="tdb" data-td="food" data-id="${r.client_id}">${ic('bolt')}${esc(t('td_food'))}</button>
      </div></div></div>`;
}

async function tdAct(a, x) {
  const { r, c } = x;
  closeSheet('ov');
  if (a === 'msg') { location.href = 'coach.html?chat=' + encodeURIComponent(r.client_id) + '&n=' + encodeURIComponent(firstName(c) || ''); return; }
  if (a === 'food') return openNutriClient(c);
  if (a === 'new') return startWizard(c);
  if (a === 'open') {
    try {
      const pl = (await rpc('coach_list_plans', { p_client: r.client_id })) || [];
      const p = pl.find((y) => y.id === r.active_plan);
      if (p) return openPlan({ ...p, client: c });
    } catch (e) { toast(errMsg(e), true); return; }
    return startWizard(c);
  }
}

function openClient360(x) {
  const { r, c, is } = x;
  const w = r.last_weight != null ? nf(r.last_weight, 1) + ' kg' : '—';
  const dw = r.weight_delta_30d != null ? t('td_30d', { s: (r.weight_delta_30d > 0 ? '+' : '') + nf(r.weight_delta_30d, 1) }) : '';
  const pct = r.planned_7d ? Math.round(100 * r.done_7d / r.planned_7d) : null;
  const sh = openSheet('ov', shHead(c.full_name || c.email || '—', 'ov') + `<div class="sh-b">
    ${is.length ? `<div class="tdchips" style="margin:0 0 14px">${is.map((i) => `<span class="tdchip l${i[0]}">${esc(i[1])}</span>`).join('')}</div>` : ''}
    <div class="tdstats">
      <div><small>${esc(t('td_plan'))}</small><b>${esc(r.active_plan_title || '—')}</b>${r.plan_end ? `<span>${esc(t('td_until', { d: fmtShort(parse(r.plan_end)) }))}</span>` : ''}</div>
      <div><small>7 j</small><b>${pct == null ? '—' : pct + ' %'}</b>${r.planned_7d ? `<span>${r.done_7d}/${r.planned_7d}</span>` : ''}</div>
      <div><small>${esc(t('td_last_s'))}</small><b>${esc(agoTxt(r.last_session_at))}</b></div>
      <div><small>${esc(t('td_last_f'))}</small><b>${esc(agoTxt(r.last_food))}</b></div>
      <div><small>${esc(t('td_weight'))}</small><b>${esc(w)}</b>${dw ? `<span>${esc(dw)}</span>` : ''}</div>
    </div>
    <div class="tdbig">
      <button class="btn main block" data-a="msg">${ic('send')} ${esc(t('td_msg'))}</button>
      ${r.active_plan ? `<button class="btn block" data-a="open">${ic('cal')} ${esc(t('td_open'))}</button>` : ''}
      <button class="btn block" data-a="new">${ic('plus')} ${esc(t('td_new'))}</button>
      <button class="btn block" data-a="food">${ic('bolt')} ${esc(t('td_calc'))}</button>
    </div></div>`);
  $$('[data-a]', sh).forEach((b) => b.onclick = () => tdAct(b.dataset.a, x));
}

boot().catch((e) => { console.error(e); $('#view').innerHTML = `<div class="gate"><h2>${esc(t('err'))}</h2><p>${esc(String(e && e.message || e))}</p></div>`; });
