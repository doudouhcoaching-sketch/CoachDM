<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5FB" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F1C" />
<title>Coach DM · Admin</title>
<style>
  :root{
    --bg:#F4F5FB; --bg-2:#ECEDF8; --surface:#FFFFFF; --surface-2:#F0F1F9; --line:#E3E4F0;
    --text:#14152A; --muted:#63667F; --brand:#6D5EF6; --brand-2:#9B6CFF; --brand-soft:rgba(109,94,246,.12);
    --ok:#10B981; --warn:#EF4444; --amber:#D4AF37;
    --shadow:0 10px 34px rgba(22,22,48,.09); --shadow-soft:0 4px 16px rgba(22,22,48,.06);
    --radius:20px; --radius-sm:13px;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0E0F1C; --bg-2:#121327; --surface:#181A2C; --surface-2:#21243B; --line:#2B2E48;
    --text:#F3F4FB; --muted:#9A9EBC; --brand:#8E7CFF; --brand-2:#B69BFF; --brand-soft:rgba(142,124,255,.16);
    --ok:#34D399; --warn:#F87171;
    --shadow:0 14px 40px rgba(0,0,0,.45); --shadow-soft:0 6px 20px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,var(--bg-2),var(--bg) 30%);color:var(--text);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input{font-family:inherit;font-size:16px}
  .hidden{display:none!important}
  .screen{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;max-width:440px;margin:0 auto}
  .mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;
    background:linear-gradient(145deg,var(--brand),var(--brand-2));box-shadow:0 12px 30px rgba(109,94,246,.4);
    font-weight:800;font-size:26px;color:#fff}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;text-align:center}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.5px}
  .field input{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--surface-2);color:var(--text);outline:none}
  .field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .btn{width:100%;padding:14px;border-radius:var(--radius-sm);font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 22px rgba(109,94,246,.36)}
  .btn:active{transform:scale(.99)}
  .btn.subtle{background:var(--surface-2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);box-shadow:none;border:1.5px solid var(--warn)}
  .btn.sm{width:auto;padding:8px 13px;font-size:13px;border-radius:11px}
  .btn[disabled]{opacity:.55;pointer-events:none}
  .msg{margin-top:12px;font-size:13px;text-align:center;min-height:16px}
  .msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}

  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:blur(16px);padding:calc(14px + env(safe-area-inset-top)) 18px 0;border-bottom:1px solid var(--line)}
  .topbar .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .topbar h2{margin:0;font-size:20px;font-weight:800}
  .tabs{display:flex;gap:8px}
  .tabs button{flex:1;padding:11px;border-radius:12px 12px 0 0;font-weight:700;font-size:14px;color:var(--muted);background:transparent;border-bottom:2.5px solid transparent}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .page{padding:16px 16px 60px;max-width:680px;margin:0 auto}
  .pane{display:none} .pane.active{display:block}

  .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-soft);padding:14px;margin-bottom:11px}
  .item .nm{font-weight:700;font-size:15px}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px}
  .pill.ok{background:rgba(16,185,129,.15);color:var(--ok)}
  .pill.no{background:rgba(239,68,68,.13);color:var(--warn)}
  .pill.role{background:var(--brand-soft);color:var(--brand)}
  .pill.verif{background:rgba(212,175,55,.18);color:var(--amber)}

  .search-row{display:flex;gap:8px;margin-bottom:12px}
  .search-row input{flex:1;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--surface-2);color:var(--text);outline:none}
  .search-row input:focus{border-color:var(--brand)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
  .chk input{width:18px;height:18px;accent-color:var(--brand)}

  .overlay{position:fixed;inset:0;z-index:60;background:rgba(8,8,20,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .25s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet h3{margin:0 0 16px;font-size:18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:rot .7s linear infinite;margin:30px auto}
  @keyframes rot{to{transform:rotate(360deg)}}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:20px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="boot" class="screen"><div class="spin"></div></div>

<div id="auth" class="screen hidden">
  <div class="card">
    <div class="mark">DM</div>
    <h1>Console Coach</h1>
    <p class="sub">Réservé à l'administration Coach DM</p>
    <div class="field"><label>Email</label><input id="au-email" type="email" inputmode="email" placeholder="doudouh.coaching@gmail.com" /></div>
    <div class="field"><label>Mot de passe</label><input id="au-pass" type="password" placeholder="••••••••" /></div>
    <button class="btn" id="au-login">Se connecter</button>
    <div class="msg" id="au-msg"></div>
  </div>
</div>

<div id="gate" class="screen hidden">
  <div class="card" style="text-align:center">
    <div class="mark" style="background:var(--warn);box-shadow:none">✕</div>
    <h1>Accès refusé</h1>
    <p class="sub">Ce compte n'est pas administrateur.</p>
    <button class="btn subtle" id="gate-out">Se déconnecter</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="row"><h2>Console Coach</h2><button class="btn subtle sm" id="logout">Déconnexion</button></div>
    <div class="tabs">
      <button class="on" data-tab="members">Membres</button>
      <button data-tab="foods">Aliments</button>
    </div>
  </div>

  <div class="page">
    <div class="pane active" id="pane-members">
      <div class="toolbar"><div class="sub" style="text-align:left;margin:0">Donne ou retire l'accès à l'app.</div>
        <button class="btn subtle sm" id="m-refresh">↻ Actualiser</button></div>
      <div id="m-list"><div class="spin"></div></div>
    </div>

    <div class="pane" id="pane-foods">
      <div class="search-row">
        <input id="f-q" type="text" placeholder="Chercher un aliment…" enterkeyhint="search" />
        <button class="btn sm" id="f-search" style="padding:0 16px">Chercher</button>
      </div>
      <div class="toolbar">
        <label class="chk"><input type="checkbox" id="f-unverif" /> Non vérifiés seulement</label>
        <button class="btn sm" id="f-new">＋ Nouvel aliment</button>
      </div>
      <div id="f-list"><p class="empty">Cherche un aliment ou ajoute-en un.</p></div>
    </div>
  </div>
</div>

<!-- FOOD EDITOR -->
<div class="overlay" id="ov">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="ed-title">Éditer l'aliment</h3>
    <div class="field"><label>Nom FR</label><input id="ed-fr" type="text" /></div>
    <div class="row2">
      <div class="field"><label>Nom EN</label><input id="ed-en" type="text" /></div>
      <div class="field"><label>Nom NL</label><input id="ed-nl" type="text" /></div>
    </div>
    <div class="field"><label>Marque (optionnel)</label><input id="ed-brand" type="text" /></div>
    <div class="row2">
      <div class="field"><label>Kcal / 100g</label><input id="ed-kcal" type="number" inputmode="decimal" /></div>
      <div class="field"><label>Portion (g)</label><input id="ed-serving" type="number" inputmode="numeric" /></div>
    </div>
    <div class="row2">
      <div class="field"><label>Protéines /100g</label><input id="ed-p" type="number" inputmode="decimal" /></div>
      <div class="field"><label>Glucides /100g</label><input id="ed-c" type="number" inputmode="decimal" /></div>
    </div>
    <div class="row2">
      <div class="field"><label>Lipides /100g</label><input id="ed-f" type="number" inputmode="decimal" /></div>
      <div class="field"><label>Fibres /100g</label><input id="ed-fib" type="number" inputmode="decimal" /></div>
    </div>
    <label class="chk" style="margin:4px 0 16px"><input type="checkbox" id="ed-verif" /> Aliment vérifié (apparaît en priorité)</label>
    <button class="btn" id="ed-save">Enregistrer</button>
    <button class="btn danger" id="ed-delete" style="margin-top:9px">Supprimer</button>
    <button class="btn subtle" id="ed-cancel" style="margin-top:9px">Annuler</button>
    <div class="msg" id="ed-msg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://kkcmhviyvttwpaclrjmv.supabase.co','sb_publishable_XA3iF2j17_cNROPNaG9JuQ_1Swkbz8b');
const $ = s=>document.querySelector(s);
let EDIT=null;
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r0 = n=>Math.round(n||0);
function show(id){['boot','auth','gate'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));$('#app').classList.toggle('hidden',id!=='app');}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);}
function setMsg(id,t,c){const e=$('#'+id);e.textContent=t;e.className='msg '+(c||'');}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session?.user) await enter(session.user); else show('auth');
}
$('#au-login').onclick = async ()=>{
  const email=$('#au-email').value.trim(), pass=$('#au-pass').value;
  if(!email||!pass) return setMsg('au-msg','Email et mot de passe requis.','err');
  $('#au-login').disabled=true; setMsg('au-msg','Connexion…','');
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  $('#au-login').disabled=false;
  if(error) return setMsg('au-msg','Email ou mot de passe incorrect.','err');
  setMsg('au-msg','',''); await enter(data.user);
};
$('#gate-out').onclick = $('#logout').onclick = async ()=>{ await sb.auth.signOut(); show('auth'); };

async function enter(user){
  show('boot');
  const { data:prof } = await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  if(!prof || !['coach','admin'].includes(prof.role)){ show('gate'); return; }
  show('app'); switchTab('members'); loadUsers();
}

/* ---- TABS ---- */
function switchTab(t){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  $('#pane-'+t).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ---- MEMBRES ---- */
$('#m-refresh').onclick = loadUsers;
async function loadUsers(){
  $('#m-list').innerHTML='<div class="spin"></div>';
  const { data, error } = await sb.rpc('admin_list_users');
  if(error){ $('#m-list').innerHTML='<p class="empty">Erreur de chargement.</p>'; return; }
  if(!data||!data.length){ $('#m-list').innerHTML='<p class="empty">Aucun inscrit.</p>'; return; }
  $('#m-list').innerHTML = data.map(u=>{
    const access = u.has_access ? '<span class="pill ok">Accès</span>' : '<span class="pill no">Sans accès</span>';
    const role = u.role && u.role!=='client' ? `<span class="pill role">${esc(u.role)}</span>` : '';
    let detail='';
    if(u.sub_status) detail = u.sub_status + (u.trial_end?` · essai → ${u.trial_end.slice(0,10)}`:'') + (u.current_period_end?` · jusqu'au ${u.current_period_end.slice(0,10)}`:'');
    return `<div class="item">
      <div class="nm">${esc(u.email||'—')} ${access} ${role}</div>
      <div class="meta">${esc(u.full_name||'')}${detail?' · '+esc(detail):''}</div>
      <div class="acts">
        <button class="btn subtle sm" data-grant="7" data-u="${u.user_id}">Essai 7j</button>
        <button class="btn subtle sm" data-grant="0" data-u="${u.user_id}">Illimité</button>
        <button class="btn danger sm" data-revoke="${u.user_id}">Révoquer</button>
      </div></div>`;
  }).join('');
  document.querySelectorAll('[data-grant]').forEach(b=>b.onclick=()=>grant(b.dataset.u,+b.dataset.grant));
  document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>revoke(b.dataset.revoke));
}
async function grant(uid,days){
  const { error } = await sb.rpc('admin_grant_access',{ p_user:uid, p_days:days });
  if(error){ toast('Échec'); return; }
  toast(days>0?'Essai 7j accordé':'Accès illimité accordé'); loadUsers();
}
async function revoke(uid){
  const { error } = await sb.rpc('admin_revoke_access',{ p_user:uid });
  if(error){ toast('Échec'); return; }
  toast('Accès révoqué'); loadUsers();
}

/* ---- ALIMENTS ---- */
$('#f-search').onclick = searchFoods;
$('#f-q').addEventListener('keydown',e=>{ if(e.key==='Enter') searchFoods(); });
$('#f-unverif').onchange = searchFoods;
async function searchFoods(){
  const q=$('#f-q').value.trim(), only=$('#f-unverif').checked;
  $('#f-list').innerHTML='<div class="spin"></div>';
  const { data, error } = await sb.rpc('admin_search_foods',{ p_q:q, p_only_unverified:only, p_limit:60 });
  if(error){ $('#f-list').innerHTML='<p class="empty">Erreur (accès admin requis).</p>'; return; }
  if(!data||!data.length){ $('#f-list').innerHTML='<p class="empty">Aucun aliment.</p>'; return; }
  window.__F = {}; data.forEach(f=>window.__F[f.id]=f);
  $('#f-list').innerHTML = data.map(f=>`
    <div class="item" data-id="${f.id}">
      <div class="nm">${esc(f.name_fr)} ${f.is_verified?'<span class="pill verif">Vérifié</span>':''}</div>
      <div class="meta">${f.brand?esc(f.brand)+' · ':''}${r0(f.kcal)} kcal · P${r0(f.protein)} G${r0(f.carbs)} L${r0(f.fat)} F${r0(f.fiber)} /100g</div>
    </div>`).join('');
  document.querySelectorAll('#f-list .item').forEach(el=>el.onclick=()=>openEditor(window.__F[el.dataset.id]));
}

function openEditor(f){
  EDIT = f || null;
  $('#ed-title').textContent = f ? 'Éditer l\'aliment' : 'Nouvel aliment';
  $('#ed-fr').value=f?f.name_fr||'':''; $('#ed-en').value=f?f.name_en||'':''; $('#ed-nl').value=f?f.name_nl||'':'';
  $('#ed-brand').value=f?f.brand||'':'';
  $('#ed-kcal').value=f?f.kcal:''; $('#ed-serving').value=f?f.serving:100;
  $('#ed-p').value=f?f.protein:''; $('#ed-c').value=f?f.carbs:''; $('#ed-f').value=f?f.fat:''; $('#ed-fib').value=f?(f.fiber??''):'';
  $('#ed-verif').checked = f?!!f.is_verified:true;
  $('#ed-delete').style.display = f ? 'block':'none';
  setMsg('ed-msg','','');
  $('#ov').classList.add('show');
}
function closeEditor(){ $('#ov').classList.remove('show'); EDIT=null; }
$('#ed-cancel').onclick = closeEditor;
$('#ov').onclick = e=>{ if(e.target.id==='ov') closeEditor(); };
const numOrNull = v=>{ const n=parseFloat(v); return isNaN(n)?null:n; };

$('#ed-save').onclick = async ()=>{
  const fr=$('#ed-fr').value.trim();
  if(!fr) return setMsg('ed-msg','Le nom FR est requis.','err');
  const kcal=numOrNull($('#ed-kcal').value);
  if(kcal==null) return setMsg('ed-msg','Les kcal/100g sont requises.','err');
  $('#ed-save').disabled=true; setMsg('ed-msg','Enregistrement…','');
  const { error } = await sb.rpc('admin_upsert_food',{
    p_id: EDIT?EDIT.id:null, p_name_fr:fr, p_name_en:$('#ed-en').value.trim()||null,
    p_name_nl:$('#ed-nl').value.trim()||null, p_brand:$('#ed-brand').value.trim()||null,
    p_kcal:kcal, p_protein:numOrNull($('#ed-p').value)||0, p_carbs:numOrNull($('#ed-c').value)||0,
    p_fat:numOrNull($('#ed-f').value)||0, p_fiber:numOrNull($('#ed-fib').value),
    p_serving:numOrNull($('#ed-serving').value)||100, p_verified:$('#ed-verif').checked
  });
  $('#ed-save').disabled=false;
  if(error){ setMsg('ed-msg','Échec de l\'enregistrement.','err'); return; }
  closeEditor(); toast('Enregistré ✓'); searchFoods();
};
$('#ed-delete').onclick = async ()=>{
  if(!EDIT) return;
  if(!confirm('Supprimer définitivement cet aliment ?')) return;
  $('#ed-delete').disabled=true;
  const { data, error } = await sb.rpc('admin_delete_food',{ p_id:EDIT.id });
  $('#ed-delete').disabled=false;
  if(error){ setMsg('ed-msg','Échec de la suppression.','err'); return; }
  if(data===false){ setMsg('ed-msg','Impossible : cet aliment est utilisé dans des journaux. Décoche « vérifié » à la place.','err'); return; }
  closeEditor(); toast('Supprimé'); searchFoods();
};
$('#f-new').onclick = ()=>openEditor(null);

boot();
</script>
</body>
</html>
