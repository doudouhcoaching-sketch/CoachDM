<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Coach DM · Console</title>
<meta name="theme-color" content="#0A0A0A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coach DM Admin" />
<style>
  :root{--bg:#0A0A0A;--surface:#141414;--alt:#1C1C1C;--border:#2A2A2A;--gold:#D4AF37;
    --text:#F5F5F5;--dim:#9A9A9A;--red:#EF4444;--green:#10B981;--blue:#38BDF8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{color:var(--gold);font-size:22px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;color:var(--dim);font-size:12px;margin:10px 0 5px}
  input{width:100%;background:var(--alt);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:16px;padding:12px 14px;-webkit-appearance:none}
  button{background:var(--gold);color:#0A0A0A;border:none;border-radius:10px;padding:13px;
    font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}
  button.sec{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  button.ghost{background:var(--alt);color:var(--text);border:1px solid var(--border);font-weight:600}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .err{color:var(--red);font-size:13px;margin-top:10px}
  .hidden{display:none!important}
  .row{display:flex;gap:8px}.row>button{margin-top:0;font-size:12px;padding:9px 6px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .urow{border-top:1px solid var(--border);padding:13px 0}
  .urow:first-child{border-top:none}
  .name{font-size:15px;font-weight:600}
  .meta{font-size:12px;color:var(--dim);margin:2px 0 9px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid}
  .pill.ok{color:var(--green);border-color:var(--green)}
  .pill.wait{color:var(--red);border-color:var(--red)}
  .pill.staff{color:var(--gold);border-color:var(--gold)}
  .filterbar{display:flex;gap:8px;margin-bottom:12px}
  .filterbar button{margin-top:0;font-size:12px;padding:8px}
  .filterbar button.on{background:var(--gold);color:#0A0A0A}
  .filterbar button.off{background:var(--alt);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <!-- LOGIN -->
  <div id="screenAuth">
    <div style="text-align:center;margin:24px 0 16px">
      <h1>COACH DM · Console</h1>
      <div class="sub">Espace coach</div>
    </div>
    <div class="card">
      <label>Email</label>
      <input id="email" type="email" autocapitalize="off" autocorrect="off" />
      <label>Mot de passe</label>
      <input id="pwd" type="password" />
      <button onclick="doLogin()">Se connecter</button>
      <div class="err hidden" id="authErr"></div>
    </div>
  </div>

  <!-- DENIED -->
  <div id="screenDenied" class="hidden">
    <div class="card" style="text-align:center;margin-top:60px">
      <h1>Accès refusé</h1>
      <p class="sub">Cette console est réservée au coach.</p>
      <button class="ghost" onclick="doLogout()">Se déconnecter</button>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="screenAdmin" class="hidden">
    <div class="top">
      <div><h1>Membres</h1><div class="sub" id="counts"></div></div>
      <button class="ghost" style="width:auto;margin:0;padding:9px 12px" onclick="loadUsers()">↻</button>
    </div>
    <div class="filterbar">
      <button id="fAll" class="on" onclick="setFilter('all')">Tous</button>
      <button id="fWait" class="off" onclick="setFilter('wait')">En attente</button>
      <button id="fOk" class="off" onclick="setFilter('ok')">Actifs</button>
    </div>
    <div class="card" id="list"><div class="sub">Chargement…</div></div>
    <button class="ghost" onclick="doLogout()">Se déconnecter</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const SUPABASE_URL = "https://kkcmhviyvttwpaclrjmv.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_XA3iF2j17_cNROPNaG9JuQ_1Swkbz8b";
const sb = createClient(SUPABASE_URL, PUBLISHABLE_KEY);
const $ = (id)=>document.getElementById(id);
let allUsers=[], filter="all";

function show(el){ ["screenAuth","screenDenied","screenAdmin"].forEach(i=>$(i).classList.add("hidden")); $(el).classList.remove("hidden"); }

(async()=>{ const { data } = await sb.auth.getSession(); if(data.session) gate(); else show("screenAuth"); })();

window.doLogin=async()=>{
  $("authErr").classList.add("hidden");
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pwd").value });
  if(error){ const e=$("authErr"); e.textContent=error.message; e.classList.remove("hidden"); return; }
  gate();
};
window.doLogout=async()=>{ await sb.auth.signOut(); show("screenAuth"); };

async function gate(){
  const { data:{user} } = await sb.auth.getUser();
  const { data:prof } = await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();
  if(prof && (prof.role==="coach"||prof.role==="admin")){ show("screenAdmin"); loadUsers(); }
  else show("screenDenied");
}

window.setFilter=(f)=>{ filter=f;
  $("fAll").className=f==="all"?"on":"off"; $("fWait").className=f==="wait"?"on":"off"; $("fOk").className=f==="ok"?"on":"off";
  render();
};

window.loadUsers=async()=>{
  $("list").innerHTML='<div class="sub">Chargement…</div>';
  const { data,error } = await sb.rpc("admin_list_users");
  if(error){ $("list").innerHTML='<div class="err">Erreur : '+error.message+'</div>'; return; }
  allUsers=data||[]; render();
};

function statusInfo(u){
  if(u.role==="coach"||u.role==="admin") return {cls:"staff",label:u.role==="coach"?"Coach":"Admin"};
  if(!u.has_access) return {cls:"wait",label:"En attente"};
  if(u.sub_status==="trialing") return {cls:"ok",label:"Essai"+(u.trial_end?" → "+new Date(u.trial_end).toLocaleDateString("fr-BE"):"")};
  if(u.sub_status==="active") return {cls:"ok",label:"Abonné"};
  return {cls:"ok",label:"Actif"};
}

function render(){
  const waiting=allUsers.filter(u=>!u.has_access).length;
  const active=allUsers.filter(u=>u.has_access&&u.role!=="coach"&&u.role!=="admin").length;
  $("counts").textContent=`${allUsers.length} inscrits · ${waiting} en attente · ${active} actifs`;
  let list=allUsers;
  if(filter==="wait") list=allUsers.filter(u=>!u.has_access);
  if(filter==="ok") list=allUsers.filter(u=>u.has_access&&u.role!=="coach"&&u.role!=="admin");
  if(!list.length){ $("list").innerHTML='<div class="sub">Aucun membre dans cette catégorie.</div>'; return; }
  $("list").innerHTML=list.map(u=>{
    const s=statusInfo(u); const staff=(u.role==="coach"||u.role==="admin");
    const date=u.created_at?new Date(u.created_at).toLocaleDateString("fr-BE",{day:"numeric",month:"short",year:"numeric"}):"";
    const btns = staff ? "" :
      `<div class="row">
         <button class="sec" onclick="grant('${u.user_id}',7)">Essai 7j</button>
         <button class="sec" onclick="grant('${u.user_id}',0)">Illimité</button>
         ${u.has_access?`<button class="danger" onclick="revoke('${u.user_id}')">Révoquer</button>`:""}
       </div>`;
    return `<div class="urow">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div><div class="name">${u.full_name||u.email||"—"}</div>
          <div class="meta">${u.email||""}<br>Inscrit le ${date}</div></div>
        <span class="pill ${s.cls}">${s.label}</span>
      </div>${btns}</div>`;
  }).join("");
}

window.grant=async(uid,days)=>{
  const { error } = await sb.rpc("admin_grant_access",{ p_user:uid, p_days:days });
  if(error){ alert("Erreur : "+error.message); return; }
  loadUsers();
};
window.revoke=async(uid)=>{
  if(!confirm("Retirer l'accès à ce membre ?")) return;
  const { error } = await sb.rpc("admin_revoke_access",{ p_user:uid });
  if(error){ alert("Erreur : "+error.message); return; }
  loadUsers();
};
</script>
</body>
</html>
