<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach DM · Offre Coach</title>
<meta name="description" content="L'offre Coach de Coach DM : gratuit jusqu'à 3 clients, puis clients illimités, programmes Coach DM, assistant et nutrition au gramme près pour 39,99 € par mois.">
<link rel="canonical" href="https://coachdm.be/offre-coach.html">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0B0B0A;--s1:#151513;--s2:#1D1C19;--line:rgba(244,241,233,.08);--text:#F4F1E9;--muted:#A8A396;--gold:#DCBB72;--gold2:#C9A24E;--grad:linear-gradient(180deg,#E6C987,#C9A24E);--ink:#0B0B0A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,-apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:38px;height:38px;border-radius:11px}
.logo b{font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:var(--gold)}
.lang{display:flex;gap:4px;background:var(--s1);border-radius:999px;padding:4px}
.lang button{border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--grad);color:var(--ink)}
.hero{text-align:center;padding:56px 0 30px}
.eb{font:600 12px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{font:700 clamp(40px,7vw,66px)/1.02 'Barlow Condensed',sans-serif;margin:14px auto 14px;max-width:780px}
.hero p{color:var(--muted);font-size:18px;max-width:640px;margin:0 auto}
.grid{display:grid;gap:16px;margin-top:34px}
@media(min-width:820px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--s1);border-radius:26px;padding:26px 24px;display:flex;flex-direction:column}
.card.gold{background:linear-gradient(180deg,rgba(220,187,114,.12),rgba(220,187,114,.03)),var(--s1);box-shadow:inset 0 0 0 1.5px rgba(220,187,114,.55)}
.card h2{font:700 30px/1 'Barlow Condensed',sans-serif;margin:8px 0 6px}
.price{font:700 46px/1 'Barlow Condensed',sans-serif;color:var(--gold);margin:12px 0 4px}
.price small{font:500 15px Inter,sans-serif;color:var(--muted);margin-left:4px}
.sub{color:var(--muted);font-size:14px}
ul{list-style:none;margin:18px 0 0;padding:0}
li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
li:first-child{border-top:0}
li i{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(220,187,114,.16);display:grid;place-items:center;margin-top:1px}
li i svg{width:13px;height:13px;color:var(--gold)}
li.no{color:var(--muted)}
li.no i{background:rgba(244,241,233,.06)}
li.no i svg{color:var(--muted)}
.cta{display:block;text-align:center;text-decoration:none;margin-top:auto;padding:15px 18px;border-radius:999px;background:var(--grad);color:var(--ink);font-weight:700;font-size:15.5px}
.cta.ghost{background:var(--s2);color:var(--text)}
.sp{height:20px}
h3{font:700 34px/1.05 'Barlow Condensed',sans-serif;margin:64px 0 18px;text-align:center}
.steps{display:grid;gap:14px}
@media(min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--s1);border-radius:22px;padding:22px}
.step .n{font:700 34px 'Barlow Condensed',sans-serif;color:var(--gold)}
.step b{display:block;font-size:16.5px;margin:4px 0 6px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.faq{max-width:760px;margin:0 auto}
details{background:var(--s1);border-radius:18px;padding:16px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
details p{color:var(--muted);margin:10px 0 0;font-size:15px}
footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="index.html"><img src="logo-dm.png" alt=""><b>COACH DM</b></a>
    <div class="lang" id="lang"><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="nl">NL</button></div>
  </div>

  <section class="hero">
    <div class="eb" data-t="eb"></div>
    <h1 data-t="h1"></h1>
    <p data-t="lead"></p>
  </section>

  <div class="grid">
    <div class="card">
      <div class="eb" data-t="free_eb"></div>
      <h2 data-t="free_h"></h2>
      <div class="price">0 €<small data-t="free_per"></small></div>
      <div class="sub" data-t="free_sub"></div>
      <ul id="free-list"></ul>
      <div class="sp"></div>
      <a class="cta ghost" href="app.html" data-t="free_cta"></a>
    </div>
    <div class="card gold" id="coach">
      <div class="eb" data-t="coach_eb"></div>
      <h2 data-t="coach_h"></h2>
      <div class="price">39,99 €<small data-t="per_m"></small></div>
      <div class="sub" data-t="coach_sub"></div>
      <ul id="coach-list"></ul>
      <div class="sp"></div>
      <a class="cta" href="tarifs.html" data-t="coach_cta"></a>
    </div>
  </div>

  <h3 data-t="how_h"></h3>
  <div class="steps">
    <div class="step"><div class="n">1</div><b data-t="s1_h"></b><p data-t="s1_p"></p></div>
    <div class="step"><div class="n">2</div><b data-t="s2_h"></b><p data-t="s2_p"></p></div>
    <div class="step"><div class="n">3</div><b data-t="s3_h"></b><p data-t="s3_p"></p></div>
  </div>

  <h3 data-t="faq_h"></h3>
  <div class="faq" id="faq"></div>

  <footer><span data-t="foot"></span> · <a href="mailto:contact@coachdm.be">contact@coachdm.be</a> · <a href="conditions.html" data-t="terms"></a> · <a href="privacy.html" data-t="priv"></a></footer>
</div>
<script>
const T={
 eb:['Offre Coach','Coach plan','Coach-abonnement'],
 h1:['Coache tes clients avec Coach DM','Coach your clients with Coach DM','Coach je klanten met Coach DM'],
 lead:['Tes clients, leurs séances, leurs repas et vos messages, au même endroit. Commence gratuitement avec 3 clients.','Your clients, their workouts, their meals and your messages, in one place. Start free with 3 clients.','Je klanten, hun trainingen, hun maaltijden en jullie berichten, op één plek. Begin gratis met 3 klanten.'],
 free_eb:['Pour commencer','To get started','Om te beginnen'],
 free_h:['Coach gratuit','Free coach','Gratis coach'],
 free_per:[' pour toujours',' forever',' voor altijd'],
 free_sub:['Tu fais tout toi-même, à la main.','You do everything yourself, by hand.','Je doet alles zelf, met de hand.'],
 free_cta:['Devenir coach gratuitement','Become a coach for free','Gratis coach worden'],
 coach_eb:['Le plus complet','The full toolkit','Het meest complete'],
 coach_h:['Coach','Coach','Coach'],
 per_m:[' / mois',' / month',' / maand'],
 coach_sub:['Ou 399 € par an. Sans engagement.','Or €399 per year. No commitment.','Of € 399 per jaar. Zonder verplichting.'],
 coach_cta:['Choisir l’offre Coach','Choose the Coach plan','Kies het Coach-abonnement'],
 how_h:['Comment ça marche','How it works','Hoe het werkt'],
 s1_h:['Tu invites ton client','You invite your client','Je nodigt je klant uit'],
 s1_p:['Par email ou QR code, depuis la console coach. Il accepte dans son app : rien n’est partagé sans son accord.','By email or QR code, from the coach console. They accept in their app: nothing is shared without their consent.','Via e-mail of QR-code, vanuit de coachconsole. Hij aanvaardt in zijn app: niets wordt gedeeld zonder zijn akkoord.'],
 s2_h:['Tu lui envoies son programme','You send their program','Je stuurt zijn programma'],
 s2_p:['Séances, programme et plan repas arrivent dans son app, avec une grande alerte. Vous vous parlez dans la messagerie.','Workouts, program and meal plan land in their app with a big alert. You talk in the messaging.','Trainingen, programma en maaltijdplan komen in zijn app met een grote melding. Jullie praten via de berichten.'],
 s3_h:['Tu suis ses progrès','You follow their progress','Je volgt zijn vooruitgang'],
 s3_p:['Séances faites, charges, repas notés, bilans : tu vois tout et tu ajustes.','Completed workouts, loads, logged meals, check-ins: you see everything and adjust.','Gedane trainingen, gewichten, genoteerde maaltijden, check-ins: je ziet alles en stuurt bij.'],
 faq_h:['Questions fréquentes','Frequently asked questions','Veelgestelde vragen'],
 foot:['Coach DM','Coach DM','Coach DM'], terms:['Conditions','Terms','Voorwaarden'], priv:['Confidentialité','Privacy','Privacy']
};
const FREE=[
 [1,['3 clients','3 clients','3 klanten']],
 [1,['La messagerie avec tes clients','Messaging with your clients','Berichten met je klanten']],
 [1,['Tes propres séances et programmes','Your own workouts and programs','Je eigen trainingen en programma’s']],
 [1,['Tes plans repas, composés à la main','Your meal plans, put together by hand','Je maaltijdplannen, met de hand samengesteld']],
 [1,['Le suivi de tes clients','Following your clients','Je klanten opvolgen']],
 [0,['Les programmes Coach DM','Coach DM programs','De Coach DM-programma’s']],
 [0,['L’assistant qui crée les programmes','The assistant that builds programs','De assistent die programma’s bouwt']],
 [0,['La nutrition calculée au gramme près','Nutrition calculated to the gram','Voeding tot op de gram berekend']]];
const COACH=[
 ['Clients illimités','Unlimited clients','Onbeperkt klanten'],
 ['Les programmes Coach DM pour tes clients','Coach DM programs for your clients','De Coach DM-programma’s voor je klanten'],
 ['L’assistant qui crée les programmes','The assistant that builds programs','De assistent die programma’s bouwt'],
 ['Les plans repas calculés au gramme près','Meal plans calculated to the gram','Maaltijdplannen tot op de gram berekend'],
 ['Messagerie, visios et vidéos','Messaging, video calls and videos','Berichten, videogesprekken en video’s'],
 ['Tes clients ne paient rien pour suivre ton programme','Your clients pay nothing to follow your program','Je klanten betalen niets om je programma te volgen']];
const FAQ=[
 [['Mes clients doivent-ils payer ?','Do my clients have to pay?','Moeten mijn klanten betalen?'],['Non. Ton client accède gratuitement au programme que tu lui envoies, à vos messages et à son suivi. S’il veut le reste de l’app (programmes Coach DM, Coach IA, analyses vidéo…), il peut prendre l’abonnement Premium.','No. Your client gets the program you send, your messages and their tracking for free. If they want the rest of the app (Coach DM programs, AI Coach, video analyses…), they can take the Premium subscription.','Nee. Je klant krijgt gratis het programma dat je stuurt, jullie berichten en zijn opvolging. Wil hij de rest van de app (Coach DM-programma’s, AI-coach, video-analyses…), dan kan hij Premium nemen.']],
 [['Que se passe-t-il si j’arrête l’offre Coach ?','What happens if I stop the Coach plan?','Wat gebeurt er als ik stop met het Coach-abonnement?'],['Tu repasses au palier gratuit. Tes clients, programmes, plans repas et messages sont conservés.','You go back to the free tier. Your clients, programs, meal plans and messages are kept.','Je gaat terug naar het gratis niveau. Je klanten, programma’s, maaltijdplannen en berichten blijven bewaard.']],
 [['Quelle est la différence entre un coach gratuit et l’offre Coach ?','What is the difference between a free coach and the Coach plan?','Wat is het verschil tussen een gratis coach en het Coach-abonnement?'],['Le coach gratuit suit 3 clients et fait tout lui-même. L’offre Coach ouvre les clients illimités, les programmes Coach DM, l’assistant qui crée les programmes et la nutrition calculée au gramme près.','A free coach follows 3 clients and does everything by hand. The Coach plan unlocks unlimited clients, Coach DM programs, the program assistant and nutrition calculated to the gram.','Een gratis coach volgt 3 klanten en doet alles zelf. Het Coach-abonnement opent onbeperkt klanten, de Coach DM-programma’s, de programma-assistent en voeding tot op de gram.']],
 [['Puis-je résilier quand je veux ?','Can I cancel anytime?','Kan ik altijd opzeggen?'],['Oui, sans engagement, en un clic.','Yes, no commitment, in one click.','Ja, zonder verplichting, met één klik.']]];
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L='fr'; try{ L=localStorage.getItem('cdm_lang')||((navigator.language||'fr').slice(0,2)); }catch(_){}
if(!['fr','en','nl'].includes(L)) L='en';
function paint(){
  const i={fr:0,en:1,nl:2}[L]; document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent=T[e.dataset.t][i]; });
  document.getElementById('free-list').innerHTML=FREE.map(([ok,x])=>`<li class="${ok?'':'no'}"><i>${ok?CK:NO}</i><span>${esc(x[i])}</span></li>`).join('');
  document.getElementById('coach-list').innerHTML=COACH.map(x=>`<li><i>${CK}</i><span>${esc(x[i])}</span></li>`).join('');
  document.getElementById('faq').innerHTML=FAQ.map(([q,a])=>`<details><summary>${esc(q[i])}</summary><p>${esc(a[i])}</p></details>`).join('');
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{ localStorage.setItem('cdm_lang',L); }catch(_){} paint(); });
paint();
</script>
</body>
</html>
